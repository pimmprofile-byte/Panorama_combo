# Render 블루프린트 — "Deploy to Render" 버튼이 이 파일을 읽어 자동 배포한다.
# 좌석이 전부 사람이라 LLM 키가 없어도 그대로 돈다 — 넣을 값이 사실상 없다.
services:
  - type: web
    name: panorama-combo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: AGENT_KEY           # 진행석을 코드 세션이 원격으로 잡을 때 쓰는 임의 문자열. 안 쓰면 비워둔다
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
