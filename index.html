  try{ const b=await (await fetch("/api/build")).json(); ASSET_V=(b&&b.sha)||""; }catch(e){}
}
const assetURL=u=>ASSET_V?`${u}?v=${encodeURIComponent(ASSET_V)}`:u;
function avaHTML(c,cls){
  if(!c) return `<span class="ava noimg ${cls||""}" data-emo="?"></span>`;
  const sid=(STATE&&STATE.scenarioId)||"";
  const emo=esc(c.avatar||(c.name||"?").slice(0,1));
  if(!sid) return `<span class="ava noimg ${cls||""}" data-emo="${emo}">${emo}</span>`;
  const flip=(FLIP_PORTRAIT[sid]||[]).includes(c.id)?" flip":"";
  return `<span class="ava ${cls||""}" data-emo="${emo}" style="--ac:${c.color||"var(--line)"};${cropVars(c)}">`
    +`<img class="pt${flip}" src="${assetURL(`/assets/${sid}_portrait_${c.id}.webp`)}" alt="" decoding="async"`
    +` onerror="if(this.dataset.f){this.closest('.ava').classList.add('noimg');this.remove()}`
    +`else{this.dataset.f=1;this.src='${assetURL(`/assets/${sid}_portrait_${c.id}.png`)}'}"></span>`;
}
function portraitHTML(c){
  // 규약: /assets/{시나리오}_portrait_{배역}.{webp|png}
  // webp가 없으면 png로, 그것도 없으면 스스로 지워져 이모지가 드러난다.
  const sid=(STATE&&STATE.scenarioId)||"";
  const src=sid?assetURL(`/assets/${sid}_portrait_${c.id}.webp`):"";
  const png=sid?assetURL(`/assets/${sid}_portrait_${c.id}.png`):"";
  // 대체 글자를 뒤에 깔지 않는다 — 다시 그릴 때마다 사진이 로드되는 사이에 비쳐서 깜빡여 보였다.
  // 사진을 끝내 못 찾은 경우에만 .por의 data-emo가 CSS로 드러난다.
  if(!src) return "";
  // 초상 몇 장이 같은 포즈로 그려져 나란히 놓이면 같은 사람처럼 읽힌다.
  // 다시 그리기 전까지는 좌우를 뒤집어 실루엣이라도 갈라놓는다.
  const flip=(FLIP_PORTRAIT[sid]||[]).includes(c.id)?" flip":"";
  return `<img class="pt${flip}" src="${src}" alt="" decoding="async"
    onerror="if(this.dataset.f){this.closest('.por').classList.add('noimg');this.remove()}else{this.dataset.f=1;this.src='${png}'}">`;
}
/* 1.5초마다 폴링하는데 그때마다 그리드를 통째로 다시 그리면 <img>가 새로 만들어져
   인물 사진이 깜빡인다. 로비에 실제로 영향을 주는 값만 뽑아 비교하고,
   달라진 게 없으면 손대지 않는다. */
function roleCardState(c){
  const r=(STATE.roles||{})[c.id]||{}; const mine=myRoleId===c.id;
  const otherHuman=!mine&&r.mode==="human";
  const locked=!!(STATE&&STATE.started);
  // QA 검수 모드에서는 세 자리가 전부 내 것이다 — 「참여 중」이 아니라 「갈아탈 시점」으로 읽혀야 한다.
  if(qaOn){
    const held=r.mode==="human";
    const badge=mine?`<span class="badge me">${ICO.dot} 보는 중</span>`
                    :(held?`<span class="badge hu">QA</span>`:"");
    /* 문안은 평소 판과 한 글자도 다르지 않아야 한다 — 여기서 다른 말이 뜨면 그게 곧
       「이 기기는 QA 다」를 드러낸다. 뜻만 다르다: QA 의 SELECT 는 «그 좌석의 시점으로
       갈아탄다» 이고, CANCEL 은 «그 좌석을 놓는다»(/api/release)다. */
    const btn=mine?`<button class="rc-go done" onclick="event.stopPropagation();releaseRole()">${ICO.check} CANCEL</button>`
                  :`<span class="rc-go pick">SELECT</span>`;
    // 자기 카드를 한 번 더 누르면 풀린다 — CANCEL 단추와 같은 길이다
    const tap=locked?"":(mine?`releaseRole()`:(held?`qaSee('${c.id}')`:`qaClaim('${c.id}')`));
    return {cls:"rc"+(mine?" mine":"")+(tap?" tap":""), badge, btn, tap};
  }
  // 카드의 버튼은 '고르는 일'만 한다. 내 정보 보기는 아래 바에 따로 있다.
  let badge="", btn="";
  /* 한 사람이 한 자리다 — 이미 쥔 배역이 있으면 다른 카드는 안 잡힌다.
     남이 앉은 카드(「참여 중」)와는 뜻이 다르다. 저쪽은 «임자가 있다» 이고
     이쪽은 «내가 딴 데 앉아 있다» 라서, 표시도 갈라 둔다 — 그 배역의 색으로 점선을
     둘러 「이건 네 사정이다」로 읽히게 한다. 스와이프로 보는 건 그대로 된다. */
  const elsewhere=!mine&&!otherHuman&&myRoleValid();
  // 판이 시작된 뒤에는 배역을 못 바꾼다 — 그때는 CANCEL 이 아니라 표시로만 남는다.
  if(mine){ badge=`<span class="badge me">${ICO.dot} 나</span>`;
    btn=locked?`<span class="rc-go done">${ICO.check} SELECTED</span>`
              :`<button class="rc-go done" onclick="event.stopPropagation();releaseRole()">${ICO.check} CANCEL</button>`; }
  else if(otherHuman){ badge=`<span class="badge hu">사람</span>`; btn=`<span class="rc-go off">참여 중</span>`; }
  else if(elsewhere&&!locked){ btn=`<span class="rc-go ncl">이미 선택함</span>`; }
  else { btn=locked?`<span class="rc-go off">-</span>`:`<span class="rc-go pick">SELECT</span>`; }
  // 카드 전체가 곧 단추다 — 작은 SELECT 만 노리게 하면 폰에서 몇 번씩 빗나간다.
  // 자기 카드를 한 번 더 누르면 풀린다(CANCEL 과 같은 길). 시작된 뒤에는 둘 다 막힌다.
  // 눌러도 아무 일이 없으면 고장으로 읽힌다 — 막힌 자리는 한 줄로 사정을 말한다.
  const tap=locked?"":(mine?`releaseRole()`:(otherHuman?"":(elsewhere?`pickBlocked()`:`claim('${c.id}')`)));
  return {cls:"rc"+(mine?" mine":"")+(otherHuman?" off":"")+(elsewhere?" ncl":"")+(tap?" tap":""), badge, btn, tap};
}

/* 카드 뼈대는 시나리오가 바뀔 때만 새로 만든다. 배역을 고를 때마다 통째로 다시 그리면
   <img>가 매번 새로 만들어져 인물 사진이 깜빡인다 — 상태가 바뀌면 배지와 버튼만 갈아끼운다. */
let lobbyBuilt="";
/* 모든 배역이 정해졌는가. 서버 말(roles[].mode)을 그대로 쓴다 — /api/start 도 같은 기준이다. */
function allSeated(){
  if(!STATE||!SCEN||!SCEN.characters||!SCEN.characters.length) return false;
  return !SCEN.characters.some(c=>((STATE.roles||{})[c.id]||{}).mode==="open");
}
/* ── 다 차면 배역 칸을 접는다 ────────────────────────────────────────
   고르는 중에는 초상이 커야 한다 — 여섯 명을 가르는 건 이름표가 아니라 얼굴이다.
   그런데 다 고르고 나면 그 큰 칸이 「이대로 진행하기」를 화면 밖으로 밀어내서,
   다 골라놓고 «다음이 없다»고 여기는 자리가 생겼다. 그래서 다 차는 순간 초상을
   40px 로 줄이고 한 줄짜리 목록으로 접는다 — 누가 무엇을 맡았는지는 그대로 읽힌다.
   다시 그리지 않고 클래스만 토글하므로 폴링(1.5초)마다 깜빡이지 않는다. */
function paintLobbyFold(host){
  const sw=host.querySelector(".role-swipe"); if(!sw) return;
  sw.classList.toggle("slim", allSeated());
}
function renderLobby(force){
  const shape=((STATE&&STATE.scenarioId)||"")+"|"+SCEN.characters.map(c=>c.id).join(",");
  const host=$("lobbyList");
  if(force||shape!==lobbyBuilt||!host.querySelector(".role-grid")){
    lobbyBuilt=shape;
    host.innerHTML=`<div class="role-swipe"><div class="role-grid">${SCEN.characters.map(c=>{
      const st=roleCardState(c);
      return `<div class="${st.cls}" data-rc="${c.id}" style="--rc:${c.color};${cropVars(c)}"${st.tap?` role="button" tabindex="0" onclick="${st.tap}"`:""}>
        <div class="por" data-emo="${esc(c.avatar||(c.name||"?").slice(0,1))}">${portraitHTML(c)}<span class="badgeslot">${st.badge}</span>
          <div class="scrim"><div class="nm">${esc(c.name)}</div><div class="jb">${esc([c.age,c.job].filter(Boolean).join(" · "))}</div></div>
        </div>
        <div class="rc-line"><b class="nm">${esc(c.name)}</b><span class="jb">${esc([c.age,c.job].filter(Boolean).join(" · "))}</span></div>
        <div class="tg">${esc(c.look||c.tagline)}</div><span class="btnslot">${st.btn}</span></div>`;
    }).join("")}</div>${roleNavHTML()}</div>
      <div class="startslot">${startBoxHTML()}</div><div class="rolebar">${roleBarHTML()}</div>
      <div class="qaslot">${qaLobbyHTML()}</div>`;
    wireRoleSwipe();
    paintLobbyFold(host);
    return;
  }
  // 이미 있는 카드에 상태만 덧입힌다 — 사진은 손대지 않는다
  SCEN.characters.forEach(c=>{
    const el=host.querySelector(`.rc[data-rc="${c.id}"]`); if(!el) return;
    const st=roleCardState(c);
    if(el.className!==st.cls) el.className=st.cls;
    // 상태가 바뀌면 누를 수 있는지도 바뀐다(고른 뒤엔 안 눌린다).
    if(st.tap){ el.setAttribute("role","button"); el.setAttribute("tabindex","0"); el.setAttribute("onclick",st.tap); }
    else { el.removeAttribute("role"); el.removeAttribute("tabindex"); el.removeAttribute("onclick"); }
    const bs=el.querySelector(".badgeslot"); if(bs&&bs.innerHTML!==st.badge) bs.innerHTML=st.badge;
    const bt=el.querySelector(".btnslot");   if(bt&&bt.innerHTML!==st.btn)   bt.innerHTML=st.btn;
  });
  const sb=host.querySelector(".startslot"), nb=startBoxHTML();
  if(sb&&sb.innerHTML!==nb) sb.innerHTML=nb;
  const rb=host.querySelector(".rolebar"), nr=roleBarHTML();
  if(rb&&rb.innerHTML!==nr) rb.innerHTML=nr;
  const qs=host.querySelector(".qaslot"), nq=qaLobbyHTML();
  if(qs&&qs.innerHTML!==nq) qs.innerHTML=nq;
  paintLobbyFold(host);
  // 점은 innerHTML을 갈아끼우지 않고 class만 건드린다 — 다시 그리면 스크롤이 처음으로 튄다
  paintRoleNav();
}
/* ── 배역 카드 좌우 넘기기 ──────────────────────────────────────────
   폰에서는 카드가 한 장씩 뜨니 «몇 명이고 지금 몇째인가»를 따로 말해줘야 한다.
   점은 그 사람의 색으로 켜지고, 이미 앉은 자리는 테두리로 표가 난다.
   여기서 제일 나기 쉬운 버그는 폴링(1.5초)마다 스크롤이 처음으로 튕기는 것이다.
   그래서 뼈대를 다시 만들 때 말고는 이 자리의 innerHTML을 건드리지 않는다. */
let roleAt=0;
const PIX_TRI=`<svg viewBox="0 0 7 7" aria-hidden="true">`
  +`<rect x="2" y="0" width="1" height="7"/><rect x="3" y="1" width="1" height="5"/>`
  +`<rect x="4" y="2" width="1" height="3"/><rect x="5" y="3" width="1" height="1"/></svg>`;
function roleNavHTML(){
  const cs=SCEN.characters||[];
  if(cs.length<2) return "";
  const dots=cs.map((c,i)=>`<button class="rn-d" data-rd="${i}" style="--rd:${c.color||"var(--case-b)"}"
      onclick="roleGo(${i})" aria-label="${esc(c.name||"")}"></button>`).join("");
  return `<div class="role-nav">
      <button class="rn-a prev" onclick="roleStep(-1)" aria-label="이전 인물">${PIX_TRI}</button>
      <div class="role-dots">${dots}</div>
      <button class="rn-a next" onclick="roleStep(1)" aria-label="다음 인물">${PIX_TRI}</button>
    </div>`;
}
function roleTrack(){ return document.querySelector("#lobbyList .role-grid"); }
/* 카드 한 장이 차지하는 가로 폭(간격 포함). 3열 그리드일 때는 0이 되어 넘길 것이 없다. */
function roleSpan(g){
  const a=g.children[0], b=g.children[1];
  if(!a) return 0;
  if(g.scrollWidth-g.clientWidth<4) return 0;      // 다 보인다 = 넘길 것이 없다
  return b?(b.getBoundingClientRect().left-a.getBoundingClientRect().left)
          :a.getBoundingClientRect().width;
}
function roleGo(i){
  const g=roleTrack(); if(!g) return;
  const sp=roleSpan(g); if(!sp) return;
  roleAt=Math.max(0,Math.min(g.children.length-1,i));
  // 화살표·점으로 옮길 때만 미끄러진다. 처음 자리를 잡을 때는 그냥 앉힌다(아래).
  if(g.scrollTo) g.scrollTo({left:roleAt*sp,behavior:"smooth"}); else g.scrollLeft=roleAt*sp;
  paintRoleNav();
}
function roleStep(d){ roleGo(roleAt+d); }
function paintRoleNav(){
  const g=roleTrack(); if(!g) return;
  const wrap=g.parentElement&&g.parentElement.querySelector(".role-nav"); if(!wrap) return;
  const n=g.children.length, sp=roleSpan(g);
  if(sp) roleAt=Math.max(0,Math.min(n-1,Math.round(g.scrollLeft/sp)));
  wrap.querySelectorAll(".rn-d").forEach((d,i)=>{
    const c=(SCEN.characters||[])[i]||{};
    const held=((STATE&&STATE.roles)||{})[c.id];
    d.classList.toggle("on",i===roleAt);
    d.classList.toggle("held",!!(held&&held.mode!=="open"));
    d.setAttribute("aria-current",i===roleAt?"true":"false");
  });
  const p=wrap.querySelector(".rn-a.prev"), x=wrap.querySelector(".rn-a.next");
  if(p) p.disabled=(roleAt<=0);
  if(x) x.disabled=(roleAt>=n-1);
}
/* 뼈대를 새로 만든 직후에는 아직 폭이 안 잡혀 있을 수 있다(화면이 숨어 있는 사이,
   사진이 붙기 전). 그때 자리를 잡으면 0으로 앉고, 뒤늦게 폭이 생기면서 점만 첫 장으로
   되돌아간다 — 잴 수 있을 때까지 몇 프레임 기다렸다 앉힌다. 그 사이에 손으로 넘겼으면
   그만둔다(사람이 보고 있는 자리를 빼앗지 않는다). */
function roleSeat(i,tries){
  const g=roleTrack(); if(!g||g.scrollLeft>0) return;
  const sp=roleSpan(g);
  if(sp){ g.scrollLeft=i*sp; paintRoleNav(); return; }
  if((tries||0)<10) setTimeout(()=>roleSeat(i,(tries||0)+1),60);
}
function wireRoleSwipe(){
  const g=roleTrack(); if(!g) return;
  let raf=0;
  g.addEventListener("scroll",()=>{ if(raf) return;
    raf=requestAnimationFrame(()=>{ raf=0; paintRoleNav(); }); },{passive:true});
  // 내가 이미 고른(QA면 지금 보고 있는) 자리가 있으면 거기서 시작한다 — 없으면 첫 장
  const cs=SCEN.characters||[];
  const i=myRoleId?cs.findIndex(c=>c.id===myRoleId):-1;
  roleAt=i>0?i:0;
  // 앉히는 것이 먼저다 — paintRoleNav 는 스크롤 위치에서 «지금 몇째인가»를 되읽으므로,
  // 앉기 전에 부르면 방금 정한 자리를 0으로 되돌려 놓는다.
  roleSeat(roleAt);
  paintRoleNav();
}
/* 모두 정해지면 호스트에게 확정을 묻는다 — 확정 순간부터 배역은 고정된다 */
function startBoxHTML(){
  if(!STATE||STATE.started) return "";
  const opens=SCEN.characters.filter(c=>(STATE.roles[c.id]||{}).mode==="open");
  if(opens.length) return "";
  // 시작 버튼은 하나다 — 진행석을 켠 기기이거나 호스트면 누를 수 있다.
  // QA 검수 모드는 혼자 도는 판이라 「누가 호스트인가」를 기다릴 사람이 없다.
  if(!(STATE.isHost||gmOn||qaOn)) return `<div class="startbox wait">모든 배역이 정해졌습니다. 호스트가 시작하기를 기다리는 중…</div>`;
  return `<div class="startbox"><div class="sb-t">모든 배역이 정해졌습니다</div>
    <div class="sb-d">시작하면 배역을 더는 바꿀 수 없습니다.${gmOn?" 시작과 함께 진행석이 열립니다.":""}</div>
    <button class="btn ember" onclick="startGame()">이대로 진행하기 ›</button></div>`;
}
async function startGame(){
  if(startBusy) return; startBusy=true;
  try{
    if(!await ask({title:"이 배역으로 시작합니다", body:"모두 자리를 잡았습니다. 오프닝이 시작됩니다.",
                   warn:"시작한 뒤에는 배역을 바꿀 수 없습니다.", ok:"시작", cancel:"아직",
                   tone:"gold", okGo:true})) return;
    const r=await post("/api/start",{clientId,key:hostKey()});
    if(r&&r.error){ banner(r.error); return; }
    await poll();
  } finally { startBusy=false; }
}
/* ── 시작 확인창은 «손으로만» 연다 ──────────────────────────────────
   한동안 마지막 자리가 차는 순간 확인창을 저절로 띄웠다(maybeAutoStart). 되돌린다 —
   확인창은 「이대로 진행하기」를 눌렀을 때만 뜬다.
   저절로 뜰 이유였던 「단추가 화면 밖에 있어 안 보인다」는 팝업이 아니라 로비 쪽에서
   푼다: 배역이 다 정해지면 배역 칸이 접혀(.role-swipe.slim) 단추가 스크롤 없이 선다. */
let startBusy=false;
function roleBarHTML(){
  if(STATE&&STATE.started){
    // 진행석은 배역과 별개로 켜져 있을 수 있다 — 둘 다면 두 입구를 나란히 준다.
    const gmIn=gmOn?`<button class="btn" onclick="go('gm')">${ICO.film} 진행석 열기</button>`:"";
    return myRoleValid()
      ? `<button class="btn primary" onclick="showMySheet()">${ICO.folder} 내 정보 확인하기</button>
         ${isBoard()?`<button class="btn quiet" onclick="replayVN()">${ICO.play} 오프닝 보기</button>`:""}
         <button class="btn" onclick="go('play')">내 자리로 ›</button>${gmIn}
         <span class="hint">게임이 시작돼 배역은 바꿀 수 없습니다</span>`
      : `${isBoard()?`<button class="btn quiet" onclick="replayVN()">${ICO.play} 오프닝 보기</button>`:""}
         ${gmIn||`<button class="btn" onclick="go('play')">관전으로 보기</button>`}
         <span class="hint">게임이 시작됐습니다</span>`;
  }
  /* 아래 띠에는 «말» 만 남긴다. 예전엔 「랜덤 배역 받기」와 「배역 해제」가 여기 서 있었는데,
     둘 다 카드에서 하는 일이 됐다 — 카드를 누르면 SELECT, 한 번 더 누르면 CANCEL 이다.
     단추를 여기 두면 「이대로 진행하기」가 그만큼 아래로 밀린다. */
  if(myRoleValid()) return `<span class="hint locked">${ICO.lock} 내 정보는 오프닝이 끝나면 열립니다</span>`;
  return `<span class="hint">배역 카드를 눌러 고르세요 — 한 번 더 누르면 풀립니다</span>`;
}
/* ===== GM 마킹 보드 (페이즈 구동 · 시네마틱) ===== */
let gmSig=null, gmSeenMarks=null;
function renderGM(_force){
  const ph=STATE.phase||{}; const cur=STATE.round||0; const ap=ph.ap||0; const k=ph.key;
  $("gmPhase").textContent=(ph.name||"")+(cur?` · R${cur}`:"")+(ap?` · 인당 ${ap}장`:"");
  // 마지막 막에서만 감춘다. 예전엔 9로 박아뒀는데 사건마다 막 수가 달라서,
  // 열 막짜리 사건에서는 「최후의 선택」에서 다음 막으로 못 넘어갔다.
  $("gmAdvBtn").style.display=(STATE.seq>=((SCEN.phases||[]).length||9))?"none":"";
  const checked=STATE.checked||{}; const used=STATE.usedAP||{};
  // 새로 마킹된 칸(플레이어가 방금 조사) 감지 → 펄스 1회
  const curMarks=new Set(); Object.entries(checked).forEach(([r,ids])=>ids.forEach(id=>curMarks.add(r+":"+id)));
  let fresh=new Set();
  if(gmSeenMarks===null) gmSeenMarks=curMarks; else { curMarks.forEach(m=>{ if(!gmSeenMarks.has(m))fresh.add(m); }); gmSeenMarks=curMarks; }
  // 시그니처가 같으면 다시 그리지 않음(시네마틱 재생·매트릭스 깜빡임 방지)
  const sig=k+"|"+STATE.seq+"|"+cur+"|"+JSON.stringify(checked)+"|"+JSON.stringify(used);
  if(sig!==gmSig||fresh.size){ gmSig=sig; $("gmWrap").innerHTML=buildGMBody(ph,cur,ap,k,checked,used,fresh); }
  renderChat("gmChat");
}
function buildGMBody(ph,cur,ap,k,checked,used,fresh){
  const inter=(SCEN.interludes||{})[String(ph.seq)]||"";
  if(k==="open") return gmCinematic("막이 오른다 · 공통지문 낭독", (SCEN.intro||""), vicText(),
    `<button class="btn gold" onclick="replayVN()">${ICO.play} 오프닝 비주얼노벨 재생</button>
     <div style="margin-top:8px">큰 화면에 띄워 다 같이 보세요. 끝나면 각자 <b>내 정보</b>로 자기소개를 나눈 뒤,
     <b>다음 페이즈 ›</b>로 <b>조사 R1</b>을 여세요.</div>`);
  if(k==="final"){
    // 답이 어디로 가는지가 곧 진행석이 있다는 뜻이다 — 여기로 모아 펼쳐 보여준다.
    // 답안 자체는 GM 키가 있어야 읽히므로(서버가 그렇게 잠가 뒀다) 따로 불러온다.
    setTimeout(loadGMFinalAnswers,0);
    return gmCinematic("종막 · 질문지", finalQs().map((q,i)=>`${i+1}. ${fqText(q)}`).join("\n"), "",
      `${fqHasChoices()?"각자 자기 기기에서 선지를 하나씩 고릅니다":"각자 자기 기기에서 서술로 답합니다"}. 답은 이 진행석으로 모입니다.
       <div class="gm-ans" id="gmAnswers"><div class="gm-note">답안을 불러오는 중…</div></div>`);
  }
  if(k==="ask"){
    const a=STATE.ask||{};
    const rows=(a.questions||[]).map((q,i)=>`  ${i+1}. 「${q.q}」${q.askedBy
      ? `\n     — ${q.a==="nod"?a.nod:a.shake}   (${nameOf(q.askedBy)})` : "\n     — 아직 안 물음"}`).join("\n");
    return gmCinematic("질문지 · 예 아니면 아니오", rows, a.open?`${nameOf(a.turn)}의 차례입니다.`:"질문지가 덮혔습니다.",
      `당주는 <b>끄덕이거나 젓는 것</b>뿐입니다. 각자 순서대로 하나씩 고릅니다.
       <div style="margin-top:8px"><b>${(a.asked||[]).length}/${a.total}</b>명 물음.
       ${a.open?"":"남은 질문은 아무도 묻지 않았습니다 — <b>다음 페이즈 ›</b>로 넘기세요."}</div>`);
  }
  if(k==="night"){
    const n=STATE.night||{};
    if(n.done) return gmCinematic("밤이 지났다", (n.outcome||[]).join("\n"), n.headline||"",
      "낭독하고 <b>다음 페이즈 ›</b>로 마지막 조사를 여세요. 시신은 어젯밤에 다녀간 손의 수만큼 자국을 갖고 있습니다.");
    return gmCinematic("밤 · 각자의 방으로", (n.intro||""), (n.prompt||""),
      `각자 자기 기기에서 하나씩 고릅니다. <b>무엇을 골랐는지는 아무에게도 안 보입니다.</b>
       <div style="margin-top:8px">지금까지 <b>${(n.picked||[]).length}/${n.total}</b>명이 정했습니다.
       전원이 정하면 저절로 아침이 옵니다.</div>
       <div style="margin-top:8px"><button class="btn quiet" onclick="nightClose()">기다리지 않고 넘기기</button></div>`);
  }
  if(k==="accuse"){
    const a=STATE.accuse1||{picks:{},tally:{}};
    const rows=Object.keys(a.tally||{}).sort((x,y)=>a.tally[y]-a.tally[x])
      .map(t=>`  ${nameOf(t)} — ${a.tally[t]}표`).join("\n");
    const bl=(STATE&&STATE.belongings)||null;   // 소지품을 쓰는 사건이면 이 표는 여기서 값을 한다
    return gmCinematic("1차 지목 · 비밀투표", (ph.gm||""),
      a.done?(bl?"— 봉투가 닫혔습니다. 최다 득표자는 소지품을 압수당합니다."
                :"— 봉투가 닫혔습니다. 이 표는 종막에서 열립니다.")
            :"— 각자 적는 중입니다. 결과는 여기서 안 엽니다.",
      `각자 자기 기기에서 몰래 적습니다. <b>${a.voted}/${a.voters}</b>명 적음.
       <div style="margin-top:8px">${bl
         ?"표를 가장 많이 받은 사람은 그 자리에서 <b>소지품을 압수당합니다</b> — 표가 갈리면 갈린 사람 전부입니다."
         :"이 표는 <b>지워지지 않고, 여기서는 안 열립니다</b> — 종막에서 열립니다."}
       ${a.done?"<b>다음 페이즈 ›</b>로 넘기세요.":""}</div>`);
  }
  if(k==="decision"){
    const d=STATE.decision||{};
    const rows=(d.seats||[]).map((seat,i)=>{
      const done=d.picks&&d.picks[seat.roleId];
      const opt=(seat.options||[]).find(o=>o.id===done);
      const bar=(seat.roleId===d.barred);
      return `${i+1}. ${seat.seat||nameOf(seat.roleId)} · ${nameOf(seat.roleId)}${bar?" (제 칸을 잃음 — 표로 채움)":""}\n   ${done?decL(opt):"— 대기 중"}`;
    }).join("\n");
    // 진행석의 이름표도 사건이 정한다 — 여기에도 「노인정리국 결정문」이 박혀 있었다.
    return gmCinematic(decTitle(), rows || (STATE.decision&&STATE.decision.intro)||"",
      d.barred?`제 칸을 잃은 사람 — ${nameOf(d.barred)}`:"",
      d.done&&d.report
        ? `<b>다 정해졌습니다.</b> ${esc(d.report.note||"")}<div style="margin-top:8px">이대로 낭독한 뒤 <b>다음 페이즈 ›</b>로 진상을 여세요.</div>`
        : "각자 자기 칸을 고릅니다. 모든 칸이 차야 다음으로 넘어갑니다.");
  }
  if(k==="reveal") return gmCinematic("진상 공개", (STATE.ending?STATE.ending.desc:"전원이 이름을 적으면 엔딩이 열립니다."), (STATE.ending?("— "+STATE.ending.name):""),
    "이 세션이 진상과 엔딩을 전해주면, 낭독으로 밤을 닫으세요.");
  // invest / talk → 공용 카드 한 벌. 같은 카드가 인물 수만큼 반복되던 매트릭스를 걷어냈다 —
  // 조사카드는 한 사람만 가져갈 수 있으니, 카드는 한 장씩만 있고 '누가 가져갔나'를 표시하면 된다.
  const cat=(SCEN.cardCatalog||[]).filter(c=>c.round<=cur);
  const holder={};                       // cardId -> roleId
  Object.keys(checked||{}).forEach(rid=>(checked[rid]||[]).forEach(id=>{ holder[id]=rid; }));
  const target=gmMarkTarget();           // 지금 마킹할 인물
  const pubById={}; (STATE.revealed||[]).forEach(c=>{ pubById[c.id]=c; });

  let h=`<div class="gm-guide"><span class="g">GM 지문</span>${esc(ph.gm||"")}${inter?`<div class="il">${ICO.horn} “${esc(inter)}”</div>`:""}</div>`;
  if(k==="invest"){
    h+=gmTurnBar();
    h+=`<div class="gm-note">카드는 <b>한 장씩</b>만 있습니다. 누군가 조사하면 그 카드에 이름이 붙고 남은 사람은 못 가져갑니다.
      <b>AI 차례</b>면 <b>${ICO.bot} 자동 조사</b>를 누르세요. 사람 차례면 그 사람이 고른 카드를 눌러 마킹하고 <b>다음 차례 ›</b>.
      다시 누르면 해제 — 카드 <b>내용은 진행자에게 보이지 않습니다</b>.</div>`;
  } else {
    h+=`<div class="gm-note">토론 페이즈 — 새로 조사할 카드는 없습니다. 아래는 지금까지의 조사 현황입니다.</div>`;
  }

  // 마킹 대상 — 조사 페이즈면 차례인 사람이 기본값이다
  h+=`<div class="gm-pick"><span class="pl">마킹 대상</span>${SCEN.characters.map(c=>{
      const u=used[c.id]||0, full=ap>0&&u>=ap;
      return `<button class="pk${c.id===target?" on":""}${full?" full":""}" style="--pc:${c.color}"
        onclick="setGmTarget('${c.id}')">${avaHTML(c,"xs")} ${esc(c.name)}
        <span class="n">${(checked[c.id]||[]).length}</span></button>`;
    }).join("")}</div>`;

  h+=`<div class="gm-legend"><span><b style="background:var(--panel2)"></b>미조사</span>
    <span><b style="background:linear-gradient(150deg,#0c3a2b,#6a5320)"></b>조사됨 — 이름 표시</span></div>`;

  // 구역별로 카드 한 벌
  const zones=(SCEN.map&&SCEN.map.length)?SCEN.map:[...new Set(cat.map(c=>c.loc))].map(l=>({loc:l,name:l}));
  zones.forEach(z=>{
    const cards=cat.filter(c=>c.loc===z.loc);
    if(!cards.length) return;
    const cc=cards.map(cd=>{
      const rid=holder[cd.id]; const who=rid?(roleById(rid)||{}):null;
      const jm=fresh&&rid&&fresh.has(rid+":"+cd.id);
      const tip=`${esc(cd.locName)}${cd.spot?" · "+esc(cd.spot):""} · R${cd.round}${cd.requires?" · "+cd.requires+" 선행":""}`;
      const isPub=!!pubById[cd.id];
      if(who||isPub){
        // 토론 중엔 클릭으로 마킹이 풀리지 않는다 — 공개된 카드면 내용을 열고, 아니면 아무 일도 없다.
        const act=isPub?`openCard('${cd.id}')`:(k==="invest"?`gmMark('${rid}','${cd.id}')`:`gmHeld()`);
        return `<div class="gcell took${isPub?" pub":""}${jm?" justmark":""}" style="--cc:${(who&&who.color)||'var(--gold)'}"
          onclick="${act}" title="${tip}">
          <div class="cid">${esc(cd.spot||cd.locName)}${isPub?`<span class="pubtag">전체공개</span>`:""}</div>
          ${who?`<div class="cwho">${avaHTML(who,"xs")} ${esc(who.name)}</div>`:`<div class="cwho">공개됨</div>`}
          ${isPub?`<div class="cspot">${esc(pubById[cd.id].title)}</div>`:""}</div>`;
      }
      return `<div class="gcell${target?"":" nopick"}" onclick="gmMarkHere('${cd.id}')" title="${tip}">
        <div class="cid">${esc(cd.spot||cd.locName||"")}</div>
        ${cd.requires?`<span class="rq">${cd.requires}▶</span>`:""}</div>`;
    }).join("");
    h+=`<div class="gm-zone"><div class="zh">${esc(z.name||z.loc)}
      <span class="zn">${cards.filter(c=>holder[c.id]).length}/${cards.length}</span></div>
      <div class="gcells">${cc}</div></div>`;
  });
  return h;
}
/* 진행석의 답안 모음 — /api/gm 은 GM 키로 잠겨 있고, 그 키는 진행석만 갖고 있다.
   서버는 그대로 두고 이미 있는 창구를 읽기만 한다. */
async function loadGMFinalAnswers(){
  const box=$("gmAnswers"); if(!box) return;
  let d; try{ d=await (await fetch("/api/gm?key="+encodeURIComponent(gmKey))).json(); }catch(e){ d={error:"network"}; }
  if(!$("gmAnswers")) return;
  if(d.error){ box.innerHTML=`<div class="gm-note">답안을 열지 못했습니다 (${esc(d.error)}). <b>GM 키 바꾸기</b>로 키를 맞춰주세요.</div>`; return; }
  const fa=d.finalAnswers||{}; const qs=finalQs();
  const ids=(SCEN.characters||[]).filter(c=>(fa[c.id]||[]).length).map(c=>c.id);
  if(!ids.length){ box.innerHTML=`<div class="gm-note">아직 들어온 답안이 없습니다. 각자 제출하면 여기에 쌓입니다.</div>`; return; }
  box.innerHTML=ids.map(id=>{ const c=roleById(id)||{}; const a=fa[id]||[];
    return `<div class="gm-a" style="--ac:${c.color||"var(--gold)"}">
      <div class="ah">${avaHTML(c,"sm")} ${esc(c.name||id)}</div>
      ${qs.map((q,i)=>`<div class="aq">${i+1}. ${esc(fqText(q))}</div><div class="ab">${esc(fqAnswerText(q,(a[i]||"").trim())||"(무응답)")}</div>`).join("")}
    </div>`; }).join("")
    +`<div class="gm-note" style="margin-top:10px">${ids.length}명 제출 / 사람 배역 ${Object.keys(STATE.roles||{}).filter(r=>(STATE.roles[r]||{}).mode==="human").length}명</div>`;
}
function gmCinematic(kick, body, tail, note){
  const lines=String(body||"").split("\n").filter(x=>x.trim());
  let h=`<div class="gm-cine"><div class="ck">${esc(kick)}</div>`;
  lines.forEach((ln,i)=>{ h+=`<div class="ln serif" style="animation-delay:${(i*0.55).toFixed(2)}s">${esc(ln)}</div>`; });
  let d=lines.length*0.55;
  if(tail) h+=`<div class="vic serif" style="animation-delay:${d.toFixed(2)}s">${esc(tail)}</div>`, d+=0.55;
  if(note) h+=`<div class="go" style="animation-delay:${d.toFixed(2)}s">${note}</div>`;
  return h+`</div>`;
}
/* 마킹 대상 — 조사 페이즈면 차례인 사람이 기본. 토론 중엔 직접 고른다. */
let gmTarget=null;
function gmMarkTarget(){
  if(gmTarget&&STATE.roles[gmTarget]) return gmTarget;
  return STATE.turn||null;
}
function setGmTarget(id){ gmTarget=(gmTarget===id?null:id); renderGM(true); }
function gmHeld(){ gmBanner("토론 중에는 마킹을 바꾸지 않습니다 — 조사 페이즈에서 고치세요"); }
async function gmMarkHere(cardId){
  const t=gmMarkTarget();
  if(!t){ gmBanner("먼저 위에서 마킹 대상을 고르세요"); return; }
  await gmMark(t,cardId);
}
async function gmMark(role,cardId){
  const r=await post("/api/mark",{roleId:role,cardId,key:gmKey});
  if(r&&r.error){ gmBanner(r.error==="key"?"GM 키가 올바르지 않습니다 — 배포본은 배포 때 넣은 AGENT_KEY가 필요합니다.":r.error); }
  else gmBanner("");
  await poll();
}
function gmBanner(m){ const b=$("gmBanner"); if(m){b.textContent=m;b.classList.add("on");}else b.classList.remove("on"); }

/* 배역을 맡아도 바로 입장시키지 않는다 — 카드 전체가 탭 영역이라 오탭 비용이 크고,
   무엇보다 들어가기 전에 '내 정보'를 읽을 기회를 줘야 한다. 입장은 하단 액션바에서. */
/* 배역 잡기·놓기는 손이 두 번 닿기 쉬운 자리다(카드 전체가 단추라 더 그렇다).
   그 카드에 「잡는 중」을 덮어 두 번째 누름을 막고, 응답이 늦어도 눌린 티가 나게 한다. */
let claimBusy=false;
function roleCardBusy(id,on){
  const el=document.querySelector(`#lobbyList .rc[data-rc="${id}"]`);
  if(el) el.classList.toggle("busy",!!on);
}
async function claim(id){
  if(claimBusy) return; claimBusy=true; roleCardBusy(id,true);
  try{
    const r=await post("/api/claim",{roleId:id,clientId});
    if(r&&r.error){banner(r.error);return;}
    await setMy(id);
  } finally { claimBusy=false; roleCardBusy(id,false); }
}
/* QA — 자리를 하나 더 쥔다. qa 신고를 얹어야 서버가 앞자리를 안 놓는다. */
async function qaClaim(id){ const r=await post("/api/claim",{roleId:id,clientId,qa:true,key:gmKey}); if(r&&r.error){banner(r.error);return;} await qaSee(id); }
/* 이미 한 자리를 쥐고 있을 때 다른 카드를 누른 경우. 아무 일도 안 하면 고장으로 읽힌다. */
function pickBlocked(){ banner("다른 캐릭터를 이미 선택한 상태입니다"); }
async function claimRandom(){ const r=await post("/api/claim-random",{clientId}); if(r&&r.error){banner(r.error);return;} if(r&&r.roleId){ await setMy(r.roleId); } }
async function setMy(id){ myRoleId=id; localStorage.setItem("pmb.role",id); await poll(); }
async function releaseRole(){
  if(!myRoleId||claimBusy) return;
  const id=myRoleId; claimBusy=true; roleCardBusy(id,true);
  try{
    await post("/api/release",{roleId:id,clientId});
    myRoleId=null; localStorage.removeItem("pmb.role");
    // QA 는 좌석과 «보는 시점» 이 따로다 — 놓은 자리를 시점으로 물고 있으면 안 된다
    if(qaOn&&qaRole===id){ qaRole=null; try{ localStorage.removeItem("pmb.qarole"); }catch(e){} }
    await poll();
  } finally { claimBusy=false; roleCardBusy(id,false); }
}
/* 이 기기에 남는 것 — 배역, 종막 답안, 어디까지 읽었나, 진행석 토글, 대화창 접힘.
   방을 새로 열어도 이게 남아 있으면 지난 판이 그대로 이어져 보인다. gmKey만 남긴다(다시 치기 번거로우니). */
function wipeLocal(keepKey){
  const keep=keepKey?localStorage.getItem("pmb.gmkey"):null;
  // QA 검수 모드는 방이 갈려도 유지한다 — 방을 새로 열어가며 처음부터 다시 도는 게 검수의 일이라,
  // 여기서 꺼지면 매번 허브로 돌아가 다시 켜야 한다. 끄는 문은 QA 띠의 「QA 끄기」 하나다.
  const qa=localStorage.getItem("pmb.qa");

/* 다시 그리는 동안 읽던 자리를 지킨다. 내용이 짧아지는 순간 브라우저가 스크롤을
   잘라버리므로, 높이가 돌아온 다음 프레임에 되돌려 놓는다. */
function scrollHost(){
  let el=$("ppanel");
  while(el&&el!==document.body){
    const st=getComputedStyle(el);
    if(/(auto|scroll)/.test(st.overflowY)&&el.scrollHeight>el.clientHeight+4) return el;
    el=el.parentElement;
  }
  return document.scrollingElement||document.documentElement;
}
function keepScroll(){
  const host=scrollHost(), y=host.scrollTop, h=host.scrollHeight;
  if(!y) return;
  const put=()=>{ // 내용이 줄어 자리가 없어졌으면 갈 수 있는 데까지만
    const max=Math.max(0,host.scrollHeight-host.clientHeight);
    host.scrollTop=Math.min(y,max);
  };
  requestAnimationFrame(()=>{ put(); requestAnimationFrame(put); setTimeout(put,120); });
}

/* 카드 한 장의 상태 — 지도·구역·대시보드가 같은 판단을 쓴다 */
function cardState(c){
  const pub={}; (STATE.revealed||[]).forEach(x=>pub[x.id]=x);
  const hand={}; myHand.forEach(x=>hand[x.id]=x);
  if(pub[c.id])  return {k:"pub",  label:"전체공개", act:`openCard('${c.id}')`};
  if(hand[c.id]) return {k:"hand", label:"내 손패",  act:`openCard('${c.id}')`};
  const taker=Object.keys(STATE.checked||{}).find(rid=>rid!==myRoleId&&(STATE.checked[rid]||[]).includes(c.id));
  if(taker){ const tc=roleById(taker)||{}; return {k:"taken", label:(tc.name||"")+" 조사함", who:tc, act:""}; }
  const cr=STATE.round||0;
  const allIds=new Set(STATE.revealedIds||[]);
  Object.values(STATE.checked||{}).forEach(a=>(a||[]).forEach(x=>allIds.add(x)));
  const need=c.needs||(c.requires?[c.requires]:[]);
  const reqOk=need.every(r=>allIds.has(r)), roundOk=c.round<=cr;
  const ap=(STATE.phase||{}).ap||0, used=(STATE.usedAP||{})[myRoleId]||0;
  const apOut=myRoleValid()&&ap>0&&used>=ap;
  const turn=STATE.turn, myTurn=(!turn)||turn===myRoleId;
  if(sealedLoc(c.loc)) return {k:"lock", label:"물에 잠김", act:""};
  // 판이 때가 되면 스스로 여는 자리. 뒤지는 것이 아니라 «열리는 것»을 기다린다.
  if(c.auto) return {k:"lock", label:"때가 되면 열립니다", act:""};
  // 아이템 — 조사턴으로는 못 연다. 수수께끼를 푸는 것이 곧 여는 방법이고,
  // 토론만 아니면 판이 끝날 때까지 언제든 다시 붙을 수 있다.
  if(c.locked){
    if(!roundOk) return {k:"lock", label:`조사 R${c.round}에 열림`, act:""};
    if(!myRoleValid()) return {k:"lock", label:"관전 중", act:""};
    if(!(STATE&&STATE.puzzleOpen)) return {k:"lock", label:"토론 중에는 못 풉니다", act:""};
    return {k:"puzzle", label:"수수께끼를 푼다", act:`openPuzzle('${c.id}')`};
  }
  // ap 가 0인 페이즈(토론·종막)에도 지도를 열어볼 수 있게 되면서, 눌러봤자 서버가 막는
  // '조사하기'가 뜨는 자리가 생겼다. 그럴 땐 아예 누를 수 없게 두고 언제 열리는지만 말한다.
  if(roundOk&&reqOk&&myRoleValid()&&ap>0&&!apOut&&myTurn) return {k:"open", label:"조사하기", act:`investigate('${c.id}')`};
  return {k:"lock", label:(!roundOk?`조사 R${c.round}에 열림`:(!myRoleValid()?"관전 중":(ap<=0?"조사 페이즈에 열립니다":(!myTurn?"내 차례 아님":(apOut?"이번 턴 소진":"먼저 밝혀질 것이 있다"))))), act:""};
}
function sealedLoc(loc){ return ((STATE&&STATE.sealed)||[]).indexOf(loc)>=0; }
/* 그 구역에서 지금 볼 수 있는 카드 */
function zoneCards(loc){
  const cr=STATE.round||0;
  const pub=new Set((STATE.revealed||[]).map(c=>c.id)); const hand=new Set(myHand.map(c=>c.id));
  // gone 이 지난 카드는 그 자리에서 «치워진» 것이다 — 어제와 같은 방이 아니다.
  // 내가 쥐고 있는 것만 남는다(이미 본 것을 뺏지는 않는다).
  return SCEN.cardCatalog.filter(c=>c.loc===loc
    && !(c.gone && cr>=c.gone && !hand.has(c.id))
    && (c.round<=cr || pub.has(c.id) || hand.has(c.id)));
}
/* 구역 점 표시 — 시나리오 선택창의 사람표시와 같은 읽는 법. 채워진 점 = 이미 누가 꺼낸 카드 */
function zonePips(loc){
  const cards=zoneCards(loc);
  const done=cards.filter(c=>{ const k=cardState(c).k; return k!=="open"&&k!=="lock"; }).length;
  const dots=cards.map(c=>{ const k=cardState(c).k;
    return `<span class="zp ${k}"></span>`; }).join("");
  return {cards, done, html:`<span class="zpips">${dots}</span><b>${done}/${cards.length}</b>`};
}

/* 배치도 위 수위 — 잡으면 그 자리에서 멈춘다 */
function floodHTML(){

function paintFlood(svg){

/* 내 지도에 포드가 그려져 있는가. 서버가 정한다 — 처음부터 아는 사람과,

function podMarked(){ return !!(STATE&&(STATE.podMarked||STATE.podOpen)); }
function podCodeOk(){ return !!(STATE&&STATE.podCodeOk); }
function renderMap(el){

async function paintMap(){
  const art=$("mapArt"); if(!art) return;
  const svgTxt=await loadMapSVG();
  // 지도 SVG가 아직 없는 사건이 있다. 예전엔 여기서 그냥 돌아가 버려서 아래 구역
  // 목록(#dash)까지 같이 안 그려졌다 — 조사화면이 통째로 빈 판이 되고 아무것도 못 열었다.
  // 지도는 «있으면 좋은 것»이고 구역 목록이 «판을 굴리는 것»이라, 없으면 지도만 접는다.

/* 동선 토글. 길은 «그 길을 말하는 카드»가 테이블에 깔려야 지도에 그어진다 —
   유리지붕(C1) · 배관(C2) · 복도(B1). 아직 안 나온 길은 아예 안 그린다.
   그렇게 열린 길도 늘 또렷하면 구역 이름을 읽는 데 방해가 되므로,
   평소에는 흐리게 두고 이 버튼을 켤 때만 진해진다.
   열린 길이 하나도 없으면 버튼 자체가 안 생긴다 — 켤 것이 없으니까. */
let waysOn=false;
function wireWays(host, svg){
  const routes=[...svg.querySelectorAll(".route[data-need]")];
  if(!routes.length && !svg.querySelector(".way,.acc-way,.sight")) return;
  const pub=new Set(STATE&&STATE.revealedIds||[]);
  const need=new Set();
  routes.forEach(g=>{ const id=g.getAttribute("data-need");
    const lit=pub.has(id); g.classList.toggle("lit", lit); if(lit) need.add(id); });
  if(routes.length && !need.size) return;          // 아직 아무 길도 안 드러났다
  svg.classList.toggle("ways-on", waysOn);
  const n=need.size;
  const label=()=>(waysOn?"동선 끄기":"동선 보기")+(n?` (${n})`:"");
  const b=document.createElement("button");
  b.className="mapways"+(waysOn?" on":"");
  b.type="button";
  b.textContent=label();
  b.title=n?"테이블에 깔린 카드가 말하는 길만 그려집니다":"";
  b.setAttribute("aria-pressed", waysOn?"true":"false");
  b.onclick=()=>{ waysOn=!waysOn;
    svg.classList.toggle("ways-on", waysOn);
    b.classList.toggle("on", waysOn);
    b.textContent=label();
    b.setAttribute("aria-pressed", waysOn?"true":"false"); };
  host.appendChild(b);
}
/* 포드 자리에 포인터를 찍는다. 눌러야 코드를 넣을 수 있다 —
   코드를 넣어둔 사람만 발사창에서 실제로 나간다. */
function wirePod(svg){
  const g=svg.querySelector("#pod"); if(!g) return;
  if(!podMarked()) return;
  const b=g.getBBox();
  const ok=podCodeOk();
  const ns="http://www.w3.org/2000/svg";
  const mk=document.createElementNS(ns,"g");
  mk.setAttribute("class","podmark"+(ok?" ok":""));
  mk.setAttribute("transform",`translate(${b.x+b.width/2} ${b.y+b.height/2})`);
  mk.style.cursor="pointer";
  mk.innerHTML=`<circle r="15" class="pm-halo"></circle>
    <circle r="9" class="pm-dot"></circle>
    <path d="M-3.6 0 L-1 2.8 L4 -3" class="pm-tick"></path>`;
  mk.addEventListener("click",e=>{ e.stopPropagation(); askPodCode(); });
  g.appendChild(mk);
}
/* 인증코드 입력. 맞으면 그 사람에게만 남는다 — 누가 아는지는 아무도 모른다. */
async function askPodCode(){
  if(!myRoleValid()) { banner("배역을 맡아야 합니다"); return; }
  if(podCodeOk()){
    say({title:"발사 인증코드", body:"이미 넣어뒀습니다.\n\n포드에 타게 되면 그대로 나갈 수 있어요. "
      +"다만 자리는 둘뿐이고, 누가 타는지는 마지막 토론의 표가 정합니다."});
    return;
  }
  const v=await askText({title:"세일 구획 · 탈출 포드",
    body:"발사에는 선장이 걸어둔 인증코드가 필요합니다.\n숫자 여섯 자리예요.",
    value:"", ok:"넣기"});
  if(v==null) return;
  const r=await post("/api/pod/code",{roleId:myRoleId,clientId,code:v});
  if(r&&r.error){ banner(r.error); return; }
  if(r&&r.wrong){ sfx("bad"); say({title:"맞지 않습니다", body:"코드가 다릅니다. 다시 넣을 수 있어요."}); return; }
  sfx("pod");
  say({title:"인증되었습니다", body:"포드가 당신을 받아들입니다.\n\n이 사실은 당신만 압니다 — 다른 사람에게는 보이지 않아요."});
  await poll();
}
/* 배치도의 구역이 곧 버튼이다. 개수는 SVG가 이미 갖고 있는 자리(#cnt-X)에 채워 넣는다 —
   글자를 새로 만들어 얹으면 지도를 고칠 때마다 자리가 어긋난다. */
/* ── 새로 열린 구역은 깜빡인다 ─────────────────────────────────────
   구역은 조용히 열렸다. 대화창에 「— 「하늘 끝」 구역이 열렸습니다.」 한 줄이 뜨긴 하는데,
   말이 오가는 중이면 그 줄은 순식간에 위로 밀린다 — 새 자리가 생긴 줄을 아무도 모른다.

   ★ 근거를 어디서 읽는가. 원칙은 「unlockZone 을 가진 카드가 공개됐는가」인데, 그 필드는
     카탈로그에도(cardCatalog) 공개 카드(public_card)에도 안 실려 온다 — 서버가 답을
     감추느라 뺀 것이라 여기서 되살릴 수 없다. STATE.sealed 도 이 사건에서는 늘 비어
     있다(구역 잠금을 sealed 가 아니라 카드의 requires 로 걸어 놨다).
     그래서 남은 것은 대화창 문구다. 다만 그 문구는 사람이 쓴 글이 아니라 서버가
     MAP 의 구역 이름으로 «찍어내는» 한 줄이라, 이름을 SCEN.map 에 되맞춰 loc 을 얻는다.
     이름이 안 맞으면 그냥 아무것도 안 깜빡인다 — 틀린 칸을 깜빡이는 일은 없다.
   ★ 「봤다」는 사람마다 따로 기억한다. 한 기기에서 QA 로 세 배역을 오갈 때도 갈리도록
     clientId 와 방 id 를 열쇠에 같이 넣는다. */
let zoneNewSig=null, zoneNew=[];
function zoneAckKey(loc){ return `pmb.zack.${clientId}.${(STATE&&STATE.roomId)||""}.${loc}`; }
function zoneAcked(loc){ try{ return localStorage.getItem(zoneAckKey(loc))==="1"; }catch(e){ return false; } }
function zoneIsNew(loc){ return zoneNew.indexOf(loc)>=0; }
/* 그 구역을 처음 누르면 멎는다. 누른 사람의 기기에만 남는다. */
function ackZone(loc){
  if(!zoneIsNew(loc)) return;
  try{ localStorage.setItem(zoneAckKey(loc),"1"); }catch(e){}
  zoneNew=zoneNew.filter(x=>x!==loc);
  const d=$("dash"); if(d) d.innerHTML=dashHTML();
  document.querySelectorAll(".z-new").forEach(g=>g.classList.remove("z-new"));
}
function scanNewZones(){
  const tb=(STATE&&STATE.table)||[];
  // 구역 지문도 지문에 넣는다 — 대화 줄 수가 그대로여도 대본이 갈리면 다시 훑어야 한다
  const sig=`${(STATE&&STATE.roomId)||""}:${tb.length}:${(STATE&&STATE.zoneSig)||""}`;
  if(zoneNewSig===sig) return;
  zoneNewSig=sig;
  const byName={}; ((SCEN&&SCEN.map)||[]).forEach(z=>{ if(z.name) byName[z.name]=z.loc; });
  const out=[];
  tb.forEach(m=>{
    if(m.kind!=="system") return;
    const mm=/「([^」]+)」\s*구역이 열렸습니다/.exec(String(m.text||""));
    const loc=mm?byName[mm[1]]:null;
    if(loc&&!zoneAcked(loc)&&out.indexOf(loc)<0) out.push(loc);
  });
  zoneNew=out;
}
function wireZones(svg){
  ((SCEN.map)||[]).forEach(z=>{
    const g=svg.querySelector("#zone-"+z.loc); if(!g) return;
    const p=zonePips(z.loc);
    const cnt=svg.querySelector("#cnt-"+z.loc);
    if(cnt) cnt.textContent=`${p.done}/${p.cards.length}`;
    if(sealedLoc(z.loc)){ g.classList.add("z-sealed");
      if(cnt) cnt.textContent="잠김"; return; }
    if(!p.cards.length){ g.classList.add("z-empty"); return; }
    g.classList.add("z-live");
    if(p.done>=p.cards.length) g.classList.add("z-done");
    if(zoneIsNew(z.loc)) g.classList.add("z-new");
    g.addEventListener("click",()=>openZone(z.loc));
  });
}
/* 제목·본문이 실린 판본. SCEN.cardCatalog 에는 슬롯 구조만 오고 제목·본문은 아예 실려
   오지 않는다(그게 서버가 스포일러를 막는 방식이다). 그래서 읽을 것이 있는 카드는
   전체공개된 것과 내 손패뿐이고, 그 둘만 여기서 찾아진다. */
function cardOpen(id){ return (STATE.revealed||[]).find(c=>c.id===id)||myHand.find(c=>c.id===id)||null; }
/* 카드 한 장의 현황판 칸 — 상태는 셋이다.
   아직 아무도 안 봄 / 누가 쥐고 있음(임자만) / 전체공개(제목·본문). */
/* 이튿날(마지막 조사)에 새로 생긴 자리인가. 첫날에는 없던 카드라 눈에 띄어야 한다 —
   밤이 지나고 집에 남은 자국도 여기에 들어온다. */
function isFresh(c){ return (c&&c.round)===3; }
/* ── 열쇠 표시 ────────────────────────────────────────────────────
   퍼즐카드는 «조사턴으로 뒤지는 자리»가 아니라 «수수께끼로 여는 자리»다. 그게 칸
   하나만 봐도 갈리게 열쇠를 붙인다. 현황판·큰 화면·손패가 전부 이 함수를 쓴다 —
   같은 카드가 자리마다 다른 얼굴이면 그 표시는 규칙이 아니라 장식이 된다.
   시나리오의 puzzle 여부는 카탈로그의 locked 로 온다(server.py 가 그렇게 싣는다). */
function isPuzzleCard(id){ const c=cardCat(id); return !!(c&&c.locked); }
/* 열쇠 픽셀 하나. 글자 없이 자리만 좁을 때 쓴다(현황판 칸 모서리·탭). */
function keyMark(cls){ return `<i class="kmk${cls?" "+cls:""}" aria-hidden="true"></i>`; }
/* 글자가 붙은 딱지. cold = 이미 푼 카드(열쇠는 남기되 초록으로 부르지 않는다). */
function keyTag(label, cold){
  return `<span class="keytag${cold?" cold":""}" title="조사턴이 아니라 수수께끼로 여는 카드입니다">${keyMark()}${esc(label||"수수께끼")}</span>`;
}
/* 카드 한 장에 붙는 딱지 — 퍼즐카드가 아니면 아무것도 안 붙는다. */
function keyTagFor(id, opened){
  if(!isPuzzleCard(id)) return "";
  return keyTag(opened?"수수께끼로 연 카드":"수수께끼", opened);
}
/* ── 현황판 칸의 «여섯 상태»는 한 규격이다 ──────────────────────────
   축은 둘이다 — 열림/닫힘 × 전체공개 / 내 손패 / 남이 쥐고 있음.
   여섯 칸이 «같은 크기·같은 안쪽 여백·같은 테두리 두께»로 선다. 달라지는 것은
   색과 표시(이름표·아바타)뿐이다. 예전에는 상태마다 줄 수가 달라(전체공개 4줄,
   내 손패 3줄, 남이 쥔 칸 2줄) 같은 줄에 선 칸들의 키가 49px 까지 어긋났다 —
   그게 그리드가 무너져 보이던 원인이다.

   그래서 칸의 골격을 셋으로 못박는다:
     ① 윗줄  — 자리 이름 + 이름표(상태를 색과 말로 한 번에 짚는다)
     ② 큰 줄 — 제목(읽을 것이 있는 칸) 또는 상태 한 줄
     ③ 작은 줄 — 본문 한 줄(전체공개) 또는 보조 한 줄
   셋 다 한 줄로 잘라(clip1) 어느 상태에서도 줄 수가 늘지 않는다.
   ★ 색 규칙은 그대로다 — 전체공개는 네온그린 아웃라인, 남이 쥔 칸은 그 사람 키컬러,
     내 손패는 내 키컬러. 크기로 차이를 내지 않는다. */
function dashCard(c){
  const st=cardState(c), full=cardOpen(c.id);
  const spot=esc(c.spot||c.locName||"")+(isFresh(c)?`<span class="fr">이튿날</span>`:"");
  const fr=(isFresh(c)?" fresh":"")+(c.hot?" hot":"");
  /* 조사 현황판에서는 수수께끼 카드를 «드러내지 않는다». 열쇠도, 점선도, 다른 문구도
     안 붙인다 — 다른 카드와 똑같은 얼굴로 서 있다가, 눌렀을 때 비로소 수수께끼가 뜬다.
     데이터(c.locked)는 손대지 않는다. 그 값으로 누를 곳이 갈리기 때문이다. */
  // QA — 아직 안 열린 자리는 여기서 바로 본문을 편다. 조사턴을 쓰지도, 손패에 넣지도 않는다.
  // 한 판에 열 수 있는 건 절반뿐인데 원고를 보려면 서른아홉 장을 다 읽어야 한다.
  const qk=(qaOn&&!full)?`<span class="dc-qa" role="button" tabindex="0" title="조사턴을 쓰지 않고 본문만 봅니다" onclick="event.stopPropagation();qaPeek('${c.id}')">엿보기</span>`:"";
  /* 여섯 상태가 같은 틀로 지나가는 자리. cls·이름표·두 줄만 갈아끼운다. */
  const cell=(cls,style,act,tag,big,small)=>`<button class="dc ${cls} act${fr}"${style} onclick="${act}">
    ${qk}<span class="dc-top"><span class="sp">${spot}</span>${tag}</span>
    <span class="ti">${big}</span><span class="tx">${small}</span></button>`;
  const tag=(t,extra)=>`<span class="dtag">${extra||""}${t}</span>`;
  if(st.k==="pub") return cell("pub","",`openCard('${c.id}')`,
    tag("전체공개"),
    esc((full&&full.title)||"")+comboBadge(c.id),
    esc((full&&full.text)?oneLine(full.text):"테이블에 올라와 있습니다"));
  if(st.k==="hand") return cell("mine","",`openCard('${c.id}')`,
    tag("내 손패",`<i>${ICO.card}</i>`),
    esc((full&&full.title)||"")+comboBadge(c.id),
    "나만 보고 있습니다 · 비공개");
  if(st.k==="taken"){ const w=st.who||{};
    // 남이 쥔 카드는 임자만 말한다 — 제목이 새면 그 사람이 감출 것이 없어진다
    return cell("held",` style="--wc:${w.color||"var(--line)"}"`,`showSpot('${c.id}')`,
      tag(esc(w.name||""),avaHTML(w,"xs")),
      `<span class="q">${esc(w.name||"누군가")} 쥐고 있음</span>`,
      "내용은 임자만 봅니다"); }
  // cardState 의 잠김 사유에는 '내 차례 아님'처럼 내 사정이 섞여 있다. 현황판은 판 전체를
  // 읽는 자리라 카드 쪽 사정만 적는다 — 나머지는 그냥 아직 아무도 안 본 카드다.
  // 수수께끼로 여는 자리도 여기서는 «아직 아무도 안 본 칸»과 똑같이 선다. 누르면
  // 조사창이 아니라 수수께끼창이 뜬다는 것만 다르고, 그건 눌러야 알 수 있다.
  if(st.k==="puzzle") return cell("none","",`openPuzzle('${c.id}')`,
    tag("조사"),`<span class="q">아직 아무도 보지 않음</span>`,
    `<span class="dc-go">조사하기 ›</span>`);
  let why="", dim=false;
  // c.locked(수수께끼 카드)는 여기서 따로 말하지 않는다 — 아직 못 푸는 때에도
  // 「아직 아무도 보지 않음」으로 남아, 누르면 자리 안내창이 사정을 말해준다.
  if(c.auto){ why="때가 되면 판이 엽니다 — 뒤질 수 없음"; dim=true; }
  else if(sealedLoc(c.loc)){ why="물에 잠김 — 닿을 수 없음"; dim=true; }
  else if(c.round>(STATE.round||0)){ why=`조사 R${c.round}에 열림`; dim=true; }
  else if((c.needs||(c.requires?[c.requires]:[])).some(r=>!discoveredIds().has(r))){
    const d=discoveredIds(), miss=(c.needs||[c.requires]).filter(r=>!d.has(r))
      .map(r=>((SCEN.cardCatalog||[]).find(x=>x.id===r)||{}).spot||r);
    why=`먼저 찾아야 한다 — ${miss.join(", ")}`; dim=true; }
  // 아직 아무도 안 본 자리는 여기서 바로 조사한다. 지도를 눌러 들어가는 것과 같은 창이 뜬다.
  return cell("none"+(dim?" lock":""),"",`showSpot('${c.id}')`,
    tag(dim?"잠김":"조사"),`<span class="q">아직 아무도 보지 않음</span>`,
    dim?esc(why):`<span class="dc-go">조사하기 ›</span>`);
}
/* 지금까지 누구든 꺼낸 카드 — 선행 조건이 풀렸는지 보는 데 쓴다 */
function discoveredIds(){
  const s=new Set(STATE.revealedIds||[]);
  Object.values(STATE.checked||{}).forEach(a=>(a||[]).forEach(x=>s.add(x)));
  return s;
}
/* 조사 현황 거르개. 구역이 아홉이라 목록이 길어지면 「지금 열 수 있는 게 뭐였더라」가
   화면 밖으로 밀린다. 카드 제목은 어차피 안 뜨므로 걸러도 새는 것이 없다. */
/* 거르개 — [값, 이름, 한 줄 설명, 아무것도 안 걸렸을 때 할 말] */
const DASH_FILTERS=[
  ["all",  "전부",             "구역별로 스물몇 장을 다 편다",              "카드가 없습니다."],
  ["open", "안 열린 카드",     "아직 아무도 안 뒤진 자리",                  "안 열린 카드가 없습니다 — 다 열렸습니다."],
  ["can",  "지금 조사할 수 있는 카드","내 차례에 이번 턴으로 열 수 있는 것", "지금 조사할 수 있는 카드가 없습니다."],
  ["hand", "누군가 쥔 카드",   "나와 남들이 손에 들고 안 내놓은 것",        "아무도 손에 쥐고 있지 않습니다."],
  ["pub",  "전체공개된 카드",  "테이블에 올라와 다 같이 읽는 것",           "아직 전체공개된 카드가 없습니다."],
];
let dashFilter="all";
function dashPass(c){
  if(dashFilter==="all") return true;
  const k=cardState(c).k;
  if(dashFilter==="open") return k==="open"||k==="lock";
  if(dashFilter==="can")  return k==="open";
  // 손패는 내 것만이 아니다 — 남이 쥔 것도 「누군가 쥐고 있는 카드」다.
  if(dashFilter==="hand") return k==="hand"||k==="taken";
  if(dashFilter==="pub")  return k==="pub";
  return true;
}
/* 거르개마다 몇 장이 걸리는지 — 고르기 전에 보여준다. 눌러보고 텅 비는 게 제일 답답하다. */
function dashCounts(){
  // 거르개는 지금 보고 있는 라운드 안에서만 센다 — 탭에 안 뜨는 카드까지 세면
  // 「3장」이라고 해놓고 눌렀을 때 텅 비는 자리가 생긴다.
  const rounds=dashRounds(), sel=rounds.length>1?dashRoundSel(rounds):null;
  const all=((SCEN.map)||[]).flatMap(z=>zoneCards(z.loc)).filter(c=>roundPass(c,sel));
  const n={}; const was=dashFilter;
  for(const [v] of DASH_FILTERS){ dashFilter=v; n[v]=all.filter(dashPass).length; }
  dashFilter=was; return n;
}
function setDashFilter(v){
  if(v===dashFilter) return;
  dashFilter=v;
  // 거르면 목록 길이가 확 바뀐다 — 읽던 자리를 잃지 않게 붙들어 둔다.
  keepScroll();
  const d=$("dash"); if(d) d.innerHTML=dashHTML();
}
async function openDashFilter(){
  const n=dashCounts();
  const v=await pickOne({title:"조사 현황 거르개", value:dashFilter,
    options:DASH_FILTERS.map(([v,t,d])=>({v,t,d,n:n[v]}))});
  if(v!=null) setDashFilter(v);
}
/* 조사 전 카드의 뒷면 그림. 시나리오마다 한 장이고, 있으면 조사 현황판이 그걸 깐다.
   한 번 찾으면 CSS 변수로 넘겨두고 다시 안 찾는다 — 현황판은 폴링마다 다시 그려진다. */
let backSid=null;
function ensureCardBack(){
  const sid=(STATE&&STATE.scenarioId)||""; if(!sid||sid===backSid) return;
  backSid=sid;
  document.body.classList.remove("hasback");
  findAsset(`/assets/${sid}_cardback`, url=>{
    if(!url||backSid!==sid) return;
    document.documentElement.style.setProperty("--cardback",`url("${url}")`);
    document.body.classList.add("hasback");
  });
}
/* ── 아이템 수수께끼 ─────────────────────────────────────────────
   조사턴을 안 쓴다. 토론만 아니면 판이 끝날 때까지 몇 번이든 붙을 수 있고,
   맞히면 그 카드가 «푼 사람의» 인벤토리로 들어간다(손패 상한 밖).
   판정은 전부 서버가 한다 — 답은 이 파일 어디에도 없다. */
let puzTries={};
/* 아래 안내 한 줄 — 상황마다 말이 달라야 앞뒤가 맞는다.
   힌트가 아직 안 열렸으면 「언제 열리는지」와 「언제 잠기는지」를 같이,
   힌트가 이미 열렸으면 잠김만, 이미 잠겼으면 그 사실만 말한다. */
function puzNoteText(hint,locked,hintN,maxT){
  if(locked) return `이 카드는 다른 사람만 풀 수 있습니다.`;
  if(hint)   return `${maxT}번 틀리면 해당 카드는 잠깁니다.`;
  return `${hintN}번 틀리면 한 줄이 열리고, ${maxT}번 틀리면 해당 카드는 잠깁니다.`;
}
async function openPuzzle(cid){
  const c=(SCEN.cardCatalog||[]).find(x=>x.id===cid); if(!c) return;
  let d={items:[]};
  try{ d=await (await fetch(`/api/puzzle/${encodeURIComponent(myRoleId)}?clientId=${encodeURIComponent(clientId)}`)).json(); }catch(e){}
  const row=(d.items||[]).find(x=>x.id===cid);
  if(!row){ banner(d.why||"지금은 풀 수 없습니다"); return; }
  puzTries[cid]=row.tries||0;
  /* 세 번 틀리면 그 사람에게 잠긴다 — 목록에는 그대로 남는다. 사라지면 「넘겨야 한다」는
     생각 자체를 못 하기 때문이다. 잠긴 자리는 답 넣는 칸을 아예 안 그린다. */
  const maxT=+(d.maxTries||3), hintN=+(d.hintAfter||2);
  const m=document.createElement("div");
  m.className="modal on"; m.onclick=e=>{ if(e.target===m) m.remove(); };
  m.innerHTML=`<div class="box" onclick="event.stopPropagation()">
    <div class="mhead"><div class="mh-t"><span class="mh-eb">${esc(row.locName||"")}</span>
      <h2>${keyMark()} ${esc(row.spot||"수수께끼")}</h2>
      <span class="mh-sub">조사턴을 쓰지 않습니다 · 맞히면 내 인벤토리로</span></div>
      <button class="mh-x" onclick="this.closest('.modal').remove()">${ICO.close}</button></div>
    <div class="mbody">
      <div class="puz-q">${mdB(esc(row.prompt||""))}</div>
      ${row.locked
        ? `<div class="puz-dead">이 카드는 당신에게 잠겼습니다 — 다른 사람에게 넘기세요</div>`
        : `<div class="puz-in">
        <input id="puzAns" type="text" autocomplete="off" placeholder="답을 적으세요" enterkeyhint="done">
        <button class="btn primary" onclick="puzSend('${cid}')">맞춰 보기</button>
      </div>`}
      <div class="puz-msg" id="puzMsg">${row.tries&&!row.locked?`${row.tries}번 틀렸습니다 — ${maxT-row.tries}번 남았습니다.`:""}</div>
      ${row.hint?`<div class="puz-hint">${esc(row.hint)}</div>`:""}
      <div class="puz-note" id="puzNote">${puzNoteText(row.hint,row.locked,hintN,maxT)}</div>
    </div></div>`;
  document.body.appendChild(m);
  setTimeout(()=>{ const i=$("puzAns"); if(i){ i.focus();
    i.onkeydown=ev=>{ if(ev.key==="Enter") puzSend(cid); }; } },60);
}
async function puzSend(cid){
  const i=$("puzAns"); if(!i) return;
  const v=i.value.trim(); if(!v) return;
  i.value=""; i.disabled=true;
  let r={};
  try{ r=await post("/api/puzzle",{cardId:cid,roleId:myRoleId,clientId,answer:v}); }catch(e){ r={error:"network"}; }
  i.disabled=false; i.focus();
  const msg=$("puzMsg");
  if(r&&r.ok){
    document.querySelectorAll(".modal.on").forEach(m=>m.remove());
    sfx("open");
    banner("풀었습니다 — 인벤토리에 들어왔습니다.");
    await poll(); openCard(cid);
    return;
  }
  if(r&&r.error){
    if(msg) msg.textContent=r.error;
    if(r.locked) puzSeal(cid);            // 서버가 이미 잠갔다고 말한 자리
    return;
  }
  const maxT=+(r&&r.maxTries||3);
  puzTries[cid]=(r&&r.tries)||0;
  const left=maxT-puzTries[cid];
  if(msg) msg.textContent=left>0?`틀렸습니다 — ${puzTries[cid]}번째. ${left}번 남았습니다.`
                               :`틀렸습니다 — ${puzTries[cid]}번째.`;
  if(r&&r.hint){
    const box=msg&&msg.parentNode;
    if(box&&!box.querySelector(".puz-hint")){
      const h=document.createElement("div"); h.className="puz-hint"; h.textContent=r.hint;
      const n=box.querySelector(".puz-note"); if(n) box.insertBefore(h,n); else box.appendChild(h);
    }
    const n2=$("puzNote"); if(n2) n2.textContent=puzNoteText(r.hint,false,0,maxT);
  }
  if(r&&r.locked) puzSeal(cid);
}
/* 잠긴 자리로 바꾼다 — 답 넣는 칸을 «없애고» 그 자리에 왜 못 넣는지를 박는다.
   목록에서는 지우지 않는다. 사라지면 옆사람에게 넘길 생각을 못 한다. */
function puzSeal(cid){
  const box=document.querySelector(".modal.on .mbody"); if(!box) return;
  const inw=box.querySelector(".puz-in");
  if(inw){ const d=document.createElement("div"); d.className="puz-dead";
    d.textContent="이 카드는 당신에게 잠겼습니다 — 다른 사람에게 넘기세요";
    inw.replaceWith(d); }
  const n=$("puzNote"); if(n) n.textContent=puzNoteText("",true,0,0);
  sfx("bad");
}

/* ── 조사 라운드 탭 ───────────────────────────────────────────────
   밤이 없고 조사가 여러 번인 판에서는, 라운드가 섞여 한 줄로 늘어서면 «지금 뒤질 수
   있는 자리»와 «지난 라운드의 흔적»이 구분이 안 된다. 그래서 현황판을 라운드로 가른다.

   ★ 라운드 수는 시나리오가 정한다 — 여기에 2를 박아두지 않는다. 다음 사건은 셋일 수
     있다. 읽는 순서는 시나리오가 확실히 말해주는 쪽부터다:
       ① SCEN.apByRound  (AP_BY_ROUND 의 키)
       ② SCEN.phases[].round
       ③ 카드의 round — 위 둘이 안 실려 와도 이건 늘 온다(마지막 보루)
     ①②는 지금 public_scenario 에 안 실려 있다. 실리면 그쪽이 먼저 쓰인다. */
function dashRounds(){
  const s=new Set();
  const ap=(SCEN&&SCEN.apByRound)||null;
  if(ap) Object.keys(ap).forEach(k=>{ const n=+k; if(n>0) s.add(n); });
  if(!s.size) (SCEN.phases||[]).forEach(p=>{ const n=+p.round; if(n>0) s.add(n); });
  if(!s.size) (SCEN.cardCatalog||[]).forEach(c=>{ const n=+c.round; if(n>0) s.add(n); });
  const cr=+((STATE&&STATE.round)||0); if(cr>0) s.add(cr);
  return Array.from(s).sort((a,b)=>a-b);
}
/* 라운드 이름. 시나리오가 이름을 주면 그걸 쓰고(roundNames), 없으면 「1차」. */
function roundName(n){
  const m=(SCEN&&SCEN.roundNames)||null;
  return (m&&(m[n]||m[String(n)]))||`${n}차`;
}

    // 점수는 줄마다 다를 수 있다 — 같은 값이면 한 번만, 다르면 합을 적는다.
    const pts=keep.reduce((s,n)=>s+(+n.points||0),0);
    out+=`<div class="mynote keep"><div class="lb">${ICO.goal} 내가 찾던 것${pts?` · 끝까지 쥐면 +${pts}`:""}</div>${lines(keep)}</div>`;
  }
  if(eye.length) out+=`<div class="mynote"><div class="lb">${ICO.eye} 내 눈에만 걸리는 것</div>${lines(eye)}</div>`;
  return out;
}
/* 목적격 조사 — 받침이 있으면 '을', 없으면 '를' */
function objp(w){ if(!w) return "를"; const cd=w.charCodeAt(w.length-1);
  return (cd>=0xAC00&&cd<=0xD7A3&&(cd-0xAC00)%28)?"을":"를"; }
/* 조사하면 구역 팝업은 할 일을 다했다 — 닫고, 방금 뽑은 카드를 그 자리에 띄운다.
   예전엔 팝업이 남아 카드를 가려서, 뭘 뽑았는지 보려면 직접 닫고 손패를 열어야 했다. */
async function investigate(id){ const r=await post("/api/investigate",{cardId:id,roleId:myRoleId,clientId}); if(r&&r.error){banner(r.error);sfx("bad");return;} banner(""); sfx("card"); closeModal("mapModal"); await poll(); openCard(id); }
function openCard(id){ const pub=(STATE.revealed||[]).find(c=>c.id===id); const hand=myHand.find(c=>c.id===id); const c=pub||hand; if(!c)return;
  const inHand=!!hand&&!pub;
  $("cardBox").innerHTML=`<div class="mhead">
      <div class="mh-t"><span class="mh-eb">${pub?"전체공개 단서":"손패 · 비공개"}</span>
        <h2>${esc(c.title)}${c.bait?' <span class="pill">※미끼?</span>':''}</h2>${
        // 수수께끼로 연 카드는 큰 화면에서도 열쇠를 단다 — 현황판에서 본 표시가 그대로 따라온다
        (comboOf(c.id)||isPuzzleCard(c.id))?`<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${comboBadge(c.id)}${keyTagFor(c.id,true)}</div>`:""}
        <span class="mh-sub">${esc(c.locName)}${c.spot?" · "+esc(c.spot):""} · R${c.round}</span></div>
      <button class="mh-x" onclick="closeModal('cardModal')" aria-label="닫기">${ICO.close}</button></div>
    <div class="mbody">${pairsOf(c.id).length?`<div class="pchips">${pairsOf(c.id).map(k=>
        `<button class="pill pair${pairReady(k,c.id)?" rdy":""}" onclick="showPairHint('${c.id}',${k.i})">${pairChip(k,c.id,pairReady(k,c.id))}${pairReady(k,c.id)?"맞물림":"조각"}</button>`).join("")}
        <span class="pc-note">${pairsOf(c.id).some(k=>pairReady(k,c.id))?"<b style='color:var(--good)'>짝이 지금 나와 있습니다.</b> 맞춰보세요.":"같은 조각을 단 카드와 맞물립니다"}</span></div>`:""}
      <div class="sec"><div class="b" style="font-size:15px" id="cardText">${esc(c.text)}</div></div>${mynote(c.id)}${cnote(c)}</div>
    <div class="mfoot"><span class="mf-note">${inHand?"알리려면 대화로 말하세요 — 저절로 새어 나가지 않습니다.":"이미 모두가 보고 있는 단서입니다."}</span>
      ${(inHand&&overLimit()>0)?`<button class="btn ember" onclick="dropFromCard('${c.id}')">손패에서 내려놓기</button>`:""}
      <button class="btn" onclick="closeModal('cardModal')">닫기</button></div>`;
  paintCardArt(c.id);
  const box=$("cardBox");
  box.style.setProperty("--mt",pub?"var(--cold)":"var(--gold)");
  box.classList.remove("reveal","shock","bait","clue");
  void box.offsetWidth;
  box.classList.add("reveal", c.id==="A5"?"shock":(c.bait?"bait":"clue"));
  openModal("cardModal");
}
/* 손패가 넘칠 때는 카드를 읽는 그 자리에서 바로 내려놓을 수 있어야 한다.
   「정리하기」로 목록을 다시 열어 같은 카드를 또 찾는 걸음이 하나 더 있었다. */
async function dropFromCard(id){
  const c=myHand.find(x=>x.id===id); if(!c) return;
  const w=c.locName+(c.spot?" · "+c.spot:"");
  if(!await ask({title:"이 카드를 전체공개합니다", body:`「${c.title}」\n\n${w}`,
                 warn:`손패는 ${handLimit()}장까지만 쥘 수 있습니다. 공개한 카드는 되돌릴 수 없습니다.`,
                 ok:"공개", cancel:"쥐고 있기", tone:"danger"})) return;
  closeModal("cardModal");
  const r=await post("/api/publish",{cardId:id,roleId:myRoleId,clientId});
  if(r&&r.error){ banner(r.error); return; }
  await poll();
  banner(overLimit()>0?`아직 ${overLimit()}장 더 내려놔야 합니다.`:"공개했습니다.");
}
async function publish(id){ closeModal("cardModal"); const r=await post("/api/publish",{cardId:id,roleId:myRoleId,clientId}); if(r&&r.error)banner(r.error); await poll(); }

function handWarn(){
  let h="";
  const bn=overBelong();
  if(bn>0){
    const lb=(SCEN&&SCEN.belongLabel)||"소지품";
    h+=`<div class="handwarn">${ICO.card} ${esc(lb)} <b>${belongCards().length}장</b>을 다 봤습니다 —
      손에 남길 <b>${belongLimit()}장</b>을 고르세요.
      <button class="btn ember sm" onclick="showBelongTrim()">고르기</button></div>`;
  }
  const n=overLimit(); if(n>0)
    // 장수는 서버 셈과 같은 자리에서 읽는다 — 여기만 따로 세면 「3/1인데 1장 공개」처럼 안 맞는다
    h+=`<div class="handwarn">${ICO.card} 손패 <b>${clueCount()}/${handLimit()}</b> — <b>${n}장</b>을 공개해야 합니다.
      <button class="btn ember sm" onclick="showHandTrim()">정리하기</button></div>`;
  return h;
}
function belongLimit(){ return (STATE&&STATE.belongLimit)||2; }
function overBelong(){ return myRoleValid()? ((STATE&&STATE.overBelong)||0) : 0; }

/* 소지품 정리 — 넷의 물건을 다 본 다음 손에 남길 것을 고른다.
   안 고른 것은 공개되지 않고 그냥 사라진다. 봤다는 사실만 남는다. */
let belongKeep=[];
function showBelongTrim(){
  if(overBelong()<=0) return;
  const lim=belongLimit(), cards=belongCards().filter(c=>(myHand||[]).some(x=>x.id===c.id));
  belongKeep=[];
  const lb=(SCEN&&SCEN.belongLabel)||"소지품";
  const rows=cards.map(c=>`<button class="trimrow" data-id="${c.id}" onclick="toggleBelong('${c.id}')">
      <span class="tr-t">${esc(c.title)}</span>
      <span class="tr-s">${esc(c.spot||c.locName)}</span>
      <span class="tr-k">남김</span></button>`).join("");
  $("trimBox").innerHTML=`<div class="mhead"><div class="mh-t"><h2>${esc(lb)} 정리</h2></div>
      <button class="mh-x" onclick="closeModal('trimModal')">${ICO.close}</button></div>
    <div class="mbody">
      <div class="mlead">넷의 것을 다 봤습니다. 이 중 <b>${lim}장</b>만 손에 남습니다.
        고르지 않은 것은 공개되지 않고 그냥 사라집니다 — 읽은 내용은 기억에만 남아요.</div>
      <div class="trimlist">${rows}</div></div>
    <div class="mfoot"><span class="mf-note" id="belongMsg">0/${lim} 골랐습니다</span>
      <button class="btn ember" id="belongGo" disabled onclick="belongConfirm()">이대로 남기기</button></div>`;
  openModal("trimModal");
}
function toggleBelong(id){
  const lim=belongLimit(), i=belongKeep.indexOf(id);
  if(i>=0) belongKeep.splice(i,1);
  else { if(belongKeep.length>=lim) return; belongKeep.push(id); }
  document.querySelectorAll("#trimBox .trimrow").forEach(el=>el.classList.toggle("on",belongKeep.indexOf(el.dataset.id)>=0));
  $("belongMsg").textContent=`${belongKeep.length}/${lim} 골랐습니다`;
  $("belongGo").disabled=belongKeep.length!==lim;
}
async function belongConfirm(){
  const r=await post("/api/belongings/keep",{giveId:belongKeep.join(","),takeId:"",roleId:myRoleId,clientId});
  if(r&&r.error){ banner(r.error); return; }
  closeModal("trimModal"); await poll(); banner("남길 것을 골랐습니다.");
}

/* ── 손패 상한 — 넘치면 남길 카드를 고르고, 고르지 않은 카드는 전체공개로 내려놓는다 ── */
function handLimit(){ return (STATE&&STATE.handLimit)||3; }
/* 넘친 장수는 서버가 센다. 도구·열쇠 반쪽을 상한 밖으로 빼는 셈이 서버에만 있어서,
   여기서 다시 세면 도구를 하나 줍는 순간 「손패가 넘쳤다」가 잘못 뜬다.
   서버는 넘치는 사람만 실어 보낸다 — 목록에 없으면 안 넘친 것이다. */
function overLimit(){
  if(!myRoleValid()) return 0;
  const sv=STATE&&STATE.overLimit;
  if(sv&&typeof sv==="object") return Math.max(0, +(sv[myRoleId]||0));
  return Math.max(0, clueCards().length-handLimit());
}
/* 여러 장을 한 번에 고른다. 예전에는 한 장 고르고 → 확인 → 창이 다시 뜨고 → 또 한 장이라,
   세 장을 내려놓으려면 같은 창을 세 번 지나야 했다. 그동안 무엇을 이미 내려놨는지도
   화면에 안 남았다.
   ★ 서버에는 여러 장을 받는 창구가 없다(/api/publish 는 한 장, /api/belongings/keep 은
     소지품 전용이다). 그래서 «보내는 것»은 한 장짜리를 순서대로 보내고, «화면»에서는
     한 번의 동작으로 보이게 한다 — 고르는 것도 확인도 한 번이고, 중간에 창이 안 튄다. */
let trimPick=[], trimBusy=false;
function trimNeed(){ return overLimit(); }
function showHandTrim(){
  const need=trimNeed(); if(need<=0) return;
  trimPick=[]; trimBusy=false;
  const cards=clueCards();
  $("trimBox").innerHTML=`<div class="mhead">
      <div class="mh-t"><span class="mh-eb">손패 상한</span><h2>손패 정리</h2>
        <span class="mh-sub">${need}장을 내려놓아야 합니다</span></div></div>
    <div class="mbody">
    <div class="mlead">손패에는 <b>${handLimit()}장</b>까지만 둘 수 있어요. <b>${need}장</b>을 골라 전체공개로 내려놓아야 합니다.
      여러 장을 한꺼번에 고를 수 있습니다.<br>
      내려놓은 카드는 <b>모두가 보게</b> 되고, 남긴 카드는 계속 나만 봅니다.</div>
    <div class="trimgrid">${cards.map(c=>`
      <button class="trimcard" data-id="${c.id}" aria-pressed="false" onclick="trimSelect('${c.id}')">
        <span class="tck" aria-hidden="true"></span>
        <div class="tt">${esc(c.title)}</div>
        <div class="tm"><span class="pill">${esc(c.locName)}</span>${c.spot?`<span class="pill">${esc(c.spot)}</span>`:''}<span class="pill">R${c.round}</span></div>
        <div class="tb">${esc(c.text)}</div>
        ${c.hint?`<div class="cnote" style="margin-top:8px;font-size:12px"><b>해석</b>${esc(c.hint)}</div>`:""}
      </button>`).join("")}</div></div>
    <div class="mfoot">
      <span class="mf-note" id="trimHint"></span>
      <button class="btn ember" id="trimGo" disabled onclick="trimConfirm()">전체공개</button>
    </div>`;
  $("trimBox").style.setProperty("--mt","var(--ember)");
  trimPaint();
  openModal("trimModal");
}
/* 고른 만큼 채워야 확정이 열린다 — 덜 골라 보내면 서버가 한 장씩 받아 놓고 판이 반쯤
   정리된 채로 남는다. 더 고르는 것도 막는다(되돌릴 수 없는 공개다). */
function trimPaint(){
  const need=trimNeed(), n=trimPick.length;
  document.querySelectorAll("#trimBox .trimcard").forEach(b=>{
    const on=trimPick.indexOf(b.dataset.id)>=0;
    b.classList.toggle("on",on);
    b.setAttribute("aria-pressed",on?"true":"false");
    // 다 골랐으면 나머지는 못 누르게 — 「하나 빼고 다시」가 아니라 「이만큼」이 규칙이다
    b.classList.toggle("full",!on&&n>=need);
  });
  const h=$("trimHint");
  if(h){
    const names=trimPick.map(id=>((myHand.find(x=>x.id===id))||{}).title||"").filter(Boolean);
    h.innerHTML=n>=need
      ? `<b style="color:var(--ember-b)">${esc(names.join(", "))}</b> — ${n}장을 공개합니다`
      : `${need}장 중 <b>${n}장</b> 골랐습니다 — ${need-n}장 더 고르세요`;
  }
  const g=$("trimGo");
  if(g){ g.disabled=trimBusy||n<need; g.textContent=trimBusy?"공개하는 중…":`${n||need}장 전체공개`; }
}
function trimSelect(id){
  if(trimBusy) return;
  const i=trimPick.indexOf(id);
  if(i>=0) trimPick.splice(i,1);
  else { if(trimPick.length>=trimNeed()) return; trimPick.push(id); }
  trimPaint();
}
async function trimConfirm(){
  const need=trimNeed();
  if(trimBusy||trimPick.length<need||!need) return;
  const picks=trimPick.slice();
  const rows=picks.map(id=>{ const c=myHand.find(x=>x.id===id)||{};
    return `「${c.title||id}」  ${c.locName||""}${c.spot?" · "+c.spot:""}`; });
  if(!await ask({title:`${picks.length}장을 전체공개합니다`, body:rows.join("\n"),
                 warn:`손패는 ${handLimit()}장까지만 쥘 수 있습니다. 공개한 카드는 되돌릴 수 없습니다.`,
                 ok:"공개", cancel:"쥐고 있기", tone:"danger"})) return;
  trimBusy=true; trimPaint();
  // 서버는 한 장씩만 받는다 — 순서대로 보내고, 화면에는 한 번의 동작으로 남긴다.
  let done=0, err="";
  for(const id of picks){
    const r=await post("/api/publish",{cardId:id,roleId:myRoleId,clientId});
    if(r&&r.error){ err=r.error; break; }
    done++;
  }
  trimBusy=false; trimPick=[]; await poll();
  if(err){ banner(`${done}장까지 공개했습니다 — ${err}`); }
  if(overLimit()>0){ showHandTrim(); if(!err) banner(`${done}장 공개했습니다 — 아직 ${overLimit()}장 남았습니다.`); }
  else { closeModal("trimModal"); if(!err) banner(`${done}장 공개했습니다.`); }
}

/* 테이블 위 카드와 바꾸기 — 손패가 두 장뿐이라 «지금 감춰야 할 것»이 페이즈마다 바뀐다.
   한 번 내려놓은 카드를 다시 품을 길이 없으면 초반의 한 수가 판 끝까지 간다.
   다만 공짜는 아니다. 도로 품은 만큼 내 것 하나가 반드시 테이블로 나가고, 그 교환은 모두가 본다. */
let swapGive=null, swapTake=null, swapBusy=false;
/* 손패 한 장을 대화에 올린다 — 실제 테이블에서 카드를 뒤집어 내려놓는 동작이다.
   올리는 순간 전체공개가 되므로(모두가 내용을 본다) 무엇이 걸리는지 먼저 알려준다. */
let sharePick=null, shareBusy=false;
function showShare(){
  if(!myRoleValid()) return;
  sharePick=null; shareBusy=false;
  const mineIds=new Set(myHand.map(c=>c.id));
  const pubc=(STATE.revealed||[]).filter(c=>!mineIds.has(c.id));
  if(!myHand.length&&!pubc.length) return;
  const card=(c,mine)=>`<button class="swapcard" data-id="${c.id}" onclick="sharePickOne('${c.id}')">
      <span class="sc-t">${esc(c.title)}</span>
      <span class="sc-w">${esc(c.locName)}${c.spot?" · "+esc(c.spot):""}</span></button>`;
  $("swapBox").innerHTML=`<div class="mhead">
      <div class="mh-t"><span class="mh-eb">카드를 짚으며 말한다</span><h2>${ICO.chat} 대화에 올리기</h2>
        <span class="mh-sub">공개가 아닙니다 — 어느 카드 얘기인지만 알립니다</span></div>
      <button class="mh-x" onclick="closeModal('swapModal')" aria-label="닫기">${ICO.close}</button></div>
    <div class="mbody">
      <div class="mlead">내 손패를 올리면 <b>«이런 걸 하나 쥐고 있다»</b>고 말하는 것이고, 테이블 카드를 올리면 <b>그 카드를 짚는 것</b>입니다.
        어느 쪽이든 내용은 새어 나가지 않고, 카드도 그대로 남습니다.</div>
      ${myHand.length?`<div class="sharesec">내 손패 · 비공개</div>
        <div class="swaprow" id="shareRow">${myHand.map(c=>card(c,true)).join("")}</div>`:""}
      ${pubc.length?`<div class="sharesec cold">테이블 · 전체공개</div>
        <div class="swaprow">${pubc.map(c=>card(c,false)).join("")}</div>`:""}
      <div class="swaphint" id="shareHint">짚을 카드를 고르세요.</div>
      <textarea id="shareSay" class="shareSay" rows="2" placeholder="같이 할 말 (없어도 됩니다) — 이거 좀 이상하지 않아요?"></textarea>
    </div>
    <div class="mfoot"><button class="btn" onclick="closeModal('swapModal')">취소</button>
      <button class="btn" id="shareGo" disabled onclick="shareConfirm()">대화에 올리기</button></div>`;
  $("swapBox").style.setProperty("--mt","var(--cold)");
  openModal("swapModal");
}
function sharePickOne(id){
  sharePick=id;
  document.querySelectorAll("#swapBox .swapcard").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  const mine=myHand.find(x=>x.id===id);
  const c=mine||(STATE.revealed||[]).find(x=>x.id===id);
  $("shareHint").innerHTML=c
    ? (mine?`<b style="color:var(--gold-b)">${esc(c.title)}</b>을(를) 쥐고 있다고 말합니다. 내용은 알리지 않습니다.`
           :`테이블의 <b style="color:var(--cold)">${esc(c.title)}</b>을(를) 짚습니다.`)
    : "짚을 카드를 고르세요.";
  $("shareGo").disabled=!sharePick;
}
async function shareConfirm(){
  if(shareBusy||!sharePick) return;
  shareBusy=true; $("shareGo").disabled=true;
  const say=($("shareSay")||{}).value||"";
  const r=await post("/api/mention",{cardId:sharePick,roleId:myRoleId,clientId,text:say.trim()});
  shareBusy=false;
  if(r&&r.error){ banner(r.error); $("shareGo").disabled=false; return; }
  closeModal("swapModal"); closeModal("handModal");
  await poll();
}

/* 대화창 — 독에서 열면 화면을 다 쓴다. 토론이 길어지면 인라인 창으로는 흐름이 안 보인다. */
function showChatFull(){
  markChatSeen();
  $("chatFullBox").innerHTML=`<div class="mhead sheeth">
      <div class="sh-id"><span class="sh-nm" style="color:var(--gold-b)">${ICO.chat} 대화</span>
        <span class="sh-meta" id="chatFullSub"></span></div>
      </div>
    <div class="chat" id="chatFull"></div>
    <div class="composer">
      <textarea id="chatFullInput" rows="1" placeholder="배역을 골라야 말할 수 있어요"></textarea>
      <button class="btn gold" onpointerdown="event.preventDefault()" onclick="humanSayFrom('chatFullInput')">전송</button>
    </div>`;
  chatDrawn["chatFull"]=undefined;
  const ok=myRoleValid(), c=ok?roleById(myRoleId):null;
  const ta=$("chatFullInput"); ta.disabled=!ok;
  ta.placeholder=sayHint(c);
  ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); humanSayFrom("chatFullInput"); }});
  openModal("chatModal");
  renderChat("chatFull");
  const box=$("chatFull"); box.scrollTop=box.scrollHeight;
}
async function humanSayFrom(id){
  if(!myRoleValid()) return;
  const inp=$(id), t=inp.value.trim(); if(!t) return;
  inp.value=""; inp.style.height="auto";
  // 판이 멈춰 서 있는데 말을 걸었다면 그건 「계속」이다 — 제 말이 안 뜨고 붙잡혀
  // 있으면 안 보내진 줄 알고 또 친다.
  if(dripPaused) dripGo();
  // 보내고 나서 다시 잡아둔다 — 한 마디 하고 또 한 마디 하는 자리다.
  keepTyping(inp);
  const r=await post("/api/human-say",{roleId:myRoleId,clientId,text:t});
  if(r&&r.error)banner(r.error);
  await poll();
  keepTyping(inp);
}
/* 폰에서 자판을 붙잡아 둔다. 초점이 살아 있는 동안은 자판이 접히지 않는다. */
/* 커서가 실제로 움직여야 「마우스 있는 기기」로 본다. hover 미디어 질의는
   터치 겸용 노트북과 에뮬레이터에서 어긋나서, 폰인데 화살표가 떠 있곤 했다. */
(function(){
  const on=()=>document.documentElement.classList.add("cursor");
  const off=()=>document.documentElement.classList.remove("cursor");
  addEventListener("pointermove", e=>{ if(e.pointerType==="mouse") on(); }, {passive:true});
  addEventListener("pointerdown", e=>{ if(e.pointerType==="touch") off(); }, {passive:true, capture:true});
  addEventListener("touchstart", off, {passive:true, capture:true});
})();
/* 아이폰 사파리는 user-scalable=no 를 무시한다 — 확대 제스처를 직접 막는다.
   배치도 확대는 자체 구현이라 이걸로 막히지 않는다. */
["gesturestart","gesturechange","gestureend"].forEach(ev=>
  document.addEventListener(ev, e=>e.preventDefault(), {passive:false}));
document.addEventListener("dblclick", e=>{
  if(e.target.closest && e.target.closest(".mzoom")) return;   // 배치도는 예외
  e.preventDefault();
}, {passive:false});
function keepTyping(inp){ if(inp&&!inp.disabled&&document.activeElement!==inp) inp.focus({preventScroll:true}); }

/* 인물정보 — 누가 무엇을 쥐고 있는지까지는 테이블이 다 안다(조사 마킹이 이미 공개다).
   다만 그 카드가 무엇인지는 못 본다. 여기서도 자리만 보이고 제목은 잠근다. */

/* 피해자도 배역이다 — 배역 선택창과 같은 카드로 세운다. 다른 틀을 쓰면 다른 세계처럼 읽힌다. */
/* 피해자가 페이즈에 따라 갈아 끼워지는 사건이 있다 — 《자명종》은 시신 → 위중 → 시신이다.
   victimStages 가 없으면 예전대로 SCEN.victimCard 하나를 쓴다. */
function vicStage(){
  const raw=SCEN&&SCEN.victimStages; const ls=Array.isArray(raw)?raw:[];   // 빈 dict 를 넣은 사건이 있어 형을 본다
  const sq=(STATE&&STATE.seq)||0;
  let cur=null; for(const st of ls){ if(sq>=(st.fromSeq||0)) cur=st; }
  return cur||{};
}

         깔았는데, 이 사건의 원고에는 그 값이 아예 없어서 띠가 통째로 비어 있었다.

    <div class="vic-facts">${((v.facts&&v.facts.length)?v.facts

/* 내 배역이 저 사람을 어떻게 보는가. 나 자신에 대한 칸은 없다 —
   남이 나를 어떻게 보는지는 내가 판단할 몫이 아니다. */
function impressionHTML(rid){

  const t=((STATE&&STATE.impression)||{})[rid];

/* ── 나이 ──────────────────────────────────────────────────────────
   서버가 「그 칸에 그대로 뜰 글자」까지 만들어 내려보낸다. 화면이 「이 배역은 나이를
   스스로 적는 자리인가」를 스스로 가르려면 결국 그 명단을 받아야 하는데, 그 명단이 곧
   이 판의 답이다 — 셋 중 하나만 자기 나이를 댈 수 있다. 그래서 여기서는 글자만 읽는다. */
function ageShown(){ const a=(STATE&&STATE.ages)||{}; return Object.keys(a).some(k=>a[k]); }
/* 아직 아무도 안 적었으면 그 칸은 「—」다. 나이를 아예 안 쓰는 사건에서는 칸 자체가 없다. */
function ageOf(rid){ const v=((STATE&&STATE.ages)||{})[rid]||""; return v||(ageShown()?"—":""); }
/* 나이 입력칸 — 「내가 적을 수 있는 자리」에만 뜬다. 서버가 그 사실을 나에게만 알려준다.
   남의 화면에는 이 칸이 있다는 흔적도 안 남는다 — 그게 새면 그 자리에서 정체가 드러난다. */
function ageBoxHTML(rid){
  const ask=STATE&&STATE.ageAsk;
  if(!ask||!rid||rid!==myRoleId) return "";
  const cur=ask.mine||"";
  /* 칸은 그 배역의 키컬러를 쓴다 — 이 화면에서 「내 것」인 자리는 늘 내 색이다.
     배역을 여기에 박지 않는다. 다른 사건에서는 다른 배역이 적는다. */
  const rc=((roleById(rid)||{}).color)||"var(--gold)";
  /* ★ 한 번 적으면 끝이다. 고칠 수 있으면 그 숫자가 판 위의 사실이 안 된다 —
     몰린 뒤에 슬쩍 바꿔 대는 길이 열린다. 그래서 이미 적힌 자리에는 입력칸도
     「고치기」도 아예 안 그린다. 서버도 두 번째 요청을 409로 막는다. */
  if(cur) return `<div class="agebox done" style="--rc:${rc}">
    <span class="k">내 나이</span><span class="agefix">${esc(cur)}</span>
    <span class="d">인물정보에 박혔습니다 — 한 번만 적을 수 있어 고칠 수 없습니다.</span></div>`;
  // 이 칸은 인물정보와 롤카드 두 군데에 동시에 뜬다 — id 로 찾으면 둘 중 아무거나 잡힌다.
  // 그래서 누른 단추에서 제 칸을 거슬러 찾는다.
  return `<div class="agebox" style="--rc:${rc}">
    <span class="k">당신의 나이를 적으세요</span>
    <input class="agein" inputmode="numeric" maxlength="3" autocomplete="off"
      value="" placeholder="숫자" onkeydown="if(event.key==='Enter')saveAge(this)">
    <button class="agebtn" onclick="saveAge(this)">적기</button>
    <span class="d">당신 자신의 나이입니다. <b>한 번만</b> 적을 수 있고, 적으면 인물정보에서 모두가 봅니다.</span></div>`;
}
async function saveAge(el){
  const box=el&&el.closest?el.closest(".agebox"):null;
  const i=(box&&box.querySelector(".agein"))||document.querySelector(".modal.on .agein");
  if(!i) return;
  const v=(i.value||"").trim();
  if(!v){ banner("나이를 적어주세요"); return; }
  const r=await post("/api/age",{roleId:myRoleId,clientId,age:v});
  const redraw=()=>{ // 열려 있는 창을 그 자리에서 다시 그린다 — 적자마자 자기 칸이 채워져야 한다.
    if($("whoModal").classList.contains("on")) showWho(true);
    if($("sheetModal")&&$("sheetModal").classList.contains("on")) showMySheet(); };
  if(r&&r.error){
    // 서버가 준 말을 그대로 띄운다. 두 번째 요청은 409 「나이는 한 번만 적을 수 있습니다」다 —
    // 그 말이 왔다는 건 이미 적혔다는 뜻이라, 판을 다시 읽어 칸을 읽기전용으로 바꿔 준다.
    banner(r.error); await poll(); redraw(); return;
  }
  await poll(); redraw();
  banner("나이를 적었습니다.");
}

/* ── 종막 질문지 ──────────────────────────────────────────────────
   선지형이다. 시나리오가 선지를 주면 라디오로 그리고, 안 주면 예전 서술 입력으로
   그대로 떨어진다 — 시나리오 쪽이 아직 서술형인 동안에도 이 화면은 안 깨진다.

   받는 모양(넉넉하게 읽는다. 어느 이름으로 오든 걸린다):
     "문자열"                                    → 서술형(예전 그대로)
     {q|text|t, choices|options|opts:[...], note} → 선지형
     선지 하나: "문자열"  또는  {id|value, label|text|line}
   답으로 서버에 보내는 것은 «선지의 id» 다(채점이 글자가 아니라 id 로 붙게). */
/* draft = 아직 안 정한 문항. 서버가 이미 걷어내지만, 화면에서도 한 번 더 뺀다 —
   원고를 쓰는 중에 «미정» 이 판에 뜨는 것보다 안 뜨는 쪽이 낫다. */
function finalQs(){ return ((SCEN&&SCEN.finalQuestions)||[]).filter(q=>!(q&&typeof q==="object"&&q.draft)); }
function fqText(q){ return q&&typeof q==="object" ? String(q.q||q.text||q.t||"") : String(q==null?"":q); }
function fqNote(q){ return q&&typeof q==="object" ? String(q.note||q.hint||"") : ""; }
function fqChoices(q){
  if(!q||typeof q!=="object") return [];
  const raw=q.choices||q.options||q.opts||[];
  return (raw||[]).map((o,i)=> (o&&typeof o==="object")
    ? {id:String(o.id!=null?o.id:(o.value!=null?o.value:(o.label||o.text||i))),
       label:String(o.label||o.text||o.line||o.id||"")}
    : {id:String(o), label:String(o)});
}
/* 저장된 답 한 칸을 사람이 읽는 말로. 선지 id 로 저장되므로 되짚어 준다. */
function fqAnswerText(q, v){
  const s=String(v==null?"":v); if(!s) return "";
  const ch=fqChoices(q).find(o=>o.id===s||o.label===s);
  return ch?ch.label:s;
}
function fqHasChoices(){ return finalQs().some(q=>fqChoices(q).length); }
/* 질문지가 이미 «공개» 되었는가 — §7-g. 2차 조사가 끝나면 보여만 주고, 답은 종막에 받는다.
   서버가 신호를 주면 그걸 따르고(STATE.finalSheet.open), 없으면 마지막 조사 막을
   지났는지로 본다. 막 번호도 라운드 수도 시나리오에서 읽는다 — 숫자를 박지 않는다. */
function finalSheetOpen(){
  if(!finalQs().length) return false;
  const fs=(STATE&&STATE.finalSheet)||null;
  const ph=(STATE&&STATE.phase)||{}, k=ph.key||"", seq=+ph.seq||0;
  if(fs&&typeof fs.open==="boolean") return fs.open;
  // FINAL_SHEET 를 그대로 내려주는 판본 — revealSeq 막부터 answerSeq 앞까지가 «공개»다
  if(fs&&fs.revealSeq) return seq>=(+fs.revealSeq) && seq<(+fs.answerSeq||Infinity);
  if(k==="final"||k==="reveal") return false;          // 종막은 답을 받는 화면이 따로 있다
  const inv=(SCEN.phases||[]).filter(p=>p.key==="invest").map(p=>+p.seq);
  if(!inv.length) return false;
  return seq > Math.max.apply(null,inv);
}
/* 이 판의 압박은 채점 규칙 자체다 — 문항보다 이게 먼저 눈에 들어와야 한다(§7-d·7-g). */
function fqWarnHTML(){
  // 큰 글씨 한 줄은 고정이다 — 이게 이 판의 압박이라 사건마다 달라질 자리가 아니다.
  // 그 밑의 설명만 시나리오가 갈아 끼울 수 있다(FINAL_SHEET 의 rule).
  const rule=((STATE&&STATE.finalSheet)||{}).rule||"";
  return `<div class="fqwarn"><div class="fw-t">내 점수가 남의 답에 따라 깎일 수 있습니다</div>
    <div class="fw-d">${rule?esc(rule):`이 질문지는 각자 따로 채점되지 않습니다. 남이 무엇을 적어내는가가
      내 점수에 그대로 얹히고, 그대로 깎입니다 — <b>종막까지 서로를 놓을 수 없습니다.</b>`}</div></div>`;
}
/* 고른 것은 화면에만 둔다. 서버로는 «제출» 을 눌러야 간다. */
let fqPick={};
function fqPickOne(i, id){
  fqPick[i]=(fqPick[i]===id?"":id);
  renderPanel._sig=null; applyState();
}
function fqReady(){
  const qs=finalQs();
  return qs.every((q,i)=>{
    if(!fqChoices(q).length) return true;              // 서술 칸은 강제하지 않는다
    return !!fqPick[i];
  });
}
/* mode: "preview" = 읽기만(2차 조사 뒤) · "answer" = 답을 받는다(종막) */
function finalSheetHTML(mode){
  const qs=finalQs(); if(!qs.length) return "";
  const preview=(mode!=="answer");
  const mine=myRoleValid();
  const done=mine&&!preview&&finalSubmitted(myRoleId);
  const saved=done?(finalAnswersOf(myRoleId)||[]):null;
  const fs=(STATE&&STATE.finalSheet)||{};
  const title=fs.title||(preview?"질문지 · 미리 보기":"종막 · 질문지");
  let h=`<div class="card"><h2>${esc(title)}</h2>`;
  h+=`<div class="fqstate">${preview?"공개됨 · 답은 종막에 받습니다":"지금 답을 확정합니다"}</div>`;
  h+=fqWarnHTML();
  if(fs.intro) h+=`<div class="mlead" style="white-space:pre-wrap">${esc(fs.intro)}</div>`;
  if(preview) h+=`<div class="mlead">여기까지가 오늘 물어볼 것 전부입니다. <b>지금은 고를 수 없습니다</b> —
    남은 시간 동안 이 문항을 겨냥해 움직이세요.</div>`;
  qs.forEach((q,i)=>{
    const ch=fqChoices(q);
    h+=`<div class="fq"><div class="fq-q">${i+1}. ${esc(fqText(q))}</div>`;
    if(fqNote(q)) h+=`<div class="fq-n">${esc(fqNote(q))}</div>`;
    if(ch.length){
      const cur=done?String(saved&&saved[i]||""):(fqPick[i]||"");
      const lock=preview||done||!mine;
      h+=`<div class="fq-opts">`+ch.map(o=>{
        const on=(cur===o.id||cur===o.label);
        return `<button class="fq-o${on?" on":""}"${lock?" disabled":""}
          ${lock?"":`onclick="fqPickOne(${i},'${String(o.id).replace(/'/g,"&#39;")}')"`}>
          <span class="fo-b"></span><span class="fo-n">${esc(o.label)}</span></button>`;
      }).join("")+`</div>`;
      if(done) h+=`<div class="fq-a${cur?"":" none"}">적어낸 답 — ${esc(fqAnswerText(q,cur)||"(무응답)")}</div>`;
    }else if(done){
      h+=`<div class="fq-a${(saved&&saved[i])?"":" none"}" style="white-space:pre-wrap">${esc((saved&&saved[i])||"(무응답)")}</div>`;
    }else if(!preview&&mine){
      h+=`<div class="q-block" style="margin:10px 0 0"><textarea id="qa${i}"></textarea></div>`;
    }
    h+=`</div>`;
  });
  if(preview){
    h+=`<div class="panel-note">답은 <b>종막</b>에 받습니다. 여기서 고쳐 적을 일은 없어요.</div>`;
  }else if(!mine){
    h+=`<div class="panel-note">관전 중 — 배역을 맡은 사람만 답합니다.</div>`;
  }else if(done){
    h+=`<div class="panel-note">적었습니다. 판이 끝나면 다 같이 읽습니다.</div>`;
  }else{
    const ready=fqReady();

      ? (ready?"다 골랐습니다. 내면 되돌릴 수 없습니다.":"선지 문항은 하나씩 다 골라야 냅니다.")
      : "한 문항 이상 적어야 냅니다."}</span>
      <button class="btn ember"${(fqHasChoices()&&!ready)?" disabled":""} onclick="submitFinal()">제출</button></div>`;

  return h+`</div>`;
}

/* 클로드에 그대로 붙여넣는 한 덩어리. 앞머리에 무엇을 해달라는지부터 적는다 —
   붙여넣는 사람이 따로 설명을 보태지 않아도 되게. */
/* 선지 문항은 «고른 선지의 id», 서술 문항은 적은 글이 그대로 간다.
   보내는 모양은 예전과 같은 문자열 배열이라 /api/final-answers 는 안 건드린다. */
async function submitFinal(){ if(gradeBusy)return;
  const qs=finalQs();
  const answers=qs.map((q,i)=> fqChoices(q).length ? (fqPick[i]||"") : ($("qa"+i)?$("qa"+i).value.trim():""));
  const miss=qs.map((q,i)=>[q,i]).filter(([q,i])=>fqChoices(q).length&&!answers[i]);
  if(miss.length){ await say({title:"아직 안 고른 문항이 있습니다",body:`${miss.map(([q,i])=>`${i+1}번`).join(", ")} — 하나씩 골라주세요.`,ok:"알겠습니다"}); return; }
  if(answers.every(a=>!a)){ await say({title:"답이 비어 있습니다",body:"한 문항 이상 적어주세요.",ok:"알겠습니다"}); return; } gradeBusy=true; banner("제출 중…"); const r=await post("/api/final-answers",{roleId:myRoleId,clientId,answers}); gradeBusy=false; if(r&&r.error){banner("제출 오류: "+r.error); return;} localStorage.setItem("pmb.final."+myRoleId,JSON.stringify(answers));
  // 낼 곳이 없는데 '제출 완료'라고 하지 않는다 — 어디로 갔는지를 그대로 말한다
  banner("적었습니다.");
  // 제출 여부는 로컬에만 남아 패널 서명에 안 잡힌다 — 손으로 한 번 무효화해야 화면이 바뀐다
  renderPanel._sig=null;
  await poll(); }
