/* 그날 밤을 분 단위로 편다. 알리바이가 이 장르의 뼈대라, 마지막에 표로 맞춰봐야
   흩어져 있던 카드들이 한 줄로 꿰인다. 진범이 움직인 자리는 따로 물들인다. */
/* 그날 밤 동선. 세로가 구역, 가로가 시각, 인물마다 선 하나.
   같은 방에 같은 시각에 있었으면 선이 한 칸에서 만난다 — 그 겹침만 보이면 된다.
   시각표에 loc 이 없는 시나리오에서는 아무것도 그리지 않고 표만 남긴다. */
function tlMin(t){ const m=/(\d{1,2}):(\d{2})/.exec(t||""); return m?(+m[1])*60+(+m[2]):null; }
function crossHTML(){
  const rows=(STATE.timeline||[]).filter(r=>r.loc&&tlMin(r.t)!==null);
  if(rows.length<4) return "";
  const named={}; (STATE.timelineLocs||[]).forEach(l=>named[l.id]=l.name);
  named["-"]=named["-"]||"복도";
  const order=(STATE.timelineLocs||[]).map(l=>l.id).concat(["-"]);
  const used=[...new Set(rows.map(r=>r.loc))];
  const lanes=order.filter(id=>used.includes(id)).concat(used.filter(id=>!order.includes(id)));
  if(lanes.length<2) return "";
  const li={}; lanes.forEach((id,i)=>li[id]=i);

  const pts={};
  rows.forEach(r=>{
    const who=(r.who?[r.who]:[]).concat(r.with||[]);
    who.forEach(w=>{ (pts[w]=pts[w]||[]).push({m:tlMin(r.t),y:li[r.loc],t:r.t,what:r.what,key:!!r.key}); });
  });
  const cast=Object.keys(pts).filter(w=>roleById(w)&&pts[w].length>1);
  if(!cast.length) return "";
  cast.forEach(w=>pts[w].sort((a,b)=>a.m-b.m));

  const m0=Math.min(...rows.map(r=>tlMin(r.t))), m1=Math.max(...rows.map(r=>tlMin(r.t)));
  const SC_=Math.max(2.6, Math.min(4.2, 620/Math.max(1,m1-m0)));
  const PAD=22, TOP=24, LH=32;
  const X=m=>PAD+(m-m0)*SC_, W=Math.round(PAD*2+(m1-m0)*SC_), H=TOP+lanes.length*LH+8;
  // 같은 방에 같은 시각이면 선이 정확히 포개져 한 사람 것만 보인다. 인물마다 살짝 어긋내 둔다.
  const Y=(i,k)=>TOP+i*LH+LH/2+(k===undefined?0:(k-(cast.length-1)/2)*2.6);

  // 구역 이름은 따로 고정해 둔다 — 가로로 밀어도 어느 방인지 계속 보여야 한다.
  const LW=Math.min(84, 30+Math.max(...lanes.map(id=>(named[id]||id).length))*12);
  const bands=lanes.map((id,i)=>
    `<rect x="0" y="${TOP+i*LH}" width="100%" height="${LH}" fill="${i%2?"rgba(255,255,255,.022)":"transparent"}"/>`).join("");
  const labs=lanes.map((id,i)=>
    `<text x="${LW-9}" y="${Y(i)+4}" text-anchor="end" font-size="11" fill="#8c8681">${esc(named[id]||id)}</text>`).join("");
  const lab=`<svg class="xl-lab" width="${LW}" height="${H}" viewBox="0 0 ${LW} ${H}">${bands}${labs}</svg>`;

  let grid="";
  for(let m=Math.ceil(m0/30)*30; m<=m1; m+=30){
    const x=X(m).toFixed(1), hh=String(Math.floor(m/60)%24).padStart(2,"0"), mm=String(m%60).padStart(2,"0");
    grid+=`<line x1="${x}" y1="${TOP-6}" x2="${x}" y2="${H-6}" stroke="rgba(255,255,255,.07)"/>`
        + `<text x="${x}" y="${TOP-11}" text-anchor="middle" font-size="10" fill="#6f6a66">${hh}:${mm}</text>`;
  }
  const cul=STATE.culpritId||"";
  const lines=cast.map(w=>{
    const c=roleById(w), p=pts[w];
    const j=cast.indexOf(w);
    let d=`M ${X(p[0].m).toFixed(1)} ${Y(p[0].y,j)}`;
    for(let i=1;i<p.length;i++){
      const x=X(p[i].m), px=X(p[i-1].m), k=Math.min(13,Math.max(3,(x-px)*0.4));
      if(p[i].y===p[i-1].y) d+=` L ${x.toFixed(1)} ${Y(p[i].y,j)}`;
      else d+=` L ${(x-k).toFixed(1)} ${Y(p[i-1].y,j)} L ${x.toFixed(1)} ${Y(p[i].y,j)}`;
    }
    const dots=p.map(q=>`<circle cx="${X(q.m).toFixed(1)}" cy="${Y(q.y,j)}" r="${q.key?3.4:2.2}"`
      +` fill="${q.key?c.color:"#151311"}" stroke="${c.color}" stroke-width="1.4">`
      +`<title>${esc(q.t)} · ${esc(c.name)}\n${esc(q.what||"")}</title></circle>`).join("");
    return `<path d="${d}" fill="none" stroke="${c.color}" stroke-width="${w===cul?2.6:1.7}"`
      +` stroke-linejoin="round" stroke-linecap="round" opacity="${w===cul?1:.82}"/>${dots}`;
  }).join("");

  const plot=`<div class="xl-vp"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`
    +lanes.map((id,i)=>`<rect x="0" y="${TOP+i*LH}" width="${W}" height="${LH}" fill="${i%2?"rgba(255,255,255,.022)":"transparent"}"/>`).join("")
    +grid+lines+`</svg></div>`;
  const leg=cast.map(w=>{ const c=roleById(w);
    return `<span><i style="background:${c.color}"></i>${esc(c.name)}${w===cul?" · 진범":""}</span>`; }).join("");

  return `<div class="card"><h2>그날 밤 · 동선</h2>
    <div class="panel-note" style="margin-bottom:10px">가로가 시각, 세로가 구역입니다. 선이 같은 칸에서 만나는 자리가 그 시각 한방에 있었던 순간입니다.</div>
    <div class="xline">${lab}${plot}</div>
    <div class="xl-leg">${leg}</div></div>`;
}
function timelineHTML(){
  const rows=STATE.timeline||[]; if(!rows.length) return "";
  const cul=STATE.culpritId||"";
  const body=rows.map(r=>{ const c=r.who?(roleById(r.who)||null):null;
    return `<div class="rv-r${r.key?" key":""}${r.who===cul?" cul":""}">
      <div class="rv-t">${esc(r.t)}</div>
      <div class="rv-w">${c?`${avaHTML(c,"xs")} <b style="color:${c.color}">${esc(c.name)}</b>`:""}</div>
      <div class="rv-x">${esc(r.what)}</div></div>`; }).join("");
  return `<div class="card"><h2>그날 밤 · 분 단위</h2>
    <div class="panel-note" style="margin-bottom:10px">조사카드는 전부 이 표에 맞춰져 있었습니다. 굵은 줄이 사건의 마디입니다.</div>
    <div class="rv-tl">${body}</div></div>`;
}
/* 자리마다 한 문장씩 고르는 막 — 사건마다 이름이 다르다(「결재」이기도 하고
   「마지막 질문」이기도 하다). 그래서 이 화면은 이름도 물음도 선택지 문구도
   전부 시나리오에서 받아 그린다. 코드에 박아두면 다음 사건에서 남의 이름이 뜬다.

   시나리오가 그 규칙을 켰을 때만(DECISION_BAR_ACCUSED) 지목당한 사람이 제 칸을 잃고,
   그 칸은 남은 사람들이 표로 채운다. 안 켜면 셋이 각자 제 칸을 고른다.

   행선지와 달리 «가리지» 않는다 — 앞사람이 무엇을 골랐는지 보고 따를지 뒤집을지
   정하는 자리라서 순서가 곧 규칙이다. */
/* 이 막의 이름은 사건이 정한다 — 「결재」인 사건도 있고 「마지막 질문」인 사건도 있다.
   여태 「노인정리국 결재」가 코드에 박혀 있어서, 어느 사건을 올려도 그 이름이 떴다. */
function decTitle(){
  const d=(STATE&&STATE.decision)||{};
  return d.title || ((STATE&&STATE.phase)||{}).name || "마지막 선택";
}
/* 자리 하나의 물음과 선택지 문구. 시나리오마다 이름이 갈려서(prompt/q · line/label)
   양쪽을 다 받는다 — 한쪽만 읽으면 그 사건에서 물음이 통째로 빈칸으로 뜬다. */
const decQ=seat=>(seat&&(seat.prompt||seat.q))||"";
const decL=o=>(o&&(o.line||o.label))||"";
function renderDecision(p){
  const d=STATE.decision;
  if(!d){ p.innerHTML=`<div class="card"><h2>${esc(decTitle())}</h2><div class="panel-note">이 사건에는 이 막의 선택지가 없습니다.</div></div>`; return; }
  const mine=myRoleValid()?myRoleId:"";
  const myPick=STATE.myDecision||"";
  const myVotes=STATE.myDecisionVotes||{};
  let h=`<div class="card"><h2>${esc(decTitle())}</h2>
    <div class="mlead" style="white-space:pre-wrap">${esc(d.intro||"")}</div>`;
  if(d.barred){
    h+=`<div class="dc-barred">${ICO.lock} <b>${esc(nameOf(d.barred))}</b>는 범인으로 지목돼 제 칸을 잃었습니다.
      그 칸은 남은 사람들이 표로 채웁니다 — 비워둘 수는 없어요.</div>`;
  }
  h+=`</div>`;

  (d.seats||[]).forEach((seat,i)=>{
    const rid=seat.roleId, done=d.picks&&d.picks[rid];
    const isBarred=(rid===d.barred);
    const isMine=(rid===mine&&!isBarred);
    const canVote=(isBarred&&mine&&mine!==d.barred);
    const chosen=isBarred?(myVotes[rid]||""):(isMine?myPick:"");
    const nvote=(d.votes&&d.votes[rid])||0;
    h+=`<div class="card dseat${done?" sealed":""}">
      <div class="ds-h"><span class="ds-n">${i+1}</span>
        <div><h2 style="margin:0">${esc(seat.seat||nameOf(rid))}</h2>
        ${/* 칸 이름이 곧 사람 이름인 사건이 있다 — 그때 이름을 두 번 적으면 군더더기다.
             이름이 빠져도 가운뎃점이 덩그러니 남으면 안 되므로 조각을 모아서 잇는다 */""}
        <div class="ds-who">${esc([seat.seat===nameOf(rid)?"":nameOf(rid),
              isBarred?"제 칸을 잃음":(isMine?"내 칸":"")].filter(Boolean).join(" · "))}</div></div>
        ${done?`<span class="pill ok">정함</span>`:(isBarred?`<span class="pill">${nvote}/${d.voters} 표</span>`:`<span class="pill">대기</span>`)}
      </div>
      <div class="ds-q">${esc(decQ(seat))}</div>`;
    if(done){
      const opt=(seat.options||[]).find(o=>o.id===done);
      h+=`<div class="ds-line">${esc(decL(opt))}</div>`;
    } else if(isMine||canVote){
      h+=`<div class="ds-opts">`+(seat.options||[]).map(o=>
        `<button class="ds-o${chosen===o.id?" on":""}" onclick="sendDecision('${rid}','${o.id}')">
           <div class="ds-ol">${esc(decL(o))}</div>
           ${o.note&&isMine?`<div class="ds-on">${esc(o.note)}</div>`:""}</button>`).join("")+`</div>`;
      h+=`<div class="panel-note" style="margin-top:8px">${
        canVote?(chosen?"표를 던졌습니다. 전원이 던지면 칸이 찹니다.":"이 칸은 표로 채웁니다.")
               :(chosen?"고쳐 고를 수 있습니다. 전원이 정하면 그대로 넘어갑니다.":"이 칸은 당신 자리입니다.")}</div>`;
    } else {
      // 「데이먼가」가 아니라 「데이먼이」 — 받침에 따라 조사가 갈린다
      h+=`<div class="panel-note">${isBarred?"남은 사람들이 표로 채우는 중입니다."
            :esc(nameOf(rid))+subjP(nameOf(rid))+" 고르는 칸입니다."}</div>`;
    }
    h+=`</div>`;
  });

  // 종이와 상관없는 한 사람의 선택
  const ex=d.extraSpec;
  if(ex&&mine===ex.roleId){
    const cur=d.extra||"";
    h+=`<div class="card dseat extra${cur?" sealed":""}">
      <div class="ds-h"><span class="ds-n" style="background:var(--ember-b)">＊</span>
        <div><h2 style="margin:0">${esc(ex.title||"")}</h2><div class="ds-who">당신에게만 열린 칸</div></div>
        ${cur?`<span class="pill ok">정함</span>`:`<span class="pill">대기</span>`}</div>
      <div class="ds-q">${esc(ex.prompt||"")}</div>
      <div class="ds-opts">`+(ex.options||[]).map(o=>
        `<button class="ds-o${cur===o.id?" on":""}" onclick="sendDecisionExtra('${o.id}')">
           <div class="ds-ol">${esc(o.label)}</div><div class="ds-on">${esc(o.desc||"")}</div></button>`).join("")
      +`</div></div>`;
  }

  if(d.done&&d.report){
    const r=d.report;
    // 이 묶음의 이름도 사건이 정한다(decision_report 의 title). 안 주면 막 이름을 쓴다.
    h+=`<div class="card"><h2>${esc(r.title||decTitle())}</h2>
      <div class="ds-paper">${(r.lines||[]).map(l=>`<div class="ds-pl">${esc(l)}</div>`).join("")}</div>
      ${r.note?`<div class="ds-note${r.flipped?" flip":""}">${esc(r.note)}</div>`:""}
      <div class="panel-note" style="margin-top:10px">이대로 그대로 남습니다. 다음 막에서 무엇이 됐는지 봅니다.</div>
    </div>`;
  } else {
    h+=`<div class="card"><div class="panel-note">아직 정하지 않은 칸이 있습니다. 다 차야 넘어갑니다.</div></div>`;
  }
  // 공개된 질문지는 이 막에서도 눈앞에 있어야 한다 — 무엇을 겨냥하고 고르는지가 이 판이다.
  p.innerHTML=h+(finalSheetOpen()?finalSheetHTML("preview"):"")+nextPhaseBlock();
}
async function sendDecision(seatId,optId){
  const r=await post("/api/decision",{roleId:myRoleId,clientId,targetRoleId:seatId+":"+optId});
  if(r&&r.error) banner(r.error); else { banner(""); poll(); }
}
async function sendDecisionExtra(optId){
  const r=await post("/api/decision/extra",{roleId:myRoleId,clientId,targetRoleId:optId});
  if(r&&r.error) banner(r.error); else { banner(""); poll(); }
}

/* 표를 그대로 펴 보인다 — 누가 누구를 짚었는지가 이 판의 마지막 기록이다. */
function endTallyHTML(e){
  const t=e.tally||{}; const ks=Object.keys(t).sort((a,b)=>t[b]-t[a]);
  if(!ks.length) return "";
  const rows=ks.map(id=>{
    const hit=(id===e.culprit);
    return `<div class="ac-row${hit?" hit":""}"><span>${esc(nameOf(id))}${hit?" · 진범":""}</span><b>${t[id]}표</b></div>`;
  }).join("");
  return `<div class="ac-tally" style="margin-top:12px">${rows}</div>`;
}
function renderReveal(p){
  const e=STATE.ending;
  // 전원이 이름을 적어야 엔딩이 열린다. 그 전에는 그날 밤에 무슨 일이 있었는지부터 본다.
  const head=e
    ? `<div class="verdict ${e.tone==="good"?"good":(e.tone==="warn"?"warn":"bad")}">${esc(e.name)}</div>`
      +endTallyHTML(e)
      +`<div class="rev-sol" style="margin-top:12px">${esc(e.desc)}\n\n─ 진상 ─\n${esc(e.truth)}</div>`
    : `<div class="panel-note">아직 이름을 다 안 적었습니다. 먼저 그날 밤에 실제로 무슨 일이 있었는지부터 봅니다.</div>`;
  const truth=(!e&&STATE.truthFull)?`<div class="card"><h2>진상</h2><div class="rev-sol">${esc(STATE.truthFull)}</div></div>`:"";
  p.innerHTML=`<div class="card"><h2>진상 공개</h2>${head}</div>`+crossHTML()+timelineHTML()+truth+keepGoalsHTML();
}

/* 채팅 */
/* 새로 온 줄만 덧붙인다. 예전엔 누가 한마디 할 때마다 대화창을 통째로 지우고
   전부 다시 그렸다 — 500줄쯤 쌓인 후반부엔 그 한 번이 80ms를 먹었고, 그게 말이
   오갈 때마다 모든 기기에서 동시에 일어났다. 서버가 줄마다 통 번호(n)를 준다. */
const CHAT_KEEP=220;                 // 화면에 남겨두는 최대 줄 수
let chatDrawn={};                    // 대화창 id -> 마지막으로 그린 줄 번호
/* 대사에 카드 제목이 나오면 그 줄 밑에 여는 단추를 붙인다.
   내가 볼 수 있는 카드(전체공개 + 내 손패)만 걸린다 — 남의 손패는 제목이 나와도 못 연다.
   말과 카드를 오가느라 대화를 놓치는 게 이 판에서 제일 자주 나던 불편이었다. */
function canSeeCard(id){
  return (STATE.revealed||[]).some(c=>c.id===id) || (myHand||[]).some(c=>c.id===id);
}
function lockedCard(title){
  banner(`「${title}」은(는) 아직 공개되지 않았습니다 — 쥐고 있는 사람만 내용을 봅니다.`);
}
function chipFor(id,title){
  return canSeeCard(id)
    ? `<button class="cchip" onclick="openCard('${id}')">${ICO.doc} ${esc(title)}</button>`
    : `<button class="cchip lock" onclick="lockedCard('${esc(title).replace(/'/g,"&#39;")}')">${ICO.lock} ${esc(title)}</button>`;
}
function cardChips(text){
  if(!text) return "";
  const seen=new Set(), out=[];
  const pool=(STATE.revealed||[]).concat(myHand||[]);
  for(const c of pool){
    if(!c||!c.title||seen.has(c.id)) continue;
    if(text.indexOf(c.title)<0) continue;
    seen.add(c.id);
    out.push(chipFor(c.id,c.title));
  }
  return out.length?`<div class="cchips">${out.join("")}</div>`:"";
}

function chatRow(m){
  if(m.kind==="system"){ const s=document.createElement("div"); s.className="sys"+(m.broadcast?" bc":"");
    s.innerHTML=esc(m.text)+cardChips(m.text); return s; }
  if(m.kind==="gm"){ const s=document.createElement("div"); s.className="gmsay";
    s.innerHTML=`<span class="g">GM</span><span class="t">${esc(m.text)}</span>`; return s; }
  if(m.kind==="cardref"){
    const s=document.createElement("div"); s.className="sys ref";
    s.innerHTML=esc(m.text)+`<div class="cchips">${chipFor(m.cardId,m.cardTitle)}</div>`;
    return s; }
  if(m.kind==="alibi"){
    const c=roleById(m.roleId)||{};
    const d=document.createElement("div"); d.className="msg alb-msg"+(m.roleId===myRoleId?" own":"");
    d.innerHTML=`<div class="av">${avaHTML(c,"sm")}</div><div><div class="nm" style="color:${c.color||"#999"}">${esc(m.speaker)}`
      +`<span class="alb-j">${esc(c.job||"")}</span><span class="alb-t">${esc(m.at||"")}</span></div>`
      +`<div class="bub alb-bub">${esc(m.text)}</div></div>`;
    return d; }
  const c=roleById(m.roleId);
  const row=document.createElement("div"); row.className="msg"+(m.roleId===myRoleId?" own":"");
  row.innerHTML=`<div class="av">${avaHTML(c,"sm")}</div><div><div class="nm" style="color:${c?c.color:"#999"}">${esc(m.speaker)}${m.kind==="human"?'<span class="tag-me">사람</span>':''}</div><div class="bub">${esc(m.text)}</div>${cardChips(m.text)}</div>`;
  return row;
}
/* ── 한 줄씩 흘려보내기 ────────────────────────────────────────────
   소지품이 열릴 때 사람들이 하는 말은 서버에서 한 덩어리로 도착한다. 그대로 붙이면
   대여섯 줄이 동시에 솟아서 «누가 누구 말을 받았는지»가 사라진다 — 그건 대화가 아니라
   공지다. 그래서 drip 표가 붙은 줄은 붙잡아 뒀다가 0.5초 간격으로 하나씩 푼다.
   푸는 건 대화창을 보고 있을 때뿐이다. 안 보고 있으면 그대로 붙잡아 둔다 —
   나중에 열었을 때 처음부터 흘러야 그 자리에 있던 것이 된다. 하단바의 안 읽은 숫자는
   붙잡힌 줄까지 세니까(chatLines 는 원본을 본다) 알림은 도착하는 즉시 뜬다. */
/* 한 줄이 머무는 시간은 그 줄의 길이를 따라간다. 전부 0.5초로 두면 세 줄짜리 증언이
   1.5초 만에 지나가서, 읽는 사람 입장에서는 결국 «와르르»다. 짧은 표시줄은 스치고
   긴 증언은 오래 머문다.

   한 박자는 두 토막이다 — «앞줄이 머무는 시간» 다음에 «다음 사람이 치고 있는 시간»이
   붙고, 그러고서 다음 줄이 뜬다. 사람이 채팅을 치는 순서 그대로다.
     머무는 시간 = 글자수 ÷ 5초 (글자당 200ms)
     말풍선     = 다음 줄 글자수 ÷ 10초 (글자당 100ms)
   상한을 남겨 둔다. 두 줄짜리 증언(50자 남짓)이면 머무는 시간만 10초라 판이 선다.
   여기 대사는 길어야 마흔 자 안팎이라 8초로 잡으면 규칙대로 흐르면서도 사고는 막는다. */
const DRIP_TICK=120;                 // 재는 간격. 아래 시간들이 이보다 성기게 걸린다
const DRIP_PER=200, DRIP_MIN=600, DRIP_CAP=8000;   // 머무는 시간 — 5글자 = 1초
const TYPE_PER=100, TYPE_MIN=400, TYPE_CAP=4000;   // 「치고 있다」 — 10글자 = 1초
/* 밀린 것을 다 흘리는 데 이보다 오래 걸리면 앞엣것은 한 번에.
   배수가 열 배로 늘어 예전 30초로는 네댓 줄만 남고 나머지가 통째로 튀어나왔다.
   한 박자가 대략 7~8초니 2분이면 열대여섯 줄 — 예전과 비슷한 «끝자락»이 남는다. */
const DRIP_BUDGET=120000;
let dripUntil=null;                  // 이 번호까지 풀었다. null이면 아직 첫 폴링 전
let dripTypeAt=0;                    // 앞줄이 머무는 시간이 끝나는 시각 = 말풍선이 뜨는 시각
let dripReadyAt=0;                   // 다음 줄이 뜨는 시각. 0이면 아직 안 쟀다
let dripPaused=false;                // 「계속」을 누를 때까지 멈춰 선 자리
let dripTyping=null;                 // 지금 말풍선을 세워둔 줄의 표식(roleId|번호)
const nOf=m=>(m.n==null?0:m.n);
/* 사람이 말하는 줄인가 — 판이 적는 줄(system·gm·cardref)에는 말풍선을 안 붙인다.
   아무도 치고 있지 않은 줄에 「치고 있다」가 뜨면 그건 거짓말이다. */
const SAY_KIND={ai:1,human:1,alibi:1};
function isSayLine(m){ return !!(m&&m.roleId&&SAY_KIND[m.kind||""]); }
function dripHold(m){
  const t=String((m&&(m.text||m.line))||"");
  return Math.min(DRIP_CAP, Math.max(DRIP_MIN, t.length*DRIP_PER));
}
function dripType(m){
  if(!isSayLine(m)) return 0;
  const t=String((m&&(m.text||m.line))||"");
  return Math.min(TYPE_CAP, Math.max(TYPE_MIN, t.length*TYPE_PER));
}
function dripHeld(){
  const rows=(STATE&&STATE.table)||[];
  if(dripUntil===null) return null;
  return rows.find(m=>m.drip&&nOf(m)>dripUntil)||null;
}
/* 붙잡힌 줄이 나오면 그 뒤는 통째로 자른다 — 걸러내면 뒷줄이 먼저 올라와 순서가 깨진다 */
function chatRows(){
  const rows=(STATE&&STATE.table)||[];
  const m=dripHeld(); if(!m) return rows;
  const i=rows.indexOf(m);
  return i<0?rows:rows.slice(0,i);
}
function chatWatching(){
  if(document.hidden) return false;
  const m=$("chatModal"); if(m&&m.classList.contains("on")) return true;
  const g=$("gmChat"); if(g&&g.offsetParent!==null) return true;
  return false;
}
function repaintChat(){
  if($("chatModal")&&$("chatModal").classList.contains("on")) renderChat("chatFull");
  if($("gmChat")) renderChat("gmChat");
  paintChatBadge();
}
/* 「계속」 — 한 대목이 끝나는 자리에서 판이 스스로 멈춰 선다. 알리바이 한 바퀴가
   끝나고 자기소개로 넘어가는 자리처럼, 성격이 다른 대목이 이어 붙으면 어디서
   끊겼는지가 안 보인다. 누르기 전에는 다음 줄이 안 온다. */
function dripGo(){ dripPaused=false; dripTypeAt=0; dripReadyAt=0; repaintChat(); }
/* 말풍선을 거둔다. 실제로 서 있었을 때만 다시 그린다 — 매 tick마다 그리면 안 된다. */
function dripUntype(){ if(dripTyping===null) return; dripTyping=null; repaintChat(); }
function dripTick(){
  const rows=(STATE&&STATE.table)||[];
  if(dripUntil===null){              // 들어오자마자 밀려 있던 것은 흘리지 않는다
    if(rows.length) dripUntil=Math.max(...rows.map(nOf));
    return;
  }
  let m=dripHeld();
  if(!m||dripPaused||!chatWatching()){ dripUntype(); return; }
  const now=Date.now();
  if(now<dripTypeAt){ dripUntype(); return; }          // 앞줄이 아직 머무는 중
  // 여기서부터가 「다음 사람이 치고 있는」 구간이다. 줄이 늦게 도착했으면 지금부터 잰다 —
  // 앞줄 시간이 이미 지나갔다고 말풍선을 건너뛰면 그 줄만 불쑥 튀어나온다.
  if(!dripReadyAt) dripReadyAt=Math.max(now,dripTypeAt)+dripType(m);
  if(now<dripReadyAt){
    const sig=isSayLine(m)?(m.roleId+"|"+nOf(m)):null;
    if(dripTyping!==sig){ dripTyping=sig; repaintChat(); }
    return;
  }
  // 한참 만에 열었으면 밀린 것이 예산을 넘을 수 있다. 그걸 다 흘리면 지난
  // 이야기만 보고 앉아 있게 된다 — 앞엣것은 한 번에 풀고 끝자락만 흘린다.
  const i=rows.indexOf(m);
  if(i>=0){
    let tot=0, cut=-1;
    for(let k=rows.length-1;k>=i;k--){ tot+=dripHold(rows[k])+dripType(rows[k]);
      if(tot>DRIP_BUDGET){ cut=k; break; } }
    if(cut>=0){ dripUntil=nOf(rows[cut]); m=dripHeld();
      if(!m){ dripTyping=null; repaintChat(); return; } }
  }
  dripUntil=nOf(m);
  dripTypeAt=now+dripHold(m);        // 이 줄이 머무는 시간이 끝나면 다음 사람이 치기 시작한다
  dripReadyAt=0;
  dripTyping=null;
  if(m.stop&&dripHeld()) dripPaused=true;   // 끊는 자리 — 뒤에 더 있을 때만 멈춘다
  if(m.roleId!==myRoleId) sfx("chat");
  repaintChat();
}
setInterval(dripTick, DRIP_TICK);

/* 「치고 있다」 말풍선 — 다음 줄을 말할 사람의 자리에, 채팅 줄과 같은 정렬·같은 아바타로
   선다. 그래야 «저 사람이 지금 치고 있다»로 읽힌다. 내용은 점 세 개뿐이고 그 사람의
   키컬러를 쓴다. 이 줄은 통 번호가 없어서 chatDrawn 셈에 안 들어간다 — 그릴 때마다
   지웠다 다시 붙인다(아래 renderChat). */
function dripTypingMsg(){
  if(dripTyping===null) return null;
  const m=dripHeld();
  return (m&&isSayLine(m)&&(m.roleId+"|"+nOf(m))===dripTyping)?m:null;
}
function typingRow(m){
  const c=roleById(m.roleId)||{};
  const d=document.createElement("div");
  d.className="msg typing"+(m.roleId===myRoleId?" own":"");
  d.innerHTML=`<div class="av">${avaHTML(c,"sm")}</div><div>`
    +`<div class="nm" style="color:${c.color||"#999"}">${esc(m.speaker||c.name||"")}</div>`
    +`<div class="bub tybub" style="--tc:${c.color||"var(--sub)"}" aria-label="입력 중">`
    +`<i></i><i></i><i></i></div></div>`;
  return d;
}

function renderChat(boxId){
  const id=boxId||"chatFull", box=$(id); if(!box) return;
  const rows=chatRows();
  // 흘리려고 붙잡아 둔 것뿐이면 아직 그릴 게 없는 것이지 창이 빈 게 아니다 — 지우면 안 된다
  if(!rows.length&&((STATE&&STATE.table)||[]).length) return;
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  const ty=box.querySelector(":scope > .typing"); if(ty) ty.remove();   // 새 줄은 말풍선 앞에 붙는다
  const go=box.querySelector(":scope > .dripgo"); if(go) go.remove();   // 새 줄은 단추 앞에 붙는다
  let last=chatDrawn[id];
  const first=rows.length?(rows[0].n||0):0, tail=rows.length?(rows[rows.length-1].n||0):-1;
  // 못 본 사이에 창이 밀려났거나(오래 떠나 있었다) 방이 초기화돼 번호가 되감겼으면 다시 그린다
  if(last===undefined||!rows.length||first>last+1||tail<last){ box.innerHTML=""; last=-1; }
  let added=0;
  const frag=document.createDocumentFragment();
  for(const m of rows){ const n=(m.n==null?0:m.n); if(n<=last) continue; frag.appendChild(chatRow(m)); last=n; added++; }
  if(added) box.appendChild(frag);
  chatDrawn[id]=last;
  while(box.children.length>CHAT_KEEP) box.removeChild(box.firstChild);
  const tym=dripTypingMsg();
  if(tym) box.appendChild(typingRow(tym));
  if(dripPaused){
    const d=document.createElement("div"); d.className="dripgo";
    d.innerHTML=`<button class="btn gold sm" onclick="dripGo()">계속 ›</button>`;
    box.appendChild(d);
  }
  if((near&&(added||tym))||dripPaused) box.scrollTop=box.scrollHeight;
}
/* 키보드가 올라오면 화면이 줄어든다(dvh). 그때 대화창이 읽던 자리에 그대로 있으면
   방금 온 말이 위로 밀려 사라진 것처럼 보인다 — 바닥에 붙어 있었으면 계속 바닥에 붙인다. */
(function(){
  const vv=window.visualViewport; if(!vv) return;
  const stick=()=>{ const box=$("chatFull"); if(!box) return;
    if(box.scrollHeight-box.scrollTop-box.clientHeight<120) box.scrollTop=box.scrollHeight; };
  const tick=()=>{ requestAnimationFrame(stick); setTimeout(stick,180); };
  vv.addEventListener("resize",tick);
})();
/* 자판이 올라와 있는 동안 하단바와 진행 띠는 물러난다. 화면이 반으로 주는데 그 좁은 자리를
   또 먹으면 쓰던 말이 가려진다. 그때 누르고 싶은 건 전송뿐이다.
   높이 차이로 재는 건 못 믿는다 — 자판이 열릴 때 innerHeight 도 같이 줄어드는 브라우저가 있어
   차이가 0으로 나온다. 그냥 입력칸에 초점이 있는가로 판단한다. */
function setKbd(up){
  const h=document.documentElement;
  if(h.classList.contains("kbd")===up) return;
  h.classList.toggle("kbd",up);
  measureDock();
}
document.addEventListener("focusin", e=>{
  if(e.target && e.target.tagName==="TEXTAREA" && !e.target.disabled) setKbd(true);
});
document.addEventListener("focusout", e=>{
  if(!(e.target && e.target.tagName==="TEXTAREA")) return;
  // 전송 단추를 누른 것뿐이면 곧바로 초점이 돌아온다 — 한 박자 뒤에 확인한다.
  setTimeout(()=>{ const a=document.activeElement;
    if(!(a && a.tagName==="TEXTAREA" && !a.disabled)) setKbd(false); }, 120);
});
/* 대화 목록을 누르면 자판이 내려간다 — 읽으려고 누른 것이지 쓰려던 게 아니다. */
document.addEventListener("pointerdown", e=>{
  if(!document.documentElement.classList.contains("kbd")) return;
  const t=e.target;
  if(t.closest && (t.closest(".composer") || t.closest("textarea") || t.closest("button"))) return;
  const a=document.activeElement;
  if(a && a.tagName==="TEXTAREA") a.blur();
}, true);
/* 머리띠의 이름 한 줄과 하단바의 손패 표시 — 폴링마다 여기서 맞춘다. */
function paintSeat(){
  const ok=myRoleValid(), c=ok?roleById(myRoleId):null;
  // 「내 것」 표시에 금색을 쓰면 금색이 키컬러인 배역과 섞인다 — 내 배역의 색으로 칠한다.

  const me=$("pMe");

          // 관전 중일 때는 가리킬 색이 없다 — 점도 같이 없앤다.
          me.classList.toggle("nodot", !ok);

/* 「오세린이」·「문재이가」 — 받침에 따라 조사가 갈린다. */
function subjP(name){ const ch=(name||"").slice(-1).charCodeAt(0);
  if(isNaN(ch)||ch<0xAC00||ch>0xD7A3) return "이";
  return ((ch-0xAC00)%28)?"이":"가"; }
function sayHint(c){ return c?`${c.name}${subjP(c.name)} 되어 말하세요…`:"배역을 골라야 말할 수 있어요"; }
/* 「2차 조사로」·「종막으로」 — 받침에 따라 갈린다(ㄹ 받침은 「로」). */
function toP(w){ const ch=(w||"").slice(-1).charCodeAt(0);
  if(isNaN(ch)||ch<0xAC00||ch>0xD7A3) return "로";
  const t=(ch-0xAC00)%28; return (t===0||t===8)?"로":"으로"; }
async function advance(){
  const vg=(STATE&&STATE.vault)||null;
  if(vg&&vg.open&&!vg.done){
    await say({title:"아직 다 안 읽었습니다",
      body:"금고에서 나온 서류 두 장을 전원이 읽어야 당주의 방으로 갑니다.\n\n"
          +`지금 ${(vg.read||[]).length}/${vg.need||0} 명이 표시했습니다.`, tone:"cold"});
    return;
  }
  const cur=STATE.phase||{}, nx=(SCEN.phases||[]).find(p=>p.seq===(STATE.seq||0)+1);
  if(!nx){ if(!await ask({title:"여기가 마지막입니다",body:"더 넘길 막이 없습니다.",ok:"알겠습니다",tone:"gold"})) return; return; }
  const left=(k=>k==="invest"?overLimitRoles():[])(cur.key);
  const body=`지금 막 — ${cur.name||""}\n다음 막 — ${nx.name}${nx.min?`  (약 ${nx.min}분)`:""}`
    +(nx.ap?`\n\n조사 ${nx.ap}장이 새로 주어집니다.`:"")
    +(cur.key==="invest"?`\n\n아직 조사하지 않은 사람이 있어도 넘어갑니다.`:"");
  // 확인 쪽은 실제로 판을 넘기는 단추다 — 하단바의 「다음 막」과 같은 네온그린으로 세운다.
  if(!await ask({title:"막을 넘깁니다", body,
                 warn: left&&left.length?`손패가 넘치는 배역이 있습니다 — ${left.join(", ")}`:"",
                 ok:`${nx.name} 시작`, cancel:"조금 더", tone:"cold", okGo:true})) return;
  // clientId를 실어야 서버가 호스트로 알아본다. 안 보내면 403인데 예전엔 조용히 삼켰다.
  const r=await post("/api/advance",{clientId,key:hostKey()});
  if(r&&r.error){ banner(r.error==="host"?"호스트만 페이즈를 넘길 수 있습니다":"진행 실패: "+r.error); return; }
  banner(""); await poll();
}
/* ── 안내창 ────────────────────────────────────────────────────────
   브라우저 기본 alert/confirm은 이 게임의 화면이 아니다 — 폰트도 색도 다르고,
   무엇보다 「무슨 일이 벌어지는지」를 설명할 자리가 없다. 나머지 창과 같은 결로 세운다.

     await ask({title, body, ok, cancel, tone, warn, okGo}) → true/false
   okGo: 확인 쪽이 «실제로 판을 움직이는» 단추일 때 켠다 — 네온그린으로 선다.
         취소는 손대지 않는다.
     await say({title, body, ok, tone})                 → 확인만
     await askText({title, body, value, ok})            → 입력값 또는 null
   tone: "gold"(기본) · "danger"(되돌릴 수 없음) · "cold"(진행) */
const DLG_TONE={gold:["var(--gold)",ICO.dot], danger:["var(--ember-b)",ICO.warn], cold:["var(--cold)",ICO.next]};
function dialog(o){

    m.innerHTML=`<div class="box" style="--mt:${col}" data-wt="${o.kind==="text"?"입력":(o.tone==="danger"?"주의":(o.kind==="say"?"안내":"확인"))}">

        ${o.warn?`<div class="dlg-warn">${esc(o.warn)}</div>`:""}
        ${o.kind==="text"?`<input class="dlg-in" id="dlgIn" value="${esc(o.value||"")}">`:""}</div>

        <button class="btn ${o.okGo?"go":(o.tone==="danger"?"ember":"primary")}" data-o>${esc(o.ok||"확인")}</button>
      </div></div>`;
    m.onclick=e=>{ if(e.target===m) done(o.kind==="text"?null:false); };

    const x=m.querySelector("[data-x]"); if(x) x.onclick=()=>done(o.kind==="text"?null:false);
    document.addEventListener("keydown",key);
    document.body.appendChild(m);
    const f=m.querySelector(o.kind==="text"?"#dlgIn":"[data-o]"); if(f) f.focus();

/* 여럿 중 하나 고르기. 브라우저 기본 select 는 기기마다 생김새가 달라 이 화면과

function pickOne(o){

/* 위에서 내려와 «누를 때까지» 머무는 알림. 「추가 정보가 늘었다」처럼

/* 「추가 정보」가 늘면 한 번 알린다. 배역마다 따로 세고, 새로고침해도 다시 안 뜬다. */
function extraWatch(){
  if(!myRoleValid()||!STATE||STATE.extraN==null) return;
  const k="pmb.extraN."+(STATE.roomId||"")+"."+myRoleId;
  let was=null; try{ was=localStorage.getItem(k); }catch(e){}
  const now=String(STATE.extraN);
  if(was===null){ try{ localStorage.setItem(k,now); }catch(e){} return; }

    try{ localStorage.setItem(k,now); }catch(e){}
    dropNote("추가 정보가 늘었습니다", (SCEN&&SCEN.fragNotice)||"내 정보 · 추가 정보에서 확인하세요");
  } else if(now!==was){ try{ localStorage.setItem(k,now); }catch(e){} }
}
function banner(m){ const b=$("banner");

/* ── 스와이프 카드 캐러셀 (실물카드처럼 옆으로 넘겨보기) ── */
/* always — 장이 하나뿐이어도 점과 화살표를 그린다. 탭을 건너뛸 수 있는 자리라면
   장이 한 장이라는 것과 «여기가 끝이 아니라는 것»이 같이 보여야 한다.
   여기 틀을 통째로 안 그렸더니 한 장짜리 탭이 막다른 길처럼 보였다. */
function buildSwipe(slides, always){
  const track=slides.map(x=>`<div class="sw-slide">${x}</div>`).join("");
  if(slides.length<2&&!always) return `<div class="swipe"><div class="sw-vp"><div class="sw-track">${track}</div></div></div>`;
  const dots=slides.map((_,i)=>`<span class="sw-dot${i===0?" on":""}" data-i="${i}"></span>`).join("");
  return `<div class="swipe">
    <button class="sw-nav prev" aria-label="이전">‹</button>
    <button class="sw-nav next" aria-label="다음">›</button>
    <div class="sw-top"><div class="sw-dots">${dots}</div></div>
    <div class="sw-vp"><div class="sw-track">${track}</div></div></div>`;
}
/* 손가락을 따라 끌리다가 놓으면 붙는다. 문턱만 재서 툭 갈아치우면 넘긴 것이 아니라
   화면이 바뀐 것으로 읽힌다.
   몇 번째 장인지는 변수 하나가 쥔다 — 예전처럼 스크롤 위치에서 되짚지 않는다.
   폰에서 주소창이 접히며 화면이 바뀌면 그 되짚기가 어긋나 보던 자리를 잃었다. */
/* opt.start   — 처음 세울 장. "end" 면 마지막 장(왼쪽 탭에서 건너온 경우)
   opt.onEdge(d) — 끝 장에서 더 밀었을 때. 처리했으면 true 를 돌려준다(그럼 여기서 손을 뗀다)
   opt.hasEdge(d)— 그쪽으로 건너갈 데가 있는가. 화살표를 죽일지 말지에만 쓴다 */
function wireSwipe(box, opt){
  opt=opt||{};
  const sw=box.querySelector(".swipe"); if(!sw)return;
  const vp=sw.querySelector(".sw-vp"), track=sw.querySelector(".sw-track");
  const slides=[...sw.querySelectorAll(".sw-slide")];
  if(!vp||!track||!slides.length) return;
  const dots=[...sw.querySelectorAll(".sw-dot")];
  const prev=sw.querySelector(".sw-nav.prev"), next=sw.querySelector(".sw-nav.next");
  const cnt=sw.querySelector(".sw-cur");
  const scroller=sw.closest(".mbody")||sw.parentElement;
  const N=slides.length;
  let i=(opt.start==="end") ? N-1 : Math.max(0,Math.min(N-1, opt.start||0));

  const fit=()=>{ const h=slides[i]&&slides[i].offsetHeight; if(h) vp.style.height=h+"px"; };
  const place=px=>{ track.style.transform=`translate3d(calc(${-i*100}% + ${px||0}px),0,0)`; };
  const paint=()=>{
    dots.forEach((d,k)=>d.classList.toggle("on",k===i));
    if(cnt) cnt.textContent=i+1;
    // 끝 장이어도 건너갈 옆 탭이 있으면 화살표는 살려둔다
    if(prev) prev.disabled=i<=0&&!(opt.hasEdge&&opt.hasEdge(-1));
    if(next) next.disabled=i>=N-1&&!(opt.hasEdge&&opt.hasEdge(1));
    slides.forEach((sl,k)=>sl.classList.toggle("on",k===i));
  };
  const go=(k,keepTop)=>{
    k=Math.max(0,Math.min(N-1,k));
    const moved=k!==i; i=k;
    place(0); paint(); fit();
    // 장을 넘기면 새 글이다 — 앞 장에서 내려와 있던 자리를 물려받지 않는다.
    if(moved&&!keepTop&&scroller) scroller.scrollTop=0;
  };
  const step=d=>{ if((d<0&&i<=0)||(d>0&&i>=N-1)){ if(opt.onEdge&&opt.onEdge(d)) return; }
                  go(i+d); };
  if(prev) prev.onclick=()=>step(-1);
  if(next) next.onclick=()=>step(1);
  dots.forEach(d=>d.onclick=()=>go(+d.dataset.i));

  // ── 끌기 ──────────────────────────────────────────────────────
  // dx = 화면에 끌어 보인 거리(끝에서는 일부러 죽인다) · raw = 손가락이 실제로 간 거리
  let sx=0, sy=0, dx=0, raw=0, axis=0, t0=0;   // axis: 0 미정 · 1 가로 · -1 세로
  const W=()=>vp.clientWidth||1;
  track.addEventListener("touchstart",e=>{
    if(e.touches.length!==1){ axis=-1; return; }
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; dx=0; raw=0; axis=0; t0=e.timeStamp;
  },{passive:true});
  track.addEventListener("touchmove",e=>{
    if(axis<0||e.touches.length!==1) return;
    const mx=e.touches[0].clientX-sx, my=e.touches[0].clientY-sy;
    if(!axis){
      if(Math.abs(mx)<7&&Math.abs(my)<7) return;
      axis=Math.abs(mx)>Math.abs(my)?1:-1;
      if(axis>0){ sw.classList.add("dragging"); vp.style.height=slides[i].offsetHeight+"px"; }
      else return;
    }
    e.preventDefault();               // 가로로 정했으면 세로 스크롤은 넘기지 않는다
    raw=mx; dx=mx;
    // 양 끝에서는 덜 끌린다 — 더 갈 데가 없다는 걸 손으로 알려준다.
    // 옆 탭으로 건너갈 수 있는 끝에서는 덜 죽인다. 여기서 세게 죽여놨더니
    // 손가락을 아무리 밀어도 아래 문턱에 못 닿아서 영영 못 건넜다.
    const dd=dx<0?1:-1;
    if((dd<0&&i<=0)||(dd>0&&i>=N-1)) dx*=(opt.hasEdge&&opt.hasEdge(dd))?0.55:0.32;
    place(dx);
  },{passive:false});
  const drop=e=>{
    if(axis<=0){ axis=0; raw=0; return; }
    sw.classList.remove("dragging");
    // 판정은 «손가락이 간 거리»로 한다. 끌린 그림(dx)은 끝에서 일부러 죽여놨으니
    // 그걸로 재면 끝 장에서는 어떤 스와이프도 문턱을 못 넘는다.
    const w=W(), dt=Math.max(1,(e&&e.timeStamp||0)-t0), v=Math.abs(raw)/dt;
    // 짧고 빠르게 튕겨도 넘어간다. 천천히 끌면 3분의 1은 와야 한다.
    const pass=Math.abs(raw)>w*0.32 || (v>0.45&&Math.abs(raw)>28);
    const d=raw<0?1:-1;
    axis=0; dx=0; raw=0;
    // 끝 장에서 더 밀었으면 옆 탭으로 건너간다 — 받아준 쪽이 새로 그리니 여기선 손을 뗀다
    if(pass&&((d<0&&i<=0)||(d>0&&i>=N-1))&&opt.onEdge&&opt.onEdge(d)) return;
    go(pass ? i+d : i, !pass);
  };
  track.addEventListener("touchend",drop,{passive:true});
  track.addEventListener("touchcancel",drop,{passive:true});

  // 커서가 있는 기기에서만 — 화살표에 가까워질수록 진해진다. 손가락 기기는 CSS가 감춰둔다.
  // 시트를 다시 그릴 때마다 wireSwipe 가 불리므로, 리스너는 언제나 하나만 살려둔다.
  if([prev,next].filter(Boolean).length){
    if(wireSwipe._offNear) wireSwipe._offNear();
    const navs=[prev,next].filter(Boolean);
    const NEAR=190;                        // 이만큼 안으로 들어오면 보이기 시작한다
    const onMove=e=>navs.forEach(n=>{
      const r=n.getBoundingClientRect();
      const dx=Math.max(r.left-e.clientX, 0, e.clientX-r.right);
      const dy=Math.max(r.top-e.clientY, 0, e.clientY-r.bottom);
      const d=Math.hypot(dx,dy);
      n.style.setProperty("--p", (d>=NEAR?0:1-d/NEAR).toFixed(3));
    });
    addEventListener("pointermove", onMove, {passive:true});
    wireSwipe._offNear=()=>{ removeEventListener("pointermove", onMove); wireSwipe._offNear=null; };
  }
  // 웹폰트·사진이 늦게 오면 높이가 나중에 잡힌다 — 지금 장의 높이만 다시 맞춘다.
  if(window.ResizeObserver){ const ro=new ResizeObserver(()=>{ if(!sw.classList.contains("dragging")) fit(); });
    slides.forEach(sl=>ro.observe(sl)); }
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit).catch(()=>{});
  sw.querySelectorAll("img").forEach(im=>{ if(!im.complete) im.addEventListener("load",fit,{once:true}); });
  go(i,true);
  requestAnimationFrame(()=>{ place(0); fit(); });   // 폭이 잡힌 뒤 한 번 더
}

/* 내 정보(배역 시트) — 실물카드처럼 스와이프로 넘겨보기(큰 글씨) */
/* 어느 페이즈까지의 시트를 읽었는지. 배역별로 따로 센다 — 배역을 바꾸면 처음부터 다시 새 것이다. */
function loadSheetSeen(){
  try{ sheetSeenSeq=parseInt(localStorage.getItem("pmb.sheetseen."+(myRoleId||""))||"-1",10); }catch(e){ sheetSeenSeq=-1; }
  if(isNaN(sheetSeenSeq)) sheetSeenSeq=-1;
}
function markSheetSeen(){
  const s=(STATE&&STATE.seq!=null)?STATE.seq:0;
  if(s<=sheetSeenSeq) return;
  sheetSeenSeq=s;
  try{ localStorage.setItem("pmb.sheetseen."+(myRoleId||""),String(s)); }catch(e){}

}
/* 밤이 지난 판의 아래칸 — 금고 서류를 다 읽었는지가 여기 뜬다.
   당주의 방을 여는 건 그 다음이다. */
function vaultGateHTML(){
  const v=(STATE&&STATE.vault)||null;
  if(!v||!v.open) return `<div class="panel-note" style="margin-top:12px">아침입니다.</div>`;
  const nm=id=>esc((roleById(id)||{}).name||id);
  // 기다리는 대상은 사람이 앉은 배역뿐이다
  const yet=Object.keys(STATE.roles||{})
    .filter(id=>((STATE.roles[id]||{}).mode==="human")&&!(v.read||[]).includes(id));
  return `<div class="vgate${v.done?" done":""}">
    <div class="vg-h">${ICO.doc} 금고에서 서류 두 장이 나왔습니다</div>
    <div class="vg-t">「내 정보 · 추가 정보」 맨 앞에 들어갔습니다. 다 읽고 표시해 주세요.</div>
    <div class="vg-c">${(v.read||[]).length}/${v.need||0} 읽음${
      yet.length?` · 아직 ${yet.map(nm).join(", ")}`:" · 전원 확인"}</div>
    ${v.done?"":`<button class="btn primary" onclick="sheetTab='extra';showMySheet()">서류 보러 가기</button>`}
  </div>`;
}
/* 「다 읽었습니다」 — 전원이 누르면 다음 막으로 갈 수 있다 */
function vaultBtn(v){
  if(!myRoleValid()) return `<div class="vd-cnt">관전 중 — 배역을 맡은 사람이 표시합니다</div>`;
  const cnt=`<span class="vd-cnt">${(v.read||[]).length}/${v.need||0} 읽음</span>`;
  if(v.mine) return `<div class="vd-act done">${ICO.check} 표시했습니다 ${cnt}</div>`;
  return `<div class="vd-act"><button class="btn primary" onclick="vaultRead()">${esc(v.readLabel||"다 읽었습니다")}</button>${cnt}</div>`;
}
async function vaultRead(){
  const r=await post("/api/vault/read",{roleId:myRoleId,clientId});
  if(r&&r.error){ banner(r.error); return; }
  sfx("go"); await poll(); renderSheetTabs();
}
/* 서류 그림 — /assets/{사건}_doc_{key} 를 찾는다. 없으면 빈 자리를 접는다. */
function paintVaultArt(){
  const sid=(STATE&&STATE.scenarioId)||""; if(!sid) return;
  document.querySelectorAll(".vd-art[data-doc]").forEach(el=>{
    if(el.dataset.done) return;
    const k=el.dataset.doc; if(!k){ el.remove(); return; }
    findAsset(`/assets/${sid}_doc_${k}`, url=>{
      if(!url){ el.remove(); return; }
      el.dataset.done="1";
      el.style.backgroundImage=`url("${url}")`;
      el.classList.add("on");
    });
  });
}
async function showMySheet(){
  if(!myRoleValid())return;
  markSheetSeen();
  let s; try{ s=await (await fetch("/api/sheet/"+myRoleId+"?clientId="+encodeURIComponent(clientId))).json(); }catch(e){ banner("큐카드 로드 실패"); return; }
  if(s.error){ banner(s.error); return; }
  const curPhase=(STATE&&STATE.phase)?STATE.phase.name:"";
  const slides=[];
  // 1) 정체 슬라이드
  // 표지는 얼굴이 먼저다. 여섯 명을 구별하는 건 이름표가 아니라 얼굴이고,
  // 그 밑의 세 줄이 «내가 누구인가»를 한 번에 박아넣는다.
  const meta=[s.age,s.sex,s.job].filter(Boolean).join(" · ");
  slides.push({tab:"main", html:`<div class="bigcard role k-cover" style="--rc:${s.color}">
    <div class="bc-eyebrow">나의 배역</div>
    <div class="cov-top">
      <div class="cov-por">${avaHTML(s,"cover")}</div>
      <div class="cov-info">
        <div class="cov-nm" style="color:${s.color}">${esc(s.name)}</div>
        <div class="cov-sub">${esc(meta)}</div>
        ${s.persona?`<div class="cov-per"><span class="k">이렇게 말한다</span>${esc(s.persona)}</div>`:""}
      </div>
    </div>
    ${ageBoxHTML(s.id)}
    ${s.hook?`<div class="cov-hook">${esc(s.hook)}</div>`:""}
    ${s.hidden?`<div class="bc-hidden">${ICO.flag} 스포일러 배역 — 정체를 들키지 마세요</div>`:``}</div>`});
  // 2) 나의 이야기 — 줄글. 요약을 두 번 겹치면 어디서도 안 풀린다.
  //    사람이 «되어야» 하는 대목이라 카테고리로 쪼개지 않고 한 흐름으로 읽힌다.
  const SL=(SCEN&&SCEN.storyLabels)||{};
  const storySlide=(eb,ttl,txt)=>{ const paras=String(txt||"").split("\n\n").map(t=>t.trim()).filter(Boolean);
    if(!paras.length) return;
    slides.push({tab:"main", html:`<div class="bigcard role k-story" style="--rc:${s.color}">
      <div class="bc-eyebrow">${esc(eb)}</div><div class="bc-title" style="font-size:18px">${esc(ttl)}</div>
      <div class="story">${paras.map(t=>`<p>${storyTx(t)}</p>`).join("")}</div></div>`}); };
  storySlide("나의 이야기", SL.past||"여기까지 오게 된 일", s.storyPast);
  storySlide("사건 당일 행적", SL.today||"그리고 오늘 밤", s.storyToday);
  // 3) 감춰야 할 것 — 줄글에 녹이면 심문당했을 때 «내가 부인해야 하는 게 뭐였더라»를 못 찾는다.
  //    이건 판 중에 제일 급하게 다시 꺼내 보는 항목이라 목록으로 남긴다.
  if((s.hide||[]).length){
    slides.push({tab:"main", html:`<div class="bigcard role k-hide" style="--rc:${s.color}">
      <div class="bc-eyebrow">${esc(SL.when||"오늘 밤")}</div><div class="bc-title" style="font-size:18px">들키면 위험한 사실</div>
      <div class="hidelist">${s.hide.map(t=>`<div class="hideitem">${starTx(t)}</div>`).join("")}</div></div>`});
  }
  // 4) 떠오른 기억
  const frags=(s.fragments||[]);
  // 이 묶음의 이름은 시나리오가 정한다 — 망령은 기억을 되찾지만, 가라앉는 배의 사람들은
  // 잃은 기억이 없다. 거기서 늘어나는 건 이제 꺼내기로 한 말이다.
  const fragL=(SCEN&&SCEN.fragLabel)||"기억의 파편", fragE=(SCEN&&SCEN.fragEyebrow)||"떠오른 기억";
  if(frags.length){ const fh=frags.map((f,i,arr)=>{ const isNew=(f.when===curPhase&&i===arr.length-1); return `<div class="frag${isNew?" newfrag":""}"><div class="w">${esc(fragL)} · ${esc(f.when)}${isNew?" · NEW":""}</div>${esc(f.text)}</div>`; }).join("");
    // 판이 도는 동안 «늘어나는» 글이다. 훑는 자리(한눈에)가 아니라
    // 판 위에서 쓰는 자리(추가 정보)에 둔다 — 새로 생긴 것을 여기서 찾게 된다.
    slides.push({tab:"extra", html:`<div class="bigcard role" style="--rc:${s.color}"><div class="bc-eyebrow">${esc(fragE)}</div><div class="bc-title" style="font-size:18px">${esc(fragL)}</div><div style="margin-top:14px">${fh}</div></div>`}); }
  // 4-b) 고갯짓 — 질문지의 결과.
  //       늘어나는 것들(조각·고갯짓)이 앞이고 늘 있는 것(배치도)이 뒤다 — 새로 생긴 걸 여기서 찾는다. 줄글로 적으면 여섯 줄이 뭉개져서 한 장으로 세운다.
  //       물은 것과 «아무도 안 물은 것»이 같은 무게로 보여야 한다 — 안 물어진 쪽이 이 막의 기록이다.
  const ask=(STATE&&STATE.ask)||null;
  if(ask&&(ask.asked||[]).length){
    const done=(ask.questions||[]).filter(q=>q.askedBy), left=(ask.questions||[]).filter(q=>!q.askedBy);
    const qh=q=>`<div class="nq ${q.a==="nod"?"nod":"shake"}">
      <div class="nq-q">「${esc(q.q)}」</div>
      <div class="nq-a"><b>${esc(q.a==="nod"?ask.nod:ask.shake)}</b>
        <span class="by">${esc(nameOf(q.askedBy))}${subjOf(nameOf(q.askedBy))} 물었다</span></div></div>`;
    const lh=q=>`<div class="nq off"><div class="nq-q">「${esc(q.q)}」</div></div>`;
    slides.push({tab:"extra", html:`<div class="bigcard role" style="--rc:${s.color}">
      <div class="bc-eyebrow">2차 사건 · 질문지</div>
      <div class="bc-title" style="font-size:18px">고갯짓 ${done.length}번</div>
      <div class="nqlist">${done.map(qh).join("")}</div>
      ${left.length?`<div class="nq-sep">아무도 안 물은 것 ${left.length}</div>
        <div class="nqlist">${left.map(lh).join("")}</div>`:""}
      <div class="knownote" style="margin-top:14px">답은 끄덕이거나 젓는 것뿐이었다.
        <b>안 물어진 것</b>은 이 판에서 영영 안 열린다.</div></div>`});
  }
  // 4-c) 그날 밤 — 내가 한 일과, 아침에 남들에게서 눈에 걸린 것.
  //       조각에 줄글로 섞여 있던 것을 제 자리로 뺐다. 밤은 이 판에서 제일 무거운 하루라
  //       다른 기록에 묻히면 안 된다. 늘어나는 것들 뒤, 늘 있는 것(배치도) 앞이다.
  const nr=s.nightReport;
  if(nr&&(nr.before||nr.mine||(nr.eyes||[]).length)){
    const blk=(lb,tx,k)=>tx?`<div class="ntb ${k}"><div class="ntb-h">${esc(lb)}</div>
      <div class="ntx">${esc(tx)}</div></div>`:"";
    slides.push({tab:"extra", html:`<div class="bigcard role k-night" style="--rc:${s.color}">
      <div class="bc-eyebrow">${esc(nr.kick||"밤이 지나고")}</div>
      <div class="bc-title" style="font-size:18px">${esc(nr.title||"그날 밤, 나는")}</div>
      ${blk(nr.beforeLabel||"밤이 오기 전 · 나만 아는 것", nr.before, "pre")}
      ${blk(nr.mineLabel||"그날 밤 · 내가 한 일", nr.mine, "post")}
      ${(nr.eyes||[]).length?`<div class="eyes">
        <div class="eyes-h">${ICO.eye} ${esc(nr.eyesLabel||"아침에 눈에 걸린 것")}</div>
        ${nr.eyes.map(e=>`<div class="eye" style="--ec:${e.color||"var(--line)"}">
          <div class="eye-a">${avaHTML(e,"sm")}</div>
          <div class="eye-w"><div class="eye-n">${esc(e.name)}<i>${esc(e.job||"")}</i></div>
            <div class="eye-t">${esc(e.text)}</div></div></div>`).join("")}
        <div class="knownote" style="margin-top:12px">달라진 것이 눈에 들어왔을 뿐이다.
          <b>왜 그런지는 안 적혀 있다.</b></div></div>`:""}
    </div>`});
  }
  // 4-e) 소지품 — 판이 열릴 때부터 품에 있던 것. 조사카드가 아니라 손패에도 안 들어가고
  //       내려놓을 수도 없다. 1차 지목에서 표가 제일 많이 모이면 그 자리에서 압수되고,
  //       압수된 것만 남의 화면에 붙는다. 그 전에는 «누가 무엇을 쥐고 있다»조차 안 내려온다.
  const bl=(STATE&&STATE.belongings)||null;
  if(bl&&bl.mine){
    const b=bl.mine;
    slides.push({tab:"extra", html:`<div class="bigcard role k-belong${bl.mineSeized?" seized":""}" style="--rc:${s.color}">
      <div class="bc-eyebrow">${esc(bl.kick||"품 안에 있는 것")}</div>
      <div class="bc-title" style="font-size:18px">${esc(b.title||"")}</div>
      <div class="bg-spot">${esc(b.spot||"")}</div>
      ${bl.mineSeized?`<div class="bg-seized">${ICO.warn}<span>압수됐습니다 — 이건 이제 <b>모두가 봅니다.</b></span></div>`:""}
      <div class="ntx bg-tx">${esc(b.text||"")}</div>
      ${b.hint?`<div class="knownote" style="margin-top:12px">${esc(b.hint)}</div>`:""}
      ${bl.note?`<div class="bg-note">${esc(bl.note)}</div>`:""}</div>`});
  }
  ((bl&&bl.seized)||[]).forEach(b=>{
    slides.push({tab:"extra", html:`<div class="bigcard role k-belong seized" style="--rc:${b.color||s.color}">
      <div class="bc-eyebrow">${esc(bl.seizedLabel||"압수된 소지품")}</div>
      <div class="bc-title" style="font-size:18px">${esc(b.title||"")}</div>
      <div class="bg-who"><span class="bg-a">${avaHTML(b,"sm")}</span>

const SHEET_TABS=[["main","나의 이야기"],["extra","추가 정보"],["sum","한눈에"]];
let sheetSlides=[], sheetRole=null, sheetTab="main";

function tabSeenKey(){ return "pmb.shtabs."+(myRoleId||""); }
function tabsSeen(){
  try{ return new Set(JSON.parse(localStorage.getItem(tabSeenKey())||"[]")); }catch(e){ return new Set(); }
}
function markTabSeen(t){

  q.add(t); try{ localStorage.setItem(tabSeenKey(),JSON.stringify([...q])); }catch(e){}
}

function hasUnseenTab(){
  if(!myRoleValid()) return false;
  const q=tabsSeen();
  // 아직 한 번도 안 연 판에서는 어떤 탭이 있는지 모른다 — 셋 다 안 봤다고 본다.
  if(!sheetSlides.length) return q.size<SHEET_TABS.length;
  return SHEET_TABS.some(([k])=>sheetSlides.some(x=>x.tab===k)&&!q.has(k));
}
/* 탭을 건너오면 어느 장부터 볼지 — 왼쪽 탭에서 넘어왔으면 그 탭의 마지막 장부터다.

function sheetTabList(){ return SHEET_TABS.filter(([k])=>sheetSlides.some(x=>x.tab===k)).map(([k])=>k); }

/* 마지막 장에서 더 밀면 옆 탭으로. 왼쪽으로 건너가면 그쪽 마지막 장에 선다.
   건넌 직후 한 박자는 또 안 건넌다 — 한 장짜리 탭을 지나갈 때 「따닥」 하고
   두 칸이 지나가버려서, 가운데 탭이 뭐였는지 볼 새가 없었다.
   그래도 true 를 돌려준다. false 면 그 스와이프가 장 넘김으로 새서 화면이 튄다. */

function renderSheetTabs(){

function belongLocs(){ return (SCEN&&SCEN.belongLocs)||[]; }

/* 소지품 탭에 들어가는 카드 — 내 손패든 전체공개든, 내가 볼 수 있는 것 전부.

            :(tool?`${cards.length}개 · 손패 상한 밖입니다`
                  :`${clueCount()}/${handLimit()}장 · 나만 봅니다`);
  let h=`<div class="mhead sheeth">
      <div class="sh-id"><span class="sh-nm" style="color:var(--me,var(--gold-b))">${ICO.card} ${bel?esc(label):(tool?"도구":"카드")}</span>
        <span class="sh-meta">${meta}</span></div>
      </div>`;
  if(bsplit||tsplit){
    h+=`<div class="htabs">
      <button class="htab${(bel||tool)?"":" on"}" onclick="showMyHand('clue')">카드 <b>${clueCards().length}</b></button>
      ${tsplit?`<button class="htab${tool?" on":""}" onclick="showMyHand('tool')">도구 <b>${toolCards().length}</b></button>`:""}
      ${bsplit?`<button class="htab${bel?" on":""}" onclick="showMyHand('belong')">${esc(label)} <b>${belongCards().length}</b></button>`:""}
    </div>`;
  }
  h+=`<div class="mbody">`;
  if(tool) h+=`<div class="toolnote">도구는 손패 상한과 상관없습니다 — 몇 개든 판이 끝날 때까지 들고 있습니다.</div>`;
  if(!cards.length){
    h+=`<div class="panel-note">${bel
      ?`아직 열린 ${esc(label)}이 없어요. 조사 페이즈에 ${esc(label)}을 열면 여기 모입니다.`
      :(tool?"아직 얻은 도구가 없어요. 수수께끼를 풀면 여기에 모입니다."
            :"아직 조사한 단서가 없어요. 조사 페이즈에 카드를 열면 여기에 계속 쌓입니다.")}</div>`;
  }
  else{ const slides=cards.map(c=>{
      const isPub=bel&&!(myHand||[]).some(x=>x.id===c.id);
      return `<div class="bigcard clue">
      <div class="bc-eyebrow">${isPub?"전체공개":"손패 · 비공개"}</div>
      <div class="bc-title" style="color:var(--me,var(--gold-b))">${esc(c.title)}</div>
      <div class="bc-tags"><span class="pill">${esc(c.locName)}</span>${c.spot?`<span class="pill">${esc(c.spot)}</span>`:''}<span class="pill">R${c.round}</span>${keyTagFor(c.id,true)}${comboBadge(c.id)}${pairsOf(c.id).map(k=>{const rd=pairReady(k,c.id);
        return `<button class="pill pair${rd?" rdy":""}" title="${rd?"짝이 지금 나와 있습니다":"같은 조각을 단 카드와 맞춰보세요"}" onclick="event.stopPropagation();showPairHint('${c.id}',${k.i})">${pairChip(k,c.id,rd)}${rd?"맞물림":"조각"}</button>`;}).join("")}</div>
      <div class="bc-body">${esc(c.text)}</div>${mynote(c.id)}${cnote(c)}
      ${c.unlocks&&!isPub?`<div class="unlocknote">${ICO.unlock} 이 카드를 <b>전체공개</b>하면 무언가 밝혀질 수 있습니다.</div>`:""}</div>`; });
    h+=buildSwipe(slides); }
  // 카드탭에서만 「대화에 올리기」·「바꾸기」가 선다. 도구는 내려놓는 물건이 아니다.
  const pubN=(STATE.revealed||[]).length, canAct=!bel&&!tool&&myRoleValid()&&clueCards().length;
  h+=`</div>${canAct?`<div class="mfoot">
    <button class="btn" onclick="showShare()">${ICO.chat} 대화에 올리기</button>
    ${pubN?`<button class="btn" onclick="showSwap()">${ICO.swap} 테이블 위 카드와 바꾸기</button>`:""}</div>`:""}`;
  $("handBox").innerHTML=h;
  $("handBox").style.setProperty("--mt","var(--me,var(--gold))");
  openModal("handModal"); wireSwipe($("handBox"));
}

async function post(url,body){ try{ return await (await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json(); }catch(e){ banner("서버 연결 오류"); return {error:"network"}; } }
/* 하단바 높이를 재서 창들이 그 위에서 멈추게 한다. 기기마다 안전영역이 달라 상수로 못 박는다. */
/* 오프닝에서 아직 자기 롤카드를 안 펼친 사람에게, 하단바의 「내 정보」만 밝혀 보여준다.
   여기서 길을 잃으면 그 뒤가 전부 막힌다 — 이 게임은 자기 이야기를 읽고 시작하는 게임이다. */
function paintCoach(){
  // 「아직 안 읽었다」는 null이 아니라 -1이다(loadSheetSeen이 그렇게 채운다).
  // 지금 막까지 읽은 적이 없으면 안내한다.
  const want=(STATE.phase||{}).key==="open" && myRoleValid()
             && sheetSeenSeq!=null && sheetSeenSeq < (STATE.seq||0)
             && !document.querySelector(".modal.on");
  const has=!!$("coach");
  if(want===has) return;
  if(!want){ const c=$("coach"); if(c) c.remove();
             const t=$("coachTip"); if(t) t.remove();
             const b=($("dock")||{}).children; if(b&&b[2]) b[2].classList.remove("callout");
             return; }
  const d=document.createElement("div"); d.className="coach"; d.id="coach";
  d.onclick=()=>showMySheet();
  document.body.appendChild(d);
  const b=($("dock")||{}).children; if(b&&b[2]) b[2].classList.add("callout");
  const tip=document.createElement("div"); tip.className="coach-tip"; tip.id="coachTip";
  tip.textContent="당신의 정보를 확인하세요";
  tip.onclick=()=>showMySheet();
  document.body.appendChild(tip);
  const r=(b&&b[2])?b[2].getBoundingClientRect():null;
  if(r){ tip.style.left=Math.min(innerWidth-90,Math.max(90,r.left+r.width/2))+"px";
         tip.style.top=(r.top-42)+"px"; }
}

/* 막 진행표. 지금 막은 금색으로 채우고, 지나온 막은 흐리게 둔다.
   길어지면 가로로 흐르되 현재 막이 늘 보이게 끌어온다. */
/* 이 막에서 내가 꺼내기로 한 말이 대화창에 올라갔다면 한 번만 띄워준다.
   예전에는 «내 정보»에 조용히 붙고 배너 한 줄이 전부였다 — 그냥 지나가는 사람이 많았다. */
let myLineSeen=-1;
function popMyLine(){
  if(!myRoleValid()) return;
  const seq=STATE.seq||0;
  if(myLineSeen>=seq) return;
  const mine=(STATE.table||[]).filter(m=>m.auto&&m.roleId===myRoleId&&m.seq===seq);
  if(!mine.length) return;
  myLineSeen=seq;
  const ph=(STATE.phase||{}).name||"";
  // 확인을 누르면 대화창으로 데려간다 — 「여기서부터 이어서 말하라」고 해놓고
  // 그 자리를 직접 찾아가게 하면 안 된다.
  say({title:`${ph} — 내가 꺼낸 말`, ok:"대화창으로",
       body:mine.map(m=>`「${m.text}」`).join("\n\n")+"\n\n대화창에 그대로 올라갔습니다. 여기서부터 이어서 말하세요."})
    .then(()=>{ if(scr==="play") showChatFull(); });
}
/* 발사창이 열렸다. 코드를 못 넣은 채 표를 받았으면 여기서 10초 안에 넣어야 한다. */
let podLaunchBox=null;
function paintPodLaunch(){
  const pl=STATE&&STATE.podLaunch;
  const mineBoard=pl&&myRoleValid()&&(pl.boarded||[]).includes(myRoleId);
  const need=mineBoard&&!pl.closed&&!podCodeOk();
  if(!need){ if(podLaunchBox){ cancelAnimationFrame(podLaunchBox._raf||0); podLaunchBox.remove(); podLaunchBox=null; } return; }
  if(!podLaunchBox){
    podLaunchBox=document.createElement("div");
    podLaunchBox.className="podrush";
    podLaunchBox.innerHTML=`<div class="pr-box">
      <div class="pr-k">발사창이 열렸습니다</div>
      <div class="pr-t">인증코드를 넣으세요</div>
      <div class="pr-c"><b id="podLeft">10.0</b><span>초</span></div>
      <div class="pr-n">넣지 못하면 문이 닫히고, 당신은 남습니다.</div>
      <button class="btn gold" onclick="askPodCode()">코드 넣기</button></div>`;
    document.body.appendChild(podLaunchBox);
    sfx("bad");
  }
  // 1.5초마다 오는 폴링만 보고 세면 숫자가 뚝뚝 끊긴다 — 서버가 준 값에서
  // 이어서 스스로 세고, 다음 폴링이 오면 그 값으로 다시 맞춘다.
  podLaunchBox._at=performance.now();
  podLaunchBox._left=pl.left||0;
  if(!podLaunchBox._tick){
    const tick=()=>{
      if(!podLaunchBox){ return; }
      const l=$("podLeft");
      if(l){ const d=(performance.now()-podLaunchBox._at)/1000;
             l.textContent=Math.max(0,podLaunchBox._left-d).toFixed(1); }
      podLaunchBox._raf=requestAnimationFrame(tick);
    };
    podLaunchBox._tick=true; tick();
  }
}
function paintTimeline(){
  const el=$("tline"), ph=(SCEN.phases||[]); if(!el||!ph.length) return;
  const cur=STATE.seq||0;
  const sig=cur+":"+ph.length;
  if(el.dataset.sig!==sig){
    el.dataset.sig=sig;
    // 눈금은 끊기지 않는다 — 같은 줄을 세 벌 이어 붙이고 가운데 벌을 기준으로 민다.
    // 그래서 첫 막에서도 왼쪽에 마지막 막들이 이어져 보인다.
    const one=c=>ph.map((p,i)=>{
      const k=p.seq<cur?"done":(p.seq===cur?"now":"todo");
      return `${i?'<span class="sep"></span>':""}`
        +`<span class="phz ${k}" data-c="${c}"><i></i>${esc(p.name)}</span>`;
    }).join("");
    el.innerHTML=`<div class="tl-rail">`
      +[0,1,2].map(one).join('<span class="sep"></span>')+`</div>`;
  }
  centerTimeline();
}
/* 차례 줄은 이제 한 벌을 그대로 편다 — 밀 것이 없다.
   호출부가 여러 곳이라 함수는 남겨 두고, 예전에 밀어 둔 자국만 지운다. */
function centerTurnRail(){
  document.querySelectorAll(".tb-rail").forEach(r=>{ r.style.transform=""; });
}
/* 지금 막을 한가운데로 — 레일을 통째로 민다. 손으로 굴릴 수 없게 스크롤은 아예 없앴다. */
function centerTimeline(){
  const el=$("tline"); if(!el) return;
  const rail=el.querySelector(".tl-rail");
  const now=el.querySelector('.phz.now[data-c="1"]')||el.querySelector(".phz.now");
  if(!rail||!now) return;
  const w=el.clientWidth; if(!w) { requestAnimationFrame(centerTimeline); return; }
  rail.style.transform=`translateX(${Math.round(w/2 - (now.offsetLeft + now.offsetWidth/2))}px)`;
}
addEventListener("resize",()=>{ if($("tline")) centerTimeline(); centerTurnRail(); });

function measureDock(){
  const d=$("dock"); if(!d) return;
  const t=$("tline");
  document.documentElement.style.setProperty("--dockh", d.offsetHeight + "px");
}
addEventListener("resize",measureDock);
/* 하단바에서 연 창은 그 칸을 켜 둔다 — 지금 어느 화면에 있는지가 보여야 한다. */
const DOCK_OF={chatModal:3, handModal:1, sheetModal:2, whoModal:4, lookModal:0, mapModal:0, __home:0};
function markDock(id, on){
  const b=($("dock")||{}).children; if(!b) return;
  const i=DOCK_OF[id];
  if(i!=null && b[i]) b[i].classList.toggle("here", !!on);
  // 열린 탭이 하나도 없으면 집(조사화면)에 있는 것이다.
  const open=document.querySelector(".modal.overdock.on");
  if(b[0]) b[0].classList.toggle("here", !open);
}
/* 탭은 한 번에 하나다. 겹쳐 열리면 뒤로 가기가 어디로 가는지 아무도 모른다. */
function closeTabs(except){
  document.querySelectorAll(".modal.overdock.on").forEach(m=>{
    if(m.id!==except){ m.classList.remove("on"); markDock(m.id,false); }
  });
}
/* 조사화면 = 집. 열린 탭을 전부 닫으면 그 아래 있던 화면이 그대로 드러난다. */
function dockHome(){ closeTabs(); markDock("__home",true); sfx("cursor"); }
/* ── 창틀 씌우기 ────────────────────────────────────────────────
   창은 두 갈래로 만들어진다 — HTML 에 미리 서 있는 것(#cardModal…)과, 그때그때 만들어
   body 에 붙이는 것(안내창·QA 기록·자리 안내·수수께끼·그림). 뒤엣것까지 템플릿을 하나하나
   고치면 자리가 여덟 군데로 흩어지고, 하나 빠뜨리면 그 창만 창틀 없이 뜬다.
   그래서 «body 에 붙는 순간» 한 번만 씌운다. 이미 창틀이 있으면 두 번 안 씌운다.
   ★ 제목줄은 «모달에만» 단다. 하단바에서 여는 탭(.overdock)에는 안 단다 —
     430px 폰에서 창마다 24px 을 물리면 그만큼 본문이 밀린다.
   ★ 닫기 상자는 새 길을 내지 않는다. 그 창이 이미 쓰고 있는 닫기 단추를 그대로 누른다. */
function dressWin(m){
  if(!m||m.nodeType!==1||!m.classList.contains("modal")) return;
  if(m.classList.contains("overdock")) return;
  if(m.querySelector(":scope>.win")) return;
  const box=m.querySelector(":scope>.box"); if(!box) return;
  const win=document.createElement("div"); win.className="win";
  const tb=document.createElement("div"); tb.className="titlebar";
  const x=document.createElement("button"); x.type="button"; x.className="tbox";
  x.setAttribute("aria-label","닫기");
  const wt=document.createElement("span"); wt.className="wt";
  const zm=document.createElement("span"); zm.className="tbox zoom"; zm.setAttribute("aria-hidden","true");
  tb.appendChild(x); tb.appendChild(wt); tb.appendChild(zm);
  m.insertBefore(win,box); win.appendChild(tb); win.appendChild(box);
  x.onclick=()=>{ const b=m.querySelector(".mh-x")||m.querySelector("[data-x]")||m.querySelector("[data-o]");
    if(b) b.click(); else m.remove(); };
  winTitle(m);
}
/* 제목줄에 적을 말. 창의 «눈썹라벨»(.mh-eb)이 곧 그 창이 무엇인지라, 그 줄을 제목줄로
   올리고 본문 쪽에서는 감춘다(.modal:not(.overdock) .mh-eb{display:none}).
   같은 말이 두 번 나오지 않게 하는 것이 요점이다 — 큰 제목(h2)은 창 안에 그대로 남는다. */
function winTitle(m){
  const wt=m.querySelector(":scope>.win>.titlebar>.wt"); if(!wt) return;
  const eb=m.querySelector(".mhead .mh-eb");
  const t=(eb&&eb.textContent.trim())||(m.querySelector(":scope>.win>.box")||{}).dataset?.wt||wt.dataset.def||"";
  wt.textContent=t;
}
/* 새로 붙는 창을 지켜본다. 템플릿마다 부르지 않아도 되게 자리를 하나로 모은다. */
new MutationObserver(rs=>{ rs.forEach(r=>r.addedNodes.forEach(dressWin)); })
  .observe(document.body,{childList:true});

function openModal(id){
  measureDock();
  if($(id).classList.contains("overdock")) closeTabs(id);
  $(id).classList.add("on"); markDock(id,true);
  winTitle($(id));
}
function closeModal(id){ $(id).classList.remove("on"); markDock(id,false); }
boot();
</script>
