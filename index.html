  .sharesec{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--cold);
    margin:14px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .sharesec.cold{color:var(--cold)}
  .shareSay{width:100%;margin-top:12px;padding:10px 12px;border-radius:2px;font-size:14px;
    font-family:inherit;line-height:1.6;resize:vertical;
    background:var(--bg2);border:1px solid var(--line);color:var(--ink)}
  .shareSay:focus{outline:none;border-color:var(--cold)}
  .pchips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .pchips .pc-note{font-size:11.5px;color:var(--muted)}
  .pill.pair{display:inline-flex;align-items:center;gap:3px;padding-left:4px}
  /* 짝이 눈앞에 있는 조각 — 채워서 「지금 맞춰볼 수 있다」를 알린다. */
  .pill.pair.rdy{border-color:var(--good);color:var(--good);animation:pfit 2.4s ease-in-out infinite}
  @keyframes pfit{0%,100%{box-shadow:0 0 0 0 rgba(63,200,185,0)}50%{box-shadow:0 0 0 3px rgba(63,200,185,.16)}}
  .pin.door{border-color:var(--case-line);color:var(--case-ink)}
  .pin.door i{background:var(--case-ink);box-shadow:1px 1px 0 rgba(0,0,0,.6)}
  .mbody::-webkit-scrollbar{width:5px}
  .mbody::-webkit-scrollbar-thumb{background:#4a4844;border-radius:2px}
  .mbody::-webkit-scrollbar-track{background:transparent}
  /* 바닥 — 액션은 늘 같은 자리에 앉는다. 본문이 길어도 버튼을 찾으러 내려가지 않게. */
  .mfoot{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;
    padding:12px 18px;border-top:1px solid var(--line);background:var(--bg2)}
  .mfoot .mf-note{margin-right:auto;font-size:12px;color:var(--muted);word-break:keep-all;min-width:0}
  /* 안내창 — 브라우저 기본 창 대신. 나머지 창과 같은 결로, 다만 더 좁고 조용하게.
     이건 늘 「무엇 위에서」 물어보는 창이다. 카드창(#cardModal 70)이든 비주얼노벨(90)이든
     그 위에서 눌러야 하니 다른 어떤 창보다 앞에 세운다. */
  .dlg{z-index:120}
  .dlg .win{max-width:400px}
  .dlg .box{max-width:none}
  .dlg .mhead{align-items:center;gap:11px;padding:17px 18px 14px}
  .dlg .dlg-ic{flex:0 0 34px;height:34px;border-radius:2px;display:grid;place-items:center;
    font-size:16px;background:var(--bg2);border:1px solid var(--line);color:var(--mt)}
  .dlg h2{font-size:17px;line-height:1.35}
  .dlg .mbody{padding:2px 18px 16px;font-size:13.5px;line-height:1.8;color:var(--sub);white-space:pre-line}
  .dlg .mbody b{color:var(--ink)}
  .dlg .mbody .dlg-warn{margin-top:7px;color:var(--ember-b)}
  .dlg .mfoot{justify-content:stretch}
  .dlg .mfoot .btn{flex:1;justify-content:center;padding:11px 14px;font-size:14px}
  .dlg input.dlg-in{width:100%;margin-top:11px;padding:9px 11px;border-radius:2px;font-size:16px;
    background:var(--bg2);border:1px solid var(--line);color:var(--ink)}
  .dlg input.dlg-in:focus{outline:none;border-color:var(--mt)}
  @media(max-width:430px){
    .mhead{padding:13px 14px 11px}.mbody{padding:14px}.mfoot{padding:11px 14px}
    .mhead h2{font-size:17px}
    .mfoot .mf-note{flex-basis:100%;margin:0 0 2px}
  }
  .sec{border-top:1px dashed var(--line);padding-top:11px;margin-top:11px}.sec:first-of-type{border-top:0;margin-top:0;padding-top:0}
  .sec .h{font-weight:700;color:var(--ink);font-size:13.5px;margin-bottom:4px}.sec .b{font-size:14px;color:#dddcdb;line-height:1.72}
  .frag{background:#171613;border:1px solid #4b453d;border-radius:2px;padding:9px 12px;margin:8px 0;color:#ddd6cc;font-size:13.5px}.frag .w{font-size:11px;color:var(--cold);margin-bottom:3px}
  .goal{display:flex;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}.goal:last-child{border-bottom:0}.goal .pt{margin-left:auto;color:var(--good);font-weight:700;font-family:var(--pix)}
  /* ── 스와이프 카드 캐러셀 (롤카드·손패 넘겨보기) ── */
  .swipe{position:relative;margin:6px 0 2px}
  /* 세로로 구르는 곳은 바깥(.mbody) 하나뿐이다. 트랙은 굴리지 않고 밀린다 —
     가로 스크롤 위치로 「몇 번째 장인가」를 되짚으면 화면 높이가 바뀔 때마다 어긋났다.
     지금은 변수 하나가 쥐고, 손가락은 그 위를 끌 뿐이다. */
  .sw-vp{overflow:hidden;transition:height .24s cubic-bezier(.22,.9,.24,1)}
  .sw-track{display:flex;align-items:flex-start;touch-action:pan-y;will-change:transform;
    transition:transform .3s cubic-bezier(.22,.9,.24,1)}
  .swipe.dragging .sw-track{transition:none}
  .swipe.dragging .sw-vp{transition:none}
  .sw-slide{flex:0 0 100%;min-width:0;opacity:.42;transition:opacity .3s ease}
  .sw-slide.on{opacity:1}
  .swipe.dragging .sw-slide{opacity:1}
  @media (prefers-reduced-motion:reduce){
    .sw-vp,.sw-track,.sw-slide{transition:none}
  }
  /* 화살표는 창 한가운데에 고정한다 — 글 길이나 스크롤 위치에 흔들리지 않는다. */
  /* 읽는 화면 위에 늘 떠 있는 물건이다. 평소엔 물러나 있고 손이 갈 때만 또렷해진다.
     --p 는 커서가 얼마나 가까운가(0~1). 마우스가 있는 기기에서만 JS가 채운다. */
  .sw-nav{position:fixed;top:calc(50% - var(--dockh,64px)/2);transform:translateY(-50%);z-index:6;
    width:30px;height:56px;padding:0;
    background:rgba(10,9,8,.5);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(4px);
    color:var(--ink);font-size:22px;line-height:1;display:grid;place-items:center;cursor:pointer;
    transition:opacity .18s,border-color .15s,background .15s}
  /* 기본은 손가락 기기 — 평소엔 아예 안 보이고, 끄는 동안에만 살짝 비친다.
     hover 미디어는 터치 겸용 노트북과 에뮬레이터에서 제멋대로라 믿지 않는다.
     커서가 실제로 움직인 걸 본 뒤에야 html.cursor 가 붙는다. */
  .sw-nav{opacity:0;pointer-events:none}
  .swipe.dragging .sw-nav{opacity:.3}
  /* 커서가 있는 기기 — 가까워질수록 진해진다. */
  html.cursor .sw-nav{opacity:calc(.1 + .72 * var(--p,0));pointer-events:auto}
  html.cursor .swipe.dragging .sw-nav{opacity:.16}
  .sw-nav.prev{left:0;border-left:0;border-radius:0 2px 2px 0}
  .sw-nav.next{right:0;border-right:0;border-radius:2px 0 0 2px}
  .sw-nav:hover:not(:disabled),.sw-nav:active:not(:disabled){opacity:1 !important;border-color:var(--case-line);color:#fff;background:rgba(10,9,8,.9)}
  .sw-nav:disabled{opacity:0;pointer-events:none}
  /* 카드가 화면보다 길면 아래 끝은 아무도 못 본다 — 네비는 바닥에 붙어 따라온다. */
  .sw-top{position:absolute;top:17px;left:0;right:0;z-index:2;display:flex;justify-content:center;pointer-events:none}
  .sw-top .sw-dots{pointer-events:auto}
  .sw-dots{display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap}
  .sw-dot{width:6px;height:6px;border-radius:0;background:#3a3734;transition:.22s;cursor:pointer}
  .sw-dot.on{background:var(--case-ink);box-shadow:1px 1px 0 rgba(0,0,0,.6)}
  /* 큰 카드(롤/손패) */
  .bigcard{border-radius:2px;padding:18px 18px 20px;background:linear-gradient(165deg,#1d1c1b,#141312);border:1px solid var(--line);min-height:220px}
  /* ★ 강조 — 롤카드에서 「이건 특히 중요하다」를 뜻하고, ★ 수가 곧 세기다.
     색은 그 배역의 키컬러(--rc)다. 롤카드는 그 사람의 물건이라 강조도 그 사람 색이어야
     「내 것」으로 먼저 읽힌다. 세기는 색을 더 진하게 하는 게 아니라 판을 한 단계씩 세운다:
       ★   글자만        ★★  옅은 판       ★★★ 통째로 반전
     1비트 GUI 에서 최고 강조는 «반전» 이다 — 더 밝은 색이 아니라 흑백이 뒤집히는 것.
     ★ 글리프는 Neo둥근모에 없어서 다른 글꼴로 떨어져 나왔다. 픽셀 네모로 직접 그린다. */
  .sx{--k:var(--rc,var(--me,var(--gold-b)))}
  .sx .sxm{display:inline-flex;gap:2px;align-items:center;vertical-align:1px;margin-right:7px}
  .sx .sxp{width:6px;height:6px;background:var(--k);display:block}
  /* s0 — 세기만 세고 판은 안 세운다. ★ 글리프가 Neo둥근모에 없어서 픽셀로 다시 그린
     것이므로, 강조를 안 하는 자리에서도 이 모양은 그대로 쓴다. */
  .sx.s0{color:inherit}
  .sx.s0 .sxp{background:color-mix(in srgb,var(--k) 72%,transparent)}
  .sx.s1{color:var(--k)}
  .sx.s2{color:var(--k);background:color-mix(in srgb,var(--k) 15%,transparent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 15%,transparent)}
  .sx.s3{background:var(--k);color:#0b0b09;box-shadow:0 0 0 3px var(--k);font-weight:700}
  .sx.s3 .sxp{background:#0b0b09}
  @media(forced-colors:active){ .sx.s3{background:Highlight;color:HighlightText} }

  .bigcard.role{border-color:color-mix(in srgb,var(--rc,#2f6b57) 45%,var(--line));background:linear-gradient(165deg,#201f1e,#151413)}
  .bigcard.role::before{content:"";display:block;height:3px;width:46px;border-radius:0;background:var(--rc,var(--cold));margin-bottom:14px}
  .bigcard.clue{border-color:var(--case-line);background:linear-gradient(165deg,#232019,#151413)}
  .bc-eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .bc-title{font-weight:800;font-size:20px;line-height:1.28;color:#f2ecdf}
  .bc-title.role{color:var(--rc,#f2ecdf)}
  .bc-sub{font-size:13px;color:var(--sub);margin-top:4px}
  .bc-body{font-family:var(--body);font-size:15.5px;line-height:1.8;color:#e1e0df;margin-top:14px;white-space:pre-wrap}
  /* 알고 있는 조사카드 — 내 물건에서 나올 것. 아직 테이블 위에는 없다는 걸 결로 구분한다. */
  .bigcard.k-owncard{border-style:dashed}
  /* 줄글 — 390px에서 글자 벽이 되지 않게 문단 사이를 넉넉히 벌리고, 첫 문단만 키워
     «어디까지 읽었나»가 잡히게 한다. */
  /* 표지 — 얼굴을 크게 세우고, 그 밑 세 줄로 «나는 누구인가»를 한 번에 박는다. */
  /* 내 정보 탭 — 슬라이드가 열 장을 넘기면 옆으로 넘기는 것만으로는 못 찾는다. */
  /* 탭 머리띠 — 하단바에서 여는 화면은 전부 이 틀을 쓴다.
     이름은 명조로 한 줄, 그 옆에 작은 설명 한 줄. 탭마다 글꼴이 달라 보이던 걸 여기로 모았다. */
  .sheeth{padding:11px 14px 10px;gap:0}
  .sheeth .sh-id{flex-basis:100%;display:flex;align-items:center;gap:8px;min-width:0}
  .sheeth .sh-nm{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
    font-family:var(--pix);font-size:19px;font-weight:800;
    letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheeth .sh-nm .ic{width:1em;height:1em;opacity:.85}
  .sheeth .sh-meta{flex:1 1 auto;min-width:0;font-size:12px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shtabs{flex-basis:100%;display:flex;gap:6px;margin-top:10px}
  .shtab{flex:1;font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 6px;border-radius:2px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
    background:var(--panel2);border:1px solid var(--line);color:var(--sub);cursor:pointer;transition:.15s;
    display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .shtab:hover{color:var(--ink)}
  /* 고른 탭 — 바탕은 나머지와 같은 모노톤이고, 테두리만 그 배역 색으로 빛난다.
     채우면 색마다 글자가 묻힌다. */
  .shtab.on{color:#fff;
    background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.02));
    border-color:var(--mt,var(--case-line));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
  .shtab .n{font-size:10.5px;opacity:.7;font-variant-numeric:tabular-nums}
  .shtab.on .n{opacity:.85}
  /* 아직 안 열어본 탭 — 붉은 점 하나. 글자색을 바꾸면 알림이 아니라 디자인으로 읽힌다. */
  .shtab{position:relative}
  .shtab.unseen::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;
    border-radius:0;background:var(--ember);box-shadow:0 0 0 2px var(--panel2),0 0 8px -1px var(--ember);
    animation:tabPulse 1.9s ease-in-out infinite}
  .shtab.on.unseen::after{display:none}
  @keyframes tabPulse{0%,100%{opacity:1}50%{opacity:.4}}
  /* 표지 — 초상 왼쪽, 이름·나이·성별·직책과 말투 지침이 오른쪽. */
  .cov-top{display:grid;grid-template-columns:minmax(96px,34%) 1fr;gap:14px;align-items:start;margin:14px 0 4px}
  .cov-info{min-width:0;padding-top:2px}
  .cov-per{margin-top:12px;font-size:12.5px;line-height:1.7;color:var(--sub);word-break:keep-all}
  .cov-per .k{display:block;font-size:10.5px;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
  .tiplist{margin-top:15px;display:flex;flex-direction:column;gap:2px}
  .tipitem{position:relative;padding:11px 0 11px 20px;border-top:1px solid var(--line);
    font-size:13.5px;line-height:1.75;color:#d8d6d4;word-break:keep-all}
  .tipitem:first-child{border-top:0}
  .tipitem::before{content:"›";position:absolute;left:2px;top:11px;color:var(--cold);font-weight:700}
  .cov-por{width:100%;aspect-ratio:3/4;border-radius:2px;overflow:hidden;
    background:linear-gradient(158deg,color-mix(in srgb,var(--rc,#555) 28%,#171615),#0f0e0d)}
  .cov-nm{font-size:26px;font-weight:800;line-height:1.15;word-break:keep-all}
  .cov-sub{font-size:13px;color:var(--muted);margin-top:4px}
  .cov-hook{margin-top:16px;padding:14px 15px;border-left:3px solid var(--rc,var(--cold));
    background:linear-gradient(90deg,color-mix(in srgb,var(--rc,#555) 12%,transparent),transparent);
    white-space:pre-line;font-size:16.5px;line-height:1.75;font-weight:700;color:#fff;word-break:keep-all}
  #sheetModal .cov-hook{font-size:18px;line-height:1.8}
  .story{margin-top:16px;display:flex;flex-direction:column;gap:15px}
  .story p{font-family:var(--body);margin:0;font-size:15.5px;line-height:1.95;color:#e1e0df;word-break:keep-all}
  .story p.lede{font-size:17px;line-height:1.8;color:#fff;font-weight:700}
  #sheetModal .story p{font-size:16.5px;line-height:2.0;max-width:34em}
  #sheetModal .story p.lede{font-size:18.5px}
  /* 밤 판 아래에 붙는 안내 — 다 읽었는지가 여기서 세어진다 */
  .vgate{margin-top:14px;padding:13px 15px;border:1px solid var(--case-line);
    border-radius:2px;background:var(--case-off)}
  .vgate.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line));
    background:linear-gradient(180deg,rgba(55,160,150,.12),transparent)}
  .vgate .vg-h{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;color:var(--ink)}
  .vgate.done .vg-h{color:var(--good)}
  .vgate .vg-h svg{width:16px;height:16px}
  .vgate .vg-t{margin-top:6px;font-size:13px;line-height:1.75;color:var(--sub);word-break:keep-all}
  .vgate .vg-c{margin-top:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .vgate .btn{margin-top:11px;width:100%;justify-content:center}
  /* ── 금고에서 나온 서류 ─────────────────────────────────────
     조사카드가 아니라 다 함께 들여다보는 종이다. 카드 결이 아니라 «문서» 결로 세운다. */
  .bigcard.k-vault{border-color:var(--case-line)}
  .vl-lede{margin-top:13px;font-size:13.5px;line-height:1.85;color:var(--sub);white-space:pre-line;word-break:keep-all}
  .vdoc{margin-top:16px;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--bg2)}
  .vd-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(235,230,220,.07),transparent)}
  .vd-no{flex:0 0 28px;height:28px;display:grid;place-items:center;border-radius:2px;
    border:1px solid var(--case-line);color:var(--case-ink);
    font-family:var(--pix);font-size:15px}
  .vd-w{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
  .vd-w b{font-size:15px;font-weight:800;color:var(--ink);word-break:keep-all}
  .vd-w i{font-style:normal;font-size:11.5px;color:var(--muted);word-break:keep-all}
  .vd-n{flex:0 0 auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  /* 그림이 실제로 있을 때만 자리를 차지한다 — 없으면 JS가 이 칸을 지운다 */
  .vd-art{display:none;aspect-ratio:16/10;background-size:cover;background-position:center;
    border-bottom:1px solid var(--line)}
  .vd-art.on{display:block}
  .vd-q{margin:14px 14px 0;padding:12px 14px;border-left:2px solid var(--cold);
    background:rgba(195,186,176,.06);border-radius:0 2px 2px 0;
    font-family:var(--pix);font-size:16px;line-height:1.9;
    color:#e6dfd6;white-space:pre-line;word-break:keep-all}
  .vd-notes{margin:12px 14px 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  .vd-notes li{position:relative;padding-left:15px;font-size:14px;line-height:1.8;
    color:#dcdbda;word-break:keep-all}
  .vd-notes li::before{content:"";position:absolute;left:1px;top:.72em;width:5px;height:5px;
    border-radius:0;background:var(--cold);opacity:.7}
  .vd-more{margin-top:14px;text-align:right;font-size:12px;color:var(--muted)}
  .vd-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .vd-why{font-size:12.5px;line-height:1.7;color:var(--sub);word-break:keep-all}
  .vd-act{margin-top:11px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .vd-act .btn{flex:1 1 auto;justify-content:center}
  .vd-act.done{color:var(--good);font-size:13.5px;font-weight:700}
  .vd-act.done svg{width:16px;height:16px;vertical-align:-3px}
  .vd-cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  /* ── 그날 밤 한 장 ─────────────────────────────────────────
     내가 한 일이 위, 남들에게서 눈에 걸린 것이 아래. 둘은 성격이 다르다 —
     위는 «내가 아는 것»이고 아래는 «본 것»뿐이라 결을 갈라놓는다. */
  .bigcard.k-night{border-color:color-mix(in srgb,var(--cold) 40%,var(--line))}
  .ntb{margin-top:16px}
  .ntb-h{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin-bottom:7px}
  .ntb.post .ntb-h{color:var(--rc,var(--cold))}
  .ntx{padding:13px 15px;border-radius:2px;background:var(--bg2);
    border-left:2px solid var(--line);
    font-size:15.5px;line-height:1.85;color:#e1e0df;white-space:pre-wrap;word-break:keep-all}
  .ntb.post .ntx{border-left-color:var(--rc,var(--cold))}
  .eyes{margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}
  .eyes-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;
    letter-spacing:.06em;color:var(--cold);margin-bottom:11px}
  .eyes-h svg{width:15px;height:15px}
  .eye{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .eye:last-of-type{border-bottom:0;padding-bottom:2px}
  .eye-a{flex:0 0 auto}
  .eye-w{flex:1 1 auto;min-width:0}
  .eye-n{font-size:13px;font-weight:800;color:var(--ec);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .eye-n i{font-style:normal;font-size:10.5px;font-weight:400;color:var(--muted)}
  .eye-t{margin-top:4px;font-size:14.5px;line-height:1.75;color:#dcdbda;word-break:keep-all}
  /* ── 소지품 한 장 ─────────────────────────────────────────
     내 것은 판이 열릴 때부터 여기 있다. 남의 것은 압수돼야만 이 자리에 붙는다 —
     그래서 압수된 장은 테를 붉게 세운다. 「이건 이제 내 것이 아니라 증거다」. */
  .bigcard.k-belong{border-color:color-mix(in srgb,var(--rc,var(--case-line)) 30%,var(--line))}
  .bigcard.k-belong.seized{border-color:color-mix(in srgb,var(--bad) 46%,var(--line))}
  .bg-spot{margin-top:3px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .bg-seized{margin-top:12px;display:flex;align-items:center;gap:7px;padding:9px 12px;
    border-radius:2px;font-size:13px;line-height:1.6;color:var(--bad);
    background:color-mix(in srgb,var(--bad) 11%,transparent);
    border:1px solid color-mix(in srgb,var(--bad) 34%,transparent)}
  .bg-seized svg{width:15px;height:15px;flex:0 0 auto}
  .bg-who{margin-top:12px;display:flex;align-items:center;gap:10px}
  .bg-w{flex:1 1 auto;min-width:0;font-size:13px;font-weight:800;color:var(--rc,var(--cold))}
  .bg-w i{font-style:normal;font-size:10.5px;font-weight:400;color:var(--muted);margin-left:6px}
  .bg-s{flex:0 0 auto;font-size:11.5px;color:var(--muted)}
  .bg-tx{margin-top:13px}
  .bigcard.k-belong .bg-tx{border-left-color:var(--rc,var(--cold))}
  .bg-note{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    font-size:12.5px;line-height:1.8;color:var(--muted);white-space:pre-wrap;word-break:keep-all}
  /* 아직 아무것도 안 쌓인 자리. 채워질 자리라는 게 보이되 읽을 것이 있는 척은 안 한다. */
  .bigcard.k-empty{border-style:dashed;background:none}
  .bigcard.k-empty .bc-title{color:var(--muted)}
  .bigcard.k-empty .bc-body{color:var(--sub)}
  /* 들키면 위험한 사실 — 판 중에 제일 급하게 다시 꺼내 보는 목록이다. 한눈에 세지게. */
  .bigcard.k-hide{border-color:color-mix(in srgb,var(--ember) 45%,var(--line))}
  .hidelist{margin-top:15px;display:flex;flex-direction:column;gap:2px;counter-reset:hd}
  .hideitem{position:relative;padding:11px 0 11px 30px;border-top:1px solid var(--line);
    font-size:14.5px;line-height:1.75;color:#ddd9d7;word-break:keep-all}
  .hideitem:first-child{border-top:0}
  .hideitem::before{counter-increment:hd;content:counter(hd);position:absolute;left:0;top:12px;
    width:20px;height:20px;border-radius:0;border:1px solid var(--ember-b);color:var(--ember-b);
    font-size:11px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
  .knownote{margin-top:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:2px;
    font-size:12.5px;line-height:1.7;color:var(--sub)}
  .knownote b{color:var(--ink)}
  /* 해석 노트 — 카드가 무슨 뜻인지 한 줄로 짚어준다(결론은 말하지 않는다) */
  .cnote{margin-top:12px;padding:9px 11px;border-left:2px solid var(--case-line);background:rgba(235,230,220,.05);
    border-radius:0 2px 2px 0;color:#cfc9c0;font-size:13px;line-height:1.7}
  .cnote b{color:var(--cold);font-weight:700;font-size:11.5px;letter-spacing:.06em;display:block;margin-bottom:2px}
  /* 같은 카드를 봐도 사람마다 다른 것이 보인다. 이 칸은 그 배역의 화면에만 있다. */
  .mynote{margin-top:10px;padding:10px 12px;border-radius:2px;font-size:13.5px;line-height:1.75;
    border:1px solid rgba(195,186,176,.28);background:linear-gradient(180deg,rgba(195,186,176,.13),rgba(195,186,176,.05))}
  .mynote .lb{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.07em;font-weight:800;
    color:#cbc2b6;margin-bottom:5px}
  .mynote .lb::after{content:"나에게만 보입니다";margin-left:auto;font-weight:600;letter-spacing:0;
    font-size:10.5px;color:#9a938a;opacity:.9}
  .mynote .tx{color:#e2dbd2}
  /* 한 이름표 아래 여러 줄 — 줄과 줄 사이만 벌린다. 줄마다 칸을 다시 그리지 않는다. */
  .mynote .tx+.tx{margin-top:6px;padding-top:6px;border-top:1px solid rgba(195,186,176,.16)}
  .mynote.keep{border-color:rgba(195,186,176,.34);background:linear-gradient(180deg,rgba(195,186,176,.10),rgba(195,186,176,.04))}
  .mynote.keep .lb{color:var(--cold)} .mynote.keep .lb::after{color:#9a938a} .mynote.keep .tx{color:#e2dbd2}
  .bc-avwrap{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .bc-av{font-size:34px;width:60px;height:60px;display:grid;place-items:center;background:var(--bg);border-radius:2px;flex:0 0 60px;border:1px solid var(--line);overflow:hidden}
  .bc-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .bc-hidden{margin-top:14px;background:#2a1412;border:1px solid #6a2a26;border-radius:2px;padding:10px 13px;color:#f0b8b0;font-size:13.5px;font-weight:600}
  /* 옛일 연표 — 배역이 아는 만큼만 적힌 줄들. 산문 한 덩어리로 읽으면 눈이 미끄러지는데
     날짜를 왼쪽에 세워두면 훑어보고 필요한 줄에서만 멈출 수 있다. */
  .tl{position:relative;margin-top:16px;padding-left:15px}
  .tl::before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:1px;
    background:linear-gradient(180deg,transparent,var(--rc,var(--cold)) 12%,var(--rc,var(--cold)) 88%,transparent);opacity:.45}
  .tl-r{position:relative;padding:0 0 15px 0}
  .tl-r:last-child{padding-bottom:0}
  .tl-r::before{content:"";position:absolute;left:-15px;top:7px;width:7px;height:7px;border-radius:0;
    background:var(--bg2);border:1.5px solid var(--rc,var(--cold))}
  .tl-r.last::before{background:var(--rc,var(--cold));box-shadow:1px 1px 0 rgba(0,0,0,.6)}
  .tl-w{font-size:12px;letter-spacing:.06em;color:var(--rc,var(--cold));font-weight:700;
    margin-bottom:3px;word-break:keep-all}
  .tl-t{font-size:15px;line-height:1.75;color:#dddcdb;word-break:keep-all;text-wrap:pretty}
  #sheetModal .tl-w{font-size:13px}
  #sheetModal .tl-t{font-size:16.5px;line-height:1.8;max-width:52ch}

  .bc-goal{display:flex;gap:10px;font-size:15px;padding:9px 0;border-bottom:1px solid var(--line)}.bc-goal:last-child{border-bottom:0}.bc-goal .pt{margin-left:auto;color:var(--good);font-weight:700;font-family:var(--pix)}
  /* 내 정보(배역 시트)는 한 번에 읽을 분량이 많다 — 팝업을 넓히고 본문을 키운다.
     본문 줄길이는 measure로 잡아, 넓어져도 한 줄이 지나치게 길어지지 않게 한다. */
  #sheetModal .win{max-width:760px;max-height:92vh;max-height:94svh}
  #sheetModal .mbody{padding:14px 14px 0}
  #sheetModal h2{font-size:22px}
  #sheetModal .mlead{font-size:13.5px;margin-bottom:16px}
  /* 카드 하나가 화면보다 길어질 수 있다. 모달 전체를 굴리면 좌우 넘김 컨트롤이 위로 사라지므로
     카드 안에서만 굴린다.
     예전에는 카드에 직접 mask 를 걸었는데 마스크는 스크롤을 따라오지 않는다 — 끝까지
     내려도 마지막 줄이 흐린 채 남아 '잘렸다'로 읽혔고, 아이폰에서는 마스크가 스크롤
     레이어를 먹어 손가락이 안 먹히기도 한다. 그래서 흐림은 카드 밖(슬라이드)에 얹고,
     더 굴릴 게 없으면 JS 가 꺼버린다. 높이는 주소창이 오르내려도 안 잘리게 svh 로 잡는다. */
  #sheetModal .bigcard{min-height:300px;padding:22px 20px 26px}
  /* 화살표가 글을 가리지 않게 카드 양옆을 비워 둔다. */

  #sheetModal .bc-eyebrow{font-size:11.5px;margin-bottom:11px}
  #sheetModal .bc-title{font-size:24px;line-height:1.3}
  #sheetModal .bc-sub{font-size:14.5px;margin-top:5px}
  #sheetModal .bc-body{font-size:17px;line-height:1.92;margin-top:17px;max-width:60ch}
  #sheetModal .bc-av{font-size:38px;width:66px;height:66px;flex:0 0 66px;border-radius:2px}
  #sheetModal .bc-hidden{font-size:14.5px;padding:12px 15px;margin-top:16px}
  #sheetModal .bc-goal{font-size:16.5px;padding:12px 0;line-height:1.6}
  #sheetModal .frag{font-size:14.5px;line-height:1.75;padding:11px 14px}
  /* ── 조사 턴 (차례 표시·키컬러) ── */
  /* 남의 차례 대기 — 점 하나라도 움직여야 «멈춘 화면»으로 안 읽힌다. */
  .tb-tick{display:inline-flex;align-items:center;gap:6px;margin-left:8px;font-size:11.5px;
    color:var(--muted);font-variant-numeric:tabular-nums}
  .tb-tick i{width:6px;height:6px;border-radius:0;background:var(--cold);animation:tbpulse 1s ease-in-out infinite}
  @keyframes tbpulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  @media (prefers-reduced-motion:reduce){.tb-tick i{animation:none;opacity:.8}}
  .tb-wait .btn.sm{margin-left:8px}
  .turnbar{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:9px 11px;margin-bottom:10px}
  /* 차례 줄 — 세 사람뿐이라 한 줄에 다 든다.
     예전엔 순번을 세 벌 이어 붙이고 지금 차례를 한가운데로 밀었다(여섯 명 판에서
     끝사람이 잘리지 않게 한 장치다). 셋이면 그게 오히려 «같은 이름이 양옆에 또»로
     보인다. 한 벌만 왼쪽에서 오른쪽으로 편다 — 지금이 가운데, 다음이 그 오른쪽이다. */
  .tb-order{position:relative;margin:0;padding:1px 0}
  .tb-rail{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
    transform:none!important;transition:none}
  .tb-chip{display:flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px 4px 8px;border-radius:2px;
    white-space:nowrap;flex:0 0 auto;
    border:1px solid var(--line);background:var(--bg);color:var(--sub);opacity:.55;transition:.2s}
  .tb-chip .tg{font-family:var(--pix);font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--cold);margin-left:1px}
  .tb-chip .d{width:8px;height:8px;border-radius:0;background:var(--tc,#888);flex:0 0 auto;
    box-shadow:1px 1px 0 rgba(0,0,0,.65)}
  /* 지금 차례 — 채우지 않고 테두리·발광으로만 짚는다. 글자는 흰색을 지킨다. */
  /* ★ 초록 ② — 「지금 차례」는 위치 표시다. 틀만 초록으로 켜고, 칩 안의 점(.d)은
     그 사람의 배역색 그대로 둔다. 그래서 «지금»과 «누구»가 한 칩 안에서 갈린다. */
  .tb-chip.on{opacity:1;color:#fff;border-color:var(--gold);
    background:linear-gradient(180deg,rgba(0,230,147,.14),#141312);
    box-shadow:0 0 10px -4px var(--gold),2px 2px 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
  .tb-chip.done{opacity:.4;text-decoration:line-through}
  /* 다음 차례 — 지금 다음에 누가 오는지가 판의 속도를 정한다. 켜지 않고 테만 세운다. */
  .tb-chip.next{opacity:.85;border-color:var(--case-line);color:var(--ink)}
  .tb-chip.next .tg{color:var(--muted)}
  .turnbar .tb-act{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}
  .turnbar .tb-act .btn{flex:1;min-width:120px;text-align:center}
  .tb-wait{margin-top:8px;font-size:12px;color:var(--muted);text-align:center}

  /* ============ GM 마킹 보드 ============ */
  #s-gm{display:none;flex-direction:column;height:100dvh}#s-gm.on{display:flex}
  .gm-main{flex:1 1 auto;display:flex;min-height:0}
  .gm-matrix{flex:1.3 1 0;overflow-y:auto;padding:14px 16px 30px;min-width:0}
  .gm-side{flex:1 1 0;max-width:440px;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--bg2)}
  .gm-side-h{padding:10px 14px;font-weight:700;font-size:13px;color:var(--ink);border-bottom:1px solid var(--line);flex:0 0 auto}
  .gm-side #gmChat{flex:1 1 auto;overflow-y:auto;min-height:0}
  .gm-side .composer{flex:0 0 auto;border-top:1px solid var(--line)}
  @media(max-width:820px){ .gm-main{flex-direction:column;overflow-y:auto} .gm-matrix{flex:none;overflow:visible} .gm-side{flex:none;max-width:none;border-left:0;border-top:1px solid var(--line);height:60vh} }
  .gm-guide{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:12px 15px;margin-bottom:14px}
  .gm-guide .g{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--case-ink);border:1px solid var(--case-line);border-radius:2px;padding:1px 7px;margin-right:8px}
  .gm-guide .il{margin-top:8px;color:#ddd6cc;font-style:italic;font-size:13px}
  .gm-note{color:var(--muted);font-size:12px;margin:2px 0 14px}
  /* 진행석으로 모인 종막 답안 — 낭독하며 훑는 자리라 왼쪽에 배역색을 세워 구분한다 */
  .gm-ans{margin-top:22px;text-align:left;display:flex;flex-direction:column;gap:12px}
  .gm-a{border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:2px;
    padding:13px 15px;background:var(--panel)}
  .gm-a .ah{font-weight:800;font-size:14.5px;color:var(--ac);margin-bottom:8px}
  .gm-a .aq{font-size:12px;color:var(--cold);margin-top:9px}
  .gm-a .ab{font-size:13.5px;line-height:1.75;color:#dddcdb;white-space:pre-wrap;word-break:keep-all}
  .gm-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
  .gm-pick .pl{font-size:11.5px;color:var(--muted);letter-spacing:.06em;margin-right:2px}
  .gm-pick .pk{display:inline-flex;align-items:center;gap:6px;background:var(--panel);
    border:1px solid var(--line);border-radius:2px;padding:5px 11px;font-size:12.5px;cursor:pointer}
  .gm-pick .pk.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 20%,var(--panel));color:#fff}
  .gm-pick .pk.full{opacity:.5}
  .gm-pick .pk .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .gm-zone{margin:12px 0}
  .gm-zone .zh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);
    padding:0 2px 6px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .gm-zone .zn{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .gcells{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:7px}
  .gcell{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:2px;
    padding:9px 8px;min-height:62px;cursor:pointer;transition:.13s;display:flex;flex-direction:column;gap:3px}
  .gcell:hover{border-color:var(--case-line)}
  .gcell.nopick{cursor:default;opacity:.75}
  .gcell .cid{font-size:12px;color:var(--sub);line-height:1.35}
  .gcell .cspot{font-size:11.5px;color:var(--sub);line-height:1.35}
  .gcell .cwho{font-size:12px;font-weight:700;color:var(--cc)}
  .gcell.took{background:linear-gradient(150deg,#332f2a,#232019);border-color:var(--cc)}
  .gcell.pub{background:linear-gradient(150deg,#26231d,#1a1815);border-color:var(--cold)}
  .gcell.pub .cwho{color:var(--cold)}
  .gcell .pubtag{margin-left:5px;font-size:9px;color:var(--cold);border:1px solid var(--cold);
    border-radius:2px;padding:0 3px;font-family:inherit;letter-spacing:.02em}
  .gcell .rq{position:absolute;top:5px;right:6px;font-size:9.5px;color:var(--warn);opacity:.8}
  @keyframes gmMarkPop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:none}}
  .gcell.justmark{animation:gmMarkPop .35s ease}
  .gm-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-bottom:10px}
  .gm-legend b{display:inline-block;width:13px;height:13px;border-radius:2px;vertical-align:-2px;margin-right:4px}
  .cell{width:44px;height:34px;border-radius:2px;border:1px solid var(--line);background:var(--panel2);color:var(--sub);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;position:relative}
  .cell:hover:not(.locked){border-color:var(--case-line);color:#fff}
  .cell.on{background:linear-gradient(150deg,#1f1e1d,#282726);border-color:var(--cc,var(--case-line));color:#fff;box-shadow:2px 2px 0 rgba(0,0,0,.55)}
  .cell.on::after{content:"";position:absolute;top:-5px;right:-4px;background:var(--cc,var(--case-ink)) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23121110' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.4 9.6 17 19 6.6'/></svg>") center/9px 9px no-repeat;border-radius:0;width:14px;height:14px;line-height:14px;text-align:center;font-weight:800}
  @keyframes markPop{0%{transform:scale(1)}28%{transform:scale(1.28);box-shadow:0 0 20px 3px var(--cc,var(--case-ink))}60%{transform:scale(.96)}100%{transform:scale(1)}}
  .cell.justmark{animation:markPop .75s cubic-bezier(.2,.8,.2,1)}
  .cell.dim{opacity:.4}
  /* GM 시네마틱 낭독 패널 */
  .gm-cine{max-width:760px;margin:0 auto;padding:34px 22px 30px;text-align:center}
  .gm-cine .ck{font-size:12px;letter-spacing:.42em;color:var(--ember-b);margin-bottom:30px;text-transform:uppercase}
  .gm-cine .ln{font-size:clamp(16px,2.4vw,22px);line-height:2.05;color:#e6e5e4;opacity:0;animation:cineLine 1s ease forwards;text-shadow:0 6px 30px rgba(0,0,0,.7)}
  .gm-cine .vic{margin-top:26px;font-size:clamp(15px,2.2vw,19px);color:var(--ember-b);font-style:italic;opacity:0;animation:cineLine 1s ease forwards}
  .gm-cine .go{margin-top:34px;color:var(--sub);font-size:13.5px;opacity:0;animation:cineLine 1s ease forwards;border-top:1px solid var(--line);padding-top:20px}
  @keyframes cineLine{from{opacity:0;transform:translateY(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
  /* 오프닝 사건개요 — 문단별 시네마틱 등장 */
  .cine-intro .cine-p{opacity:0;margin:0 0 15px;line-height:1.95;font-size:14.5px;color:#d1d0cf;animation:cineLine 1s ease forwards}
  .cine-intro .cine-p:last-child{margin-bottom:0}
  @media (prefers-reduced-motion: reduce){ .cine-intro .cine-p{animation-duration:.01ms!important} }
  @media (prefers-reduced-motion: reduce){ .gm-cine .ln,.gm-cine .vic,.gm-cine .go{animation-duration:.01ms!important} }
  .cell .rq{position:absolute;bottom:-3px;left:0;right:0;text-align:center;font-size:7.5px;color:var(--muted)}
  @media(max-width:560px){ .cell{width:40px;height:32px} }

  /* ============ 연출 애니메이션 ============ */
  /* 조사카드 뒤집힘(맵) */
  /* 조사카드 모달 공개 */
  @keyframes boxReveal{0%{transform:perspective(1200px) rotateX(14deg) translateY(24px) scale(.94);opacity:0;filter:blur(6px)}100%{transform:none;opacity:1;filter:none}}
  .modal .box.reveal{animation:boxReveal .5s cubic-bezier(.16,.8,.24,1) both}
  @keyframes glowPulse{0%{box-shadow:var(--shadow),0 0 0 0 rgba(240,235,225,0)}30%{box-shadow:var(--shadow),0 0 34px 4px rgba(240,235,225,.32)}100%{box-shadow:var(--shadow),0 0 0 0 rgba(240,235,225,0)}}
  .modal .box.reveal.clue{animation:boxReveal .5s cubic-bezier(.16,.8,.24,1) both,glowPulse 1.5s ease .3s 1}
  /* 충격 단서(A5류) — 붉은 섬광 + 흔들림 */
  @keyframes shockFlash{0%{transform:none}8%{transform:translateX(-5px)}16%{transform:translateX(5px)}24%{transform:translateX(-4px)}32%{transform:translateX(3px)}40%{transform:none}}
  @keyframes shockTint{0%{box-shadow:var(--shadow),inset 0 0 0 0 rgba(200,68,47,0)}20%{box-shadow:var(--shadow),inset 0 0 60px 6px rgba(200,68,47,.5)}100%{box-shadow:var(--shadow),inset 0 0 0 0 rgba(200,68,47,0)}}
  .modal .box.reveal.shock{animation:boxReveal .4s ease both,shockFlash .5s ease .35s 1,shockTint 1.6s ease .35s 1}
  /* 미끼 단서 — 금빛 어른거림 */
  @keyframes baitShimmer{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:var(--shadow),0 0 26px 2px rgba(240,235,225,.24)}}
  .modal .box.reveal.bait{animation:boxReveal .5s ease both,baitShimmer 2.2s ease .3s 2}

  /* 기억의 파편 떠오름 */
  @keyframes fragSurface{0%{opacity:0;filter:blur(8px);transform:translateY(10px)}100%{opacity:1;filter:blur(0);transform:none}}
  .frag{animation:fragSurface .7s ease both}
  .frag.newfrag{border-color:#6e675e;box-shadow:0 0 22px -4px rgba(195,186,176,.55)}
  @keyframes fragPing{0%,100%{box-shadow:0 0 0 0 rgba(195,186,176,0)}40%{box-shadow:0 0 26px 2px rgba(195,186,176,.6)}}
  .frag.newfrag{animation:fragSurface .7s ease both,fragPing 1.8s ease .5s 2}

  /* ── 오프닝 비주얼노벨 ──────────────────────────────────────────
     GM 화면에 띄우는 연출이라 무대는 16:9로 고정하고 레터박스로 가운데 둔다.
     무대 안의 치수는 전부 cqw(무대 폭 기준)라, 화면이 크든 작든 비율이 같다.
     배경·인물 이미지가 하나도 없어도 그라데이션 폴백으로 그대로 성립한다. */
  #vn{position:fixed;inset:0;z-index:90;display:none;background:#000;
    place-items:center;overflow:hidden}
  #vn.on{display:grid}
  #vn .vn-stage{position:relative;overflow:hidden;background:#060504;
    width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));
    container-type:inline-size}
  #vn .vn-bg{position:absolute;inset:0;background-size:cover;background-position:center;
    transition:opacity .55s ease, transform 7s linear;opacity:0;transform:scale(1.07);
    will-change:transform,opacity}
  #vn .vn-bg.show{opacity:1;transform:scale(1)}
  /* 그림이 아직 없을 때의 폴백 — 컷마다 바탕색만 다르게 두고, 그 위에 8비트 격자와
     빗금을 깐다. 「여기에 그림이 들어온다」가 보이되 글은 그대로 읽힌다.
     그림을 찾으면 JS 가 인라인 background-image 로 덮으므로 이 층은 자동으로 가려진다. */
  #vn .vn-bg.calm,#vn .vn-bg.bg,#vn .vn-bg.body,#vn .vn-bg.scene{
    background-image:
      repeating-linear-gradient(45deg,rgba(235,230,220,.045) 0 9px,transparent 9px 18px),
      repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 12px),
      repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 12px),
      radial-gradient(120% 90% at 50% 40%,var(--vnk,#1a1a17),#0a0a09 62%,#060505);
    image-rendering:pixelated}
  #vn .vn-bg.calm{--vnk:#16211d}
  #vn .vn-bg.bg{--vnk:#2a0f10}
  #vn .vn-bg.body{--vnk:#24080b}
  #vn .vn-bg.scene{--vnk:#231017}
  /* 「그림 없음」 표 — 그림을 실제로 찾은 컷(인라인 url 이 붙은 컷)에는 안 뜬다 */
  #vn .vn-bg:not([style*="url"])::after{content:"그림 없음";position:absolute;
    left:50%;top:32%;transform:translateX(-50%);
    font-family:var(--mono);font-size:1.5cqw;letter-spacing:.34em;line-height:1;
    color:rgba(235,230,220,.42);border:1px solid rgba(235,230,220,.22);padding:.8cqw 1.6cqw}
  #vn .vn-vig{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 14cqw 5cqw rgba(0,0,0,.85);
    background:linear-gradient(0deg,rgba(5,4,3,.95) 0%,rgba(5,4,3,.6) 26%,transparent 52%)}

  /* 인물 컷 — 인물 이미지는 배경이 딸린 완성 일러스트라 누끼 스프라이트처럼 쓸 수 없다.
     그래서 극화 만화의 인물 컷처럼 테두리를 준 패널로 세우고, 아랫단은 텍스트박스 뒤로 물린다.
     말하는 동안은 뒷배경을 눌러 인물이 앞으로 나오게 한다. */
  #vn .vn-sprite{position:absolute;right:5cqw;bottom:15cqw;height:56%;width:auto;
    object-fit:cover;border-radius:0;
    border:.16cqw solid color-mix(in srgb,var(--spk,#c3bab0) 62%,transparent);
    box-shadow:.6cqw .6cqw 0 rgba(0,0,0,.75), 0 0 0 .25cqw rgba(5,4,3,.85);
    opacity:0;transform:translate(1.6cqw,1.2cqw) scale(.985);
    transition:opacity .42s ease, transform .42s cubic-bezier(.2,.7,.3,1)}
  #vn .vn-sprite.show{opacity:1;transform:none}
  /* 초상이 아직 없는 배역 — 이모지(또는 이름 첫 글자)를 8비트 픽셀 액자에 넣어 세운다.
     스프라이트가 들어올 자리를 미리 잡아두는 셈이라, 그림이 붙어도 화면이 안 흔들린다. */
  #vn .vn-emo{position:absolute;right:5cqw;bottom:15cqw;width:26cqw;height:56%;
    display:grid;place-items:center;font-size:11cqw;line-height:1;
    background:var(--ph);image-rendering:pixelated;
    border:.16cqw solid color-mix(in srgb,var(--spk,#c3bab0) 45%,transparent);
    box-shadow:.6cqw .6cqw 0 rgba(0,0,0,.7);
    opacity:0;transform:translateY(1.2cqw);transition:opacity .42s ease,transform .42s ease;
    filter:drop-shadow(.2cqw .2cqw 0 rgba(0,0,0,.9)) saturate(.75)}
  #vn .vn-emo.show{opacity:.92;transform:none}
  #vn .vn-emo::after{content:"그림 없음";position:absolute;left:50%;bottom:1.2cqw;
    transform:translateX(-50%);font-family:var(--mono);font-size:1.2cqw;letter-spacing:.24em;
    color:rgba(235,230,220,.45);white-space:nowrap}
  /* 말하는 동안 뒤를 눌러 인물을 앞으로 낸다. 예전엔 .vn-bg 에 filter:brightness 를 걸었는데,
     같은 레이어가 7초짜리 확대를 동시에 돌고 있어서 브라우저가 매 프레임 배경 전체를
     필터링해 다시 그렸다. 어둡게 하는 일은 겹쳐놓은 검은 판의 불투명도로 옮긴다 —
     opacity 는 합성 단계에서 끝나 다시 그리지 않는다. */
  #vn .vn-dim{position:absolute;inset:0;pointer-events:none;background:#060504;
    opacity:0;transition:opacity .5s ease}
  #vn.speak .vn-dim{opacity:.52}

  /* 텍스트박스 — 컷은 «적은 글 + 큰 그림» 이 원칙이다. 그래서 글상자는 무대 한가운데로
     떠 있지 않고 바닥에 딱 붙어 화면 폭을 다 쓴다. 위쪽은 통째로 그림 자리가 된다.
     예전엔 좌우 6cqw · 아래 5cqw 를 띄운 «떠 있는 판» 이라 그림이 사방에서 잘려 보였다.
     칸 자체는 두 줄 남짓만 잡는다(min-height) — 글이 길어지면 그만큼만 아래로 자란다. */
  #vn .vn-box{position:absolute;left:0;right:0;bottom:0;padding:0;
    display:flex;flex-direction:column;align-items:flex-start}
  #vn .vn-name{display:none;align-self:flex-start;margin:0 0 0 4cqw;
    padding:.75cqw 2.2cqw;border-radius:0;
    font-family:var(--mono);font-size:1.75cqw;letter-spacing:.14em;font-weight:700;color:#0b0a09;
    background:var(--spk,#c3bab0);box-shadow:.25cqw .25cqw 0 rgba(0,0,0,.6)}
  #vn.speak .vn-name{display:block}
  #vn .vn-panel{width:100%;min-height:11cqw;padding:2.2cqw 4cqw 2.4cqw;
    background:linear-gradient(180deg,rgba(8,10,9,.94),rgba(4,6,5,.985));
    border:0;border-top:.22cqw solid rgba(235,230,220,.30);border-radius:0}
  #vn.speak .vn-panel{border-top-color:var(--spk,#c3bab0)}
  #vn .vn-line{font-family:var(--pix);color:#f2ecdf;
    font-size:2.4cqw;line-height:1.78;letter-spacing:-.005em;
    text-shadow:.12cqw .12cqw 0 rgba(0,0,0,.95);
    word-break:keep-all;text-wrap:balance;min-height:1.78em}
  #vn .vn-line+.vn-line{margin-top:.7cqw}
  #vn.speak .vn-line{color:#fff}
  /* 타자 연출은 글자를 "덧붙이지" 않고, 처음부터 전체를 깔아둔 뒤 안 읽은 쪽을 감춘다.
     그래야 글자가 늘어날 때마다 줄갈이가 다시 계산돼 문장이 들썩이는 일이 없다. */
  #vn .vn-off{opacity:0}
  /* 대사 본문에 나오는 인물 이름 — 그 사람의 키컬러. 이름표(.vn-name)가 화자의 색으로
     서 있는 것과 같은 규칙이다. 죽은 사람 이름도 여기서 색을 얻는다(피해자 카드의 color).
     굵기만 한 단계 올리고 배경은 안 깐다 — 대사 한가운데에 칩이 박히면 문장이 끊긴다. */
  #vn .vn-nm{color:var(--nc,inherit);font-weight:800;
    text-shadow:.12cqw .12cqw 0 rgba(0,0,0,.95)}
  /* 커서는 자리를 차지하면 안 된다 — 폭만큼 음수 마진으로 상쇄해 줄갈이에 영향이 0이 되게 */
  #vn .vn-line.typing .vn-on::after{content:"";display:inline-block;width:.1em;height:1em;
    margin:0 -.1em 0 0;vertical-align:-.13em;background:var(--spk,#c9c2b4);
    animation:vnCaret .8s steps(1) infinite}
  @keyframes vnCaret{50%{opacity:0}}

  #vn .vn-bar{display:flex;align-items:center;gap:1.4cqw;margin-top:1.8cqw;width:100%}
  #vn .vn-dots{display:flex;gap:.55cqw;flex:1;flex-wrap:wrap}
  #vn .vn-dot{width:.62cqw;height:.62cqw;border-radius:0;background:rgba(255,255,255,.22)}
  #vn .vn-dot.on{background:var(--ember-b);width:2cqw;border-radius:2px}
  #vn .vn-hint{font-size:1.4cqw;color:rgba(255,255,255,.5);letter-spacing:.04em;white-space:nowrap}
  #vn .vn-tools{position:absolute;top:2.2cqw;right:2.2cqw;z-index:4;display:flex;gap:1cqw}
  #vn .vn-tool{background:rgba(6,5,4,.62);border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.72);border-radius:2px;padding:.8cqw 1.9cqw;
    font-size:1.5cqw;font-family:inherit;cursor:pointer;line-height:1.3}
  #vn .vn-tool:hover{color:#fff;border-color:var(--ember-b)}

  /* 극 진행 연출 — 컷의 fx 값이 무대에 클래스로 붙는다 */
  /* 화면을 통째로 덮는 칸이라 그림이 매번 다시 구워지면 곧바로 프레임이 떨어진다.
     한 번 구워 레이어로 올려두고 투명도만 건드린다. */
  #vn .vn-flash{position:absolute;inset:0;pointer-events:none;opacity:0;
    will-change:opacity;transform:translateZ(0)}
  #vn .vn-stage.fx-alarm .vn-flash{background:radial-gradient(120% 90% at 50% 40%,rgba(224,60,42,.55),transparent 70%);
    animation:vnAlarm 1.15s ease-out 3}
  #vn .vn-stage.fx-thud  .vn-flash{background:#000;animation:vnBlack .5s ease-out 1}
  #vn .vn-stage.fx-static .vn-flash{background:repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 1px,transparent 1px 3px);
    animation:vnStatic .5s steps(3) 3}
  #vn .vn-stage.fx-water .vn-flash{background:linear-gradient(0deg,rgba(46,90,172,.5),transparent 55%);
    animation:vnRise 1.9s ease-out 1}
  /* 밤이 내려앉는다 — 그림이 천천히 꺼지고 그대로 어둠에 머문다.
     글자는 위 칸(.vn-box)에 있어서 안 덮인다. 읽을 것은 계속 읽혀야 한다. */
  #vn .vn-stage.fx-nightfall .vn-flash{background:#050404;animation:vnNightfall 3.4s cubic-bezier(.35,0,.5,1) forwards}
  /* .show 가 붙은 스프라이트만 꺼진다. 화자 없는 컷에도 걸어놨더니
     앞 컷 사람이 opacity:1 로 되살아났다가 사라졌다 — 깜빡이는 것처럼 보였다. */
  #vn .vn-stage.fx-nightfall .vn-sprite.show{animation:vnFadeOut 3.4s cubic-bezier(.35,0,.5,1) forwards}
  /* 배경에 filter 를 걸어 식히던 연출은 뺐다. 화면 가득한 사진에 filter 를 «애니메이션»
     하면 매 프레임 다시 굽는다 — 폰에서 눈에 띄게 버벅였다. 위의 어둠막(.vn-flash)이
     94% 를 덮으므로 색을 죽인 것과 보이는 결과가 거의 같다. */
  /* 이미 어두워진 다음 컷 — 애니메이션 없이 그 자리에 머문다 */
  #vn .vn-stage.fx-night .vn-flash{background:#050404;opacity:.94}
  @keyframes vnNightfall{0%{opacity:0}14%{opacity:.12}55%{opacity:.62}100%{opacity:.94}}
  @keyframes vnFadeOut{0%{opacity:1}100%{opacity:0}}
  @media(prefers-reduced-motion:reduce){
    #vn .vn-stage.fx-nightfall .vn-flash{animation:none;opacity:.94}
    #vn .vn-stage.fx-nightfall .vn-sprite.show{animation:none;opacity:0}
  }
  @keyframes vnAlarm{0%,100%{opacity:0}45%{opacity:1}}
  @keyframes vnBlack{0%{opacity:1}100%{opacity:0}}
  @keyframes vnStatic{0%,100%{opacity:0}50%{opacity:.85}}
  @keyframes vnRise{0%{opacity:0;transform:translateY(30%)}60%{opacity:1}100%{opacity:.35;transform:none}}
  /* 흔들림은 cqw 대신 px 로, translate3d 로 적는다 — 합성 레이어에 올라가서 매 프레임
     다시 굽지 않는다. cqw 로 두면 컨테이너 질의 값을 프레임마다 되풀이해 잰다. */
  #vn .vn-stage.fx-alarm,#vn .vn-stage.fx-thud{animation:vnShake .5s cubic-bezier(.36,.07,.19,.97) 1}
  #vn .vn-stage.fx-rumble{animation:vnRumble 2.4s ease-in-out 1}
  @keyframes vnShake{10%,90%{transform:translate3d(-3px,0,0)}30%,70%{transform:translate3d(5px,0,0)}
    50%{transform:translate3d(-5px,0,0)}100%{transform:translate3d(0,0,0)}}
  @keyframes vnRumble{0%,100%{transform:translate3d(0,0,0)}
    20%{transform:translate3d(2px,-1px,0)}40%{transform:translate3d(-2px,1px,0)}
    60%{transform:translate3d(2px,1px,0)}80%{transform:translate3d(-1px,-1px,0)}}

  /* 세로로 든 폰 — GM 화면이 아닌 경우다. 16:9로 가두면 글자가 10px 밑으로 떨어지므로
     레터박스를 풀고 화면을 채운 뒤 치수만 키운다. */
  @media(max-width:700px) and (orientation:portrait){
    #vn .vn-stage{width:100vw;height:100dvh}
    #vn .vn-line{font-size:5.2cqw}
    #vn .vn-line+.vn-line{margin-top:1.6cqw}
    #vn .vn-name{font-size:3.4cqw;margin-left:5cqw;padding:1.5cqw 4cqw;border-radius:0}
    #vn .vn-hint{font-size:3.1cqw}
    #vn .vn-tool{font-size:3.4cqw;padding:1.6cqw 3.8cqw;border-radius:2px}
    #vn .vn-tools{top:4cqw;right:4cqw;gap:2cqw}
    /* 세로 폰에서도 원칙은 같다 — 그림이 위를 다 쓰고, 글은 바닥에 붙은 띠로만 얹힌다 */
    #vn .vn-box{padding:0}
    #vn .vn-panel{min-height:24cqw;padding:4.5cqw 5cqw 5cqw;border-radius:0}
    #vn .vn-bar{margin-top:4cqw;gap:3cqw}
    #vn .vn-dot{width:1.4cqw;height:1.4cqw}
    #vn .vn-dot.on{width:4.2cqw;border-radius:0}
    #vn .vn-sprite{height:40%;bottom:30cqw;right:6cqw;border-radius:0}
    #vn .vn-emo{font-size:20cqw;width:52cqw;height:40%;bottom:30cqw;right:6cqw}
    #vn .vn-emo::after{font-size:2.6cqw;bottom:2.5cqw}
    #vn .vn-bg:not([style*="url"])::after{font-size:3.2cqw;top:26%;padding:1.6cqw 3cqw}
    #vn .vn-vig{box-shadow:inset 0 0 28cqw 10cqw rgba(0,0,0,.85)}
  }
  @media(prefers-reduced-motion:reduce){
    #vn .vn-bg,#vn .vn-sprite,#vn .vn-emo{transition-duration:.01ms}
    #vn .vn-stage,#vn .vn-flash{animation:none!important}
    #vn .vn-line.typing::after{animation:none}
  }

  /* ── 조사 현황판 ────────────────────────────────────────────
     구역마다 한 줄에 점과 얼굴만 찍어두던 판이었다 — 몇 장 중 몇 장인지는 보였지만
     '누가 무엇을 쥐었나'는 그 줄을 열어봐야 알았고, 그게 이 화면의 존재 이유였다.
     조사카드를 전부 펼쳐놓고 카드마다 임자를 붙인다(관리자 훑어보기와 같은 결).
     남의 손패는 임자만 보인다 — 제목·본문은 전체공개된 것만 나온다. */
  .dashhead{margin:16px 0 8px;font-size:13.5px;font-weight:700;color:var(--ink)}
  .dash{display:flex;flex-direction:column;gap:14px}
  .dz-h{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;cursor:pointer;
    background:none;border:0;padding:0 0 7px;margin-bottom:8px;border-bottom:1px solid var(--line);
    font-family:inherit;color:var(--ink);font-size:14px;font-weight:700}
  .dz-h:hover{color:#fff}
  .dz-h .n{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
  .dz-h .go{font-size:12px;color:var(--muted)}
  /* ── 새로 열린 구역 ────────────────────────────────────────────
     밝았다 어두워졌다 하는 맥박(하이라이트 디밍)이다. 8비트라 steps() 로 끊어 친다 —
     부드럽게 흐르면 이 화면에서 혼자 다른 세계가 된다.
     그 구역을 처음 누르면 멎는다(ackZone). 사람마다 따로 기억한다. */
  .dz.znew{padding:8px 10px;margin:-8px -10px;
    border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));
    animation:zoneDim 1.15s steps(1) infinite}
  .dz.znew .dz-h{color:var(--gold-b);border-bottom-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
  .dz-h .znew-t{font-size:10.5px;letter-spacing:.1em;font-weight:800;color:#0b0b09;
    background:var(--gold-b);padding:1px 6px}
  @keyframes zoneDim{
    0%,49%  {background:rgba(0,230,147,.15)}
    50%,100%{background:rgba(0,230,147,.03)}
  }
  /* 지도 쪽 구역 칸도 같은 박자로 — SVG 라 채우기만 오간다 */
  svg .z-new .zone-fill{animation:zoneDimSvg 1.15s steps(1) infinite}
  @keyframes zoneDimSvg{
    0%,49%  {fill:#16342a;stroke:#5bffc2}
    50%,100%{fill:#141310;stroke:#2a6b52}
  }
  @media(prefers-reduced-motion:reduce){
    .dz.znew{animation:none;background:rgba(0,230,147,.12)}
    svg .z-new .zone-fill{animation:none;stroke:#5bffc2} }
  /* ── 조사 현황판 · 여섯 상태를 한 규격으로 ─────────────────────────
     칸은 «같은 크기» 로 선다. 예전엔 칸마다 제 내용만큼만 높아서, 같은 줄에 선
     전체공개(108px)와 안 열린 칸(59px)의 키가 49px 어긋났다 — 그게 그리드가
     무너져 보이던 원인이다. 이제 두 가지가 키를 붙든다:
       ① --dc-h — 어떤 칸도 이보다 낮지 않다(구역이 달라도 키가 같다)
       ② grid-auto-rows:1fr — 한 그리드 안의 모든 줄이 같은 키가 된다
     칸 안의 줄 수도 셋으로 고정하고 전부 한 줄로 자른다. 크기·여백·테두리 두께로
     차이를 내지 않는다 — 달라지는 것은 색과 이름표뿐이다. */
  .dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,214px),1fr));gap:8px;
    align-items:stretch;grid-auto-rows:1fr;--dc-h:90px}
  .dc{--wc:var(--line);display:flex;flex-direction:column;gap:5px;text-align:left;font-family:inherit;
    background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--wc);
    border-radius:2px;padding:10px 12px;color:var(--ink);transition:.13s;
    min-height:var(--dc-h);justify-content:flex-start}
  .dc.act{cursor:pointer}
  .dc.act:hover{border-color:var(--wc)}
  /* ① 윗줄 — 자리 이름과 이름표가 한 줄에 선다 */
  .dc .dc-top{display:flex;align-items:flex-start;gap:6px;min-height:18px}
  .dc .sp{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:700;word-break:keep-all;line-height:1.45;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  /* 이름표 — 상태를 색과 말로 한 번에 짚는다. 여섯 자리에서 크기가 같다. */
  .dc .dtag{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
    padding:1px 6px;border:1px solid currentColor;border-radius:0;
    font-size:10px;font-weight:700;letter-spacing:.04em;line-height:1.5;
    color:var(--muted);white-space:nowrap;max-width:52%;overflow:hidden}
  .dc .dtag i{font-style:normal;display:inline-flex;font-size:12px}
  .dc .dtag .ava{width:12px;height:12px;flex:0 0 auto}
  /* ② 큰 줄 — 제목(읽을 것이 있는 칸) 또는 상태 한 줄. 늘 한 줄이다. */
  .dc .ti{min-height:20px;font-size:13.5px;font-weight:800;color:var(--ink);word-break:keep-all;line-height:1.45;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden}
  /* 읽을 제목이 없는 칸의 큰 줄 — 자리는 그대로 쓰되 한 톤 물러난다 */
  .dc .ti .q{font-size:12.5px;font-weight:700;color:var(--sub)}
  /* ③ 작은 줄 — 요약 한 줄까지만. 여기는 훑는 판이고, 전문은 카드를 눌러 읽는다. */
  .dc .tx{min-height:20px;font-size:12px;color:var(--sub);line-height:1.65;word-break:keep-all;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden}
  .dc .st{font-size:11.5px;color:var(--muted)}
  /* 이튿날 새로 생긴 자리 — 첫날에 없던 것이라 한눈에 갈라져야 한다.
     칸을 차게 틴팅하고 이름 옆에 「이튿날」을 붙인다. */
  .dc.fresh{--wc:var(--cold);background:linear-gradient(180deg,rgba(180,170,158,.14),rgba(180,170,158,.04))}
  .fr{display:inline-block;margin-left:6px;padding:0 5px;border-radius:2px;vertical-align:1px;
    font-size:9.5px;font-weight:800;letter-spacing:.06em;
    color:var(--cold);border:1px solid color-mix(in srgb,var(--cold) 55%,transparent);
    background:rgba(180,170,158,.14)}
  .zcard.fresh{border-color:color-mix(in srgb,var(--cold) 45%,var(--line));
    background:linear-gradient(180deg,rgba(180,170,158,.14),rgba(180,170,158,.04))}
  /* 그 아침에 «벌어진 일» 자체를 적은 카드 — 판을 뒤집는 자리라 붉게 세운다 */
  .dc.hot,.zcard.hot{--wc:var(--ember);border-color:color-mix(in srgb,var(--ember) 50%,var(--line));
    background:linear-gradient(180deg,rgba(170,60,40,.17),rgba(170,60,40,.05))}
  .dc.hot .fr,.zcard.hot .fr{color:var(--ember-b);
    border-color:color-mix(in srgb,var(--ember) 55%,transparent);background:rgba(170,60,40,.16)}
  .dc .wh{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--wc);font-weight:700}
  .dc .wh i{font-style:normal;font-size:14px}
  /* 여섯 상태의 «색». 크기는 위에서 이미 하나로 묶었고, 여기서 갈리는 건 색뿐이다. */
  .dc.pub  .dtag{color:var(--gold-b)}
  .dc.mine .dtag{color:var(--me,var(--cold))}
  .dc.held .dtag{color:var(--wc)}
  .dc.none .dtag{color:var(--muted)}
  /* 아직 아무도 안 본 카드 — 판에 있다는 것만 알린다.
     예전엔 테두리를 점선으로 바꿔 갈랐는데, 여섯 상태가 «색과 표시로만» 갈려야 하는
     자리라 실선으로 되돌리고 바탕과 테 색만 한 단계 물린다. */
  .dc.none{background:var(--bg2);border-color:#2a2825}
  .dc.none .sp{color:var(--sub);font-weight:400}
  /* 아직 안 뒤진 자리는 «엎어놓은 카드»다. 시나리오가 뒷면 그림을 주면 왼쪽에 그 카드를 세운다.
     뒷면이 없는 판은 hasback 이 안 붙어서 지금까지처럼 점선 칸으로 남는다. */
  /* 여백은 여섯 칸이 «같이» 문다 — 안 열린 칸만 왼쪽을 비우면 그 줄의 그리드가 어긋난다.
     그림이 서는 것만 안 열린 칸이고, 자리는 모두가 똑같이 비워 둔다. */
  body.hasback .dcards .dc{padding-left:68px}
  body.hasback .dc.none::before{content:"";position:absolute;left:12px;top:50%;
    width:44px;height:59px;transform:translateY(-50%);
    background:var(--cardback) center/contain no-repeat;
    filter:drop-shadow(2px 2px 0 rgba(0,0,0,.6))}
  /* 아직 열 수 없는 자리는 뒷면도 같이 잠긴다 — 색이 빠지면 못 뒤진다는 게 한눈에 읽힌다 */
  body.hasback .dc.none.lock::before{filter:grayscale(.75) brightness(.5)}
  /* 여기서 바로 조사할 수 있다는 표시 — 잠긴 자리에는 붙이지 않는다 */
  /* 전원이 아는 소문 — 시트가 아니라 인물정보에 붙는다. 여기 적힌 건 전부 밖에서 온 말이다. */
  .wknown{margin-top:6px;padding:7px 10px;border-radius:2px;font-size:12px;line-height:1.65;
    color:var(--sub);background:rgba(255,255,255,.03);border-left:2px solid #4b453d;word-break:keep-all}
  .wknown .k{display:block;font-size:10px;letter-spacing:.14em;color:var(--cold);margin-bottom:2px}
  /* 한 달을 같이 산 사람의 눈 — 밖에서 온 말(.wknown)과 색을 달리 둔다 */
  .wimp{margin-top:6px;padding:7px 10px;border-radius:2px;font-size:12px;line-height:1.65;
    color:var(--sub);background:rgba(255,255,255,.03);
    border-left:2px solid color-mix(in srgb,var(--me,var(--cold)) 60%,transparent);word-break:keep-all}
  .wimp .k{display:block;font-size:10px;letter-spacing:.14em;color:var(--me,var(--cold));margin-bottom:2px}
  /* 앉을 수 없는 인물 — 배역 줄과 같은 판인데 한 톤 물러나 있어야 한다 */
  .npch{margin:18px 0 8px;padding-top:14px;border-top:1px dashed var(--line);
    font-size:10.5px;letter-spacing:.16em;color:var(--sub)}
  .mlead.sm{font-size:11.5px;margin-bottom:2px}
  .npcrow{opacity:.82}
  .npcrow .ava{filter:grayscale(.5)}
  .pill.npcp{color:var(--sub);border-color:var(--line)}
  .wnote{margin-top:6px;padding:7px 10px;border-radius:2px;font-size:12px;line-height:1.65;
    color:var(--sub);background:rgba(255,255,255,.03);border-left:2px solid #4a4136;word-break:keep-all}
  .wnote .k{display:block;font-size:10px;letter-spacing:.14em;color:#9a8a72;margin-bottom:2px}
  .dc-go{align-self:flex-end;margin-top:-16px;font-size:11px;font-weight:700;color:var(--cold);white-space:nowrap}
  .dc.none.lock .dc-go{display:none}
  /* 누가 쥐고 있다 — 그 사람의 키컬러가 카드 옆구리에 선다 */
  .dc.held{background:var(--panel2)}
  /* 내가 쥔 카드 — 금색이 아니라 내 배역의 색이다(--me) */
  .dc.mine{--wc:var(--me,var(--cold));border-color:color-mix(in srgb,var(--me,var(--cold)) 44%,var(--line));
    background:linear-gradient(160deg,color-mix(in srgb,var(--me,var(--cold)) 13%,#151413),#151413)}
  .dc.mine .ti{color:var(--me,var(--ink))}
  /* 전체공개 — 제목도 본문도 나온다. 여기만 읽을 것이 있다.
     현황판에서 제일 먼저 눈에 들어와야 하는 칸이라 테두리를 신호색으로 두른다.
     .hot(붉은 테두리)보다 «뒤에» 있어야 이긴다 — 자리를 옮기지 않는다. */
  .dc.pub{--wc:var(--gold);border-color:color-mix(in srgb,var(--gold) 52%,var(--line));
    background:linear-gradient(160deg,#1a201c,#171613)}
  .dc.pub .ti{color:var(--cold)}
  .dc.pub .st{color:var(--gold-b)}
  .dc.lock{opacity:.5}
  /* 구역 점 — 시나리오 선택창 사람표시와 같은 읽는 법 */
  .zpips{display:flex;gap:3px}
  .zp{width:7px;height:7px;border-radius:0;background:rgba(255,255,255,.18);box-shadow:1px 1px 0 rgba(0,0,0,.5)}
  .zp.hand{background:var(--me,var(--case-ink))}
  .zp.pub{background:var(--cold)}
  .zp.taken{background:var(--sub)}
  .zp.lock{background:rgba(255,255,255,.1)}

  /* ── 배 안 둘러보기 팝업 (가로형) ───────────────────────────── */
  #mapModal .win{max-width:min(97vw,1180px);width:97vw}
  /* 토론 중에 여는 조사 화면 — 조사 페이즈에서 보던 그대로를 감싸기만 한다.
     구역 팝업(#mapModal)은 DOM 에서 이 뒤에 있어 이 위로 뜬다. */
  #lookModal .win{max-width:min(97vw,1180px);width:97vw}
  /* 카드 팝업은 무엇 위에서 열리든 맨 앞이다 — 구역 팝업 뒤로 숨지 않게. */
  #cardModal{z-index:70}
  /* 확대해 끌어보는 배치도 — 넘치는 만큼은 이 틀이 물고 있어야 한다.
     여태 전용 규칙이 없어서 확대하면 그림이 팝업 밖으로 삐져나갔다. */
  .mzoom{overflow:hidden;border:1px solid var(--line);border-radius:2px;background:#100f0d;touch-action:none}
  .mzoom .mvp{transform-origin:0 0;will-change:transform}
  /* 배치도의 구역이 곧 버튼이다 — 위에 무엇도 얹지 않는다 */
  /* 지도 위에 머리줄은 하나뿐이다 — 이름·수치·규칙·확대가 한 줄에 다 있다. */
  .mapbar{display:flex;align-items:center;gap:7px;margin:0 0 8px;overflow-x:auto;scrollbar-width:none}
  .mapbar::-webkit-scrollbar{display:none}
  .mapbar>*{flex:0 0 auto}
  .mapbar .mh{font-size:13.5px;font-weight:700;color:var(--ink)}
  .mapbar .mspace{flex:1 1 auto;min-width:4px}
  .mrule{flex:0 0 auto;width:21px;height:21px;border-radius:0;border:1px solid var(--line);background:none;
    color:var(--muted);font-size:11px;line-height:1;cursor:pointer;padding:0}
  .mrule:hover{border-color:var(--case-line);color:var(--ink)}
  .mapwrap.live svg .z-live{cursor:pointer}
  .mapwrap.live svg .z-live:hover .zone-fill{fill:#2a2721;stroke:var(--case-ink)}
  .mapwrap.live svg .z-live .z-cnt{fill:var(--cold)}
  .mapwrap.live svg .z-done .zone-fill{stroke:#3a8a80}
  .mapwrap.live svg .z-done .z-cnt{fill:#3fdfc4}
  .mapwrap.live svg .z-empty{opacity:.35}
  /* 밖에서 잠근 칸 — 누를 수 없고, 그렇게 보여야 한다 */
  svg .z-sealed .zone-fill{fill:#131210;stroke:#454039;stroke-dasharray:5 4}
  svg .z-sealed .z-name{fill:#6b655c}
  svg .z-sealed .z-cnt{fill:#6b655c;font-size:12px}

  /* ── 침수 대응 퍼즐 ─────────────────────────────────────────
     조사 화면 맨 위를 차지한다. 이걸 넘기고 조사부터 하면 안 되니까 눈에 걸리게. */
  /* 위에서 내려왔다 올라가는 알림 */
  .dropnote{position:fixed;left:50%;top:0;transform:translate(-50%,-130%);z-index:70;
    display:flex;align-items:center;gap:10px;max-width:min(92vw,420px);
    padding:11px 14px;border:1px solid var(--case-line);border-radius:0 0 2px 2px;
    border-top:0;background:rgba(20,16,10,.97);box-shadow:4px 4px 0 rgba(0,0,0,.5);
    cursor:pointer;transition:transform .38s cubic-bezier(.22,1,.32,1),opacity .3s;opacity:0}
  .dropnote.on{transform:translate(-50%,0);opacity:1}
  .dropnote .dn-i{color:var(--cold);display:flex}
  .dropnote .dn-i svg{width:18px;height:18px}
  .dropnote .dn-t{display:flex;flex-direction:column;gap:2px;min-width:0}
  .dropnote .dn-t b{font-size:13.5px;color:#fff;font-weight:700}
  .dropnote .dn-t i{font-style:normal;font-size:11.5px;color:var(--sub);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dropnote .dn-go{margin-left:auto;font-size:12px;color:var(--case-ink);font-weight:700;white-space:nowrap}
  /* 지금은 안 볼 사람을 위한 자리. 알림은 누를 때까지 안 사라지니까 나갈 문이 있어야 한다. */
  .dropnote .dn-x{flex:0 0 auto;width:26px;height:26px;padding:0;display:grid;place-items:center;
    background:none;border:0;border-left:1px solid var(--line);margin-left:2px;color:var(--muted);cursor:pointer}
  .dropnote .dn-x svg{width:14px;height:14px}
  .dropnote .dn-x:hover{color:var(--ink)}
  /* 알림이 내려와 있는 동안 뒤를 한 겹 죽인다 — 눌러야 하는 건 알림이 아니라서 통과시킨다 */
  .dropdim{position:fixed;inset:0;z-index:69;pointer-events:none;background:#060505;
    opacity:0;transition:opacity .34s ease}
  .dropdim.on{opacity:.42}
  @media(prefers-reduced-motion:reduce){ .dropnote{transition:opacity .2s} .dropdim{transition:opacity .15s} }
  .dashhead{display:flex;align-items:center;gap:10px}
  .dashhead .dh-t{flex:0 0 auto}
  /* 거르개 — 「필터」라고 적어둔다. 상자 하나만 놓아뒀더니 그게 거르개인 줄을 몰랐다. */
  .dfilt{margin-left:auto;display:inline-flex;align-items:center;gap:6px;max-width:62%;
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:2px;
    padding:6px 10px;color:var(--sub);font-family:inherit;font-size:11.5px;cursor:pointer;transition:.13s}
  .dfilt:hover{border-color:var(--cold);color:var(--ink)}
  .dfilt .fi{display:flex;color:var(--muted)}
  .dfilt .fi svg{width:13px;height:13px}
  .dfilt .fk{font-weight:800;letter-spacing:.08em;color:var(--muted);flex:0 0 auto}
  .dfilt .fv{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dfilt.on{border-color:var(--cold);background:rgba(180,170,158,.14)}
  .dfilt.on .fi,.dfilt.on .fk{color:var(--cold)}
  /* 하나 고르는 창 — 안내창과 같은 틀 안에 줄로 세운다 */
  .pickone{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .po{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-family:inherit;
    background:var(--bg2);border:1px solid var(--line);border-radius:2px;padding:11px 12px;
    color:var(--ink);cursor:pointer;transition:.13s}
  .po:hover{border-color:var(--cold)}
  .po.on{border-color:var(--cold);background:rgba(180,170,158,.16)}
  .po .po-k{flex:0 0 18px;display:flex;color:var(--muted)}
  .po.on .po-k{color:var(--cold)}
  .po .po-k svg{width:15px;height:15px}
  .po .po-w{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
  .po .po-w b{font-size:14px;font-weight:700}
  .po .po-w i{font-style:normal;font-size:11.5px;color:var(--sub);word-break:keep-all}
  .po .po-n{flex:0 0 auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .po.on .po-n{color:var(--cold)}
  .nqlist{margin-top:12px;display:flex;flex-direction:column;gap:7px}
  .nq{border:1px solid var(--line);border-left-width:3px;border-radius:2px;padding:10px 12px;
    background:rgba(255,255,255,.02)}
  .nq .nq-q{font-size:13.5px;line-height:1.6;color:#f0ebe4;word-break:keep-all}
  .nq .nq-a{margin-top:6px;display:flex;align-items:center;gap:8px;font-size:12.5px}
  .nq .nq-a .by{margin-left:auto;color:var(--sub);font-size:11.5px}
  .nq.nod{border-left-color:#3a8a80}   .nq.nod .nq-a b{color:#6fded0}
  .nq.shake{border-left-color:#8a5a4e} .nq.shake .nq-a b{color:#e8a89b}
  .nq.off{border-left-color:var(--line);opacity:.5}
  .nq.off .nq-q{color:var(--sub)}
  .nq-sep{margin-top:16px;font-size:11px;letter-spacing:.2em;font-weight:700;color:var(--sub)}
  .asklist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .ask-q{display:block;width:100%;text-align:left;padding:12px 13px;cursor:pointer;font:inherit;color:inherit;
    border:1px solid var(--line);border-radius:2px;background:rgba(255,255,255,.02)}
  .ask-q:disabled{cursor:default}
  .ask-q .ask-t{font-size:14px;line-height:1.6;color:#f0ebe4;word-break:keep-all}
  .ask-q .ask-a{margin-top:7px;font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px}
  .ask-q .ask-a .by{margin-left:auto;font-size:11.5px;opacity:.75}
  .ask-q .ask-a.wait{color:var(--cold);font-weight:700}
  .ask-q:disabled .ask-a.wait{color:var(--sub);font-weight:400}
  .ask-q.on{border-color:var(--case-line);background:var(--case-off);box-shadow:inset 0 1px 0 rgba(0,0,0,.4)}
  .ask-q.on .ask-t{color:#fff}
  .ask-q.on .ask-a.wait{color:var(--case-ink)}
  .ask-q.done{background:rgba(255,255,255,.04)}
  .ask-q.done .ask-t{color:var(--sub)}
  .ask-q.nod{border-color:#3a8a80}   .ask-q.nod .ask-a{color:#6fded0}
  .ask-q.shake{border-color:#8a5a4e} .ask-q.shake .ask-a{color:#e8a89b}
  .nightcard,.accusecard{border:1px solid var(--line);border-radius:2px;padding:15px 16px}
  .nightcard{background:linear-gradient(168deg,rgba(18,17,15,.96),rgba(13,12,11,.98))}
  .nt-kick{font-size:11px;letter-spacing:.26em;color:var(--cold);font-weight:700;margin-bottom:5px}
  .nightcard h2,.accusecard h2{margin:0 0 9px;font-size:17px;color:#fff}
  .nt-intro{font-size:13.5px;line-height:1.85;color:#d5cec5;white-space:pre-line;word-break:keep-all}
  .nt-prompt{margin-top:11px;font-size:13px;color:var(--ink);font-weight:700;word-break:keep-all}
  .nt-why{margin-top:14px;padding:11px 13px;border-left:2px solid var(--ember-b,#e0663c);
    background:rgba(224,102,60,.08);font-size:13px;line-height:1.85;color:#ecd3ca;
    white-space:pre-line;word-break:keep-all}
  .nt-why .w{font-size:11px;letter-spacing:.2em;color:var(--ember-b,#e0663c);font-weight:700;margin-bottom:6px}
  .nt-opt{display:block;width:100%;text-align:left;margin-top:9px;padding:11px 13px;cursor:pointer;
    border:1px solid var(--line);border-radius:2px;background:rgba(255,255,255,.02);color:inherit;font:inherit}
  .nt-opt .nt-h{display:flex;align-items:center;gap:8px;font-size:14px;color:#f0ebe4}
  .nt-opt .mk{flex:0 0 auto;width:11px;height:11px;border-radius:0;border:1px solid var(--sub)}
  .nt-opt.on{border-color:var(--case-line);background:var(--case-off);box-shadow:inset 0 1px 0 rgba(0,0,0,.4)}
  .nt-opt.on .mk{background:var(--case-ink);border-color:var(--case-ink)}
  .nt-opt.locked{opacity:.55}
  .nt-opt .at{margin-left:auto;display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;color:var(--cold);font-variant-numeric:tabular-nums}
  .nt-opt .at i{font-style:normal;font-size:9.5px;letter-spacing:.14em;font-weight:700;
    color:var(--sub);border:1px solid var(--line);border-radius:2px;padding:2px 5px}
  .nt-opt .at.skip{color:var(--sub)}
  .nt-opt .nt-d{margin-top:6px;font-size:12.5px;line-height:1.75;color:var(--sub);white-space:pre-line;word-break:keep-all}
  .nt-foot{display:flex;align-items:center;gap:10px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
  .nt-foot .tally{font-size:12px;color:var(--sub)}
  .nt-foot .btn{margin-left:auto}
  .nightcard.done{border-color:#5a544c}
  .nt-out{margin-top:8px;font-size:13.5px;line-height:1.8;color:#e2dbd2;white-space:pre-line;word-break:keep-all}
  .nt-mine{margin-top:13px;padding:11px 13px;border-left:2px solid var(--me,var(--cold));background:rgba(195,186,176,.06);
    font-size:13px;line-height:1.85;color:#e2dbd2;white-space:pre-line;word-break:keep-all}
  .nt-mine .w{font-size:11px;letter-spacing:.2em;color:var(--me,var(--cold));font-weight:700;margin-bottom:6px}
  .ac-opt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;margin-top:9px;padding:11px 13px;
    cursor:pointer;border:1px solid var(--line);border-radius:2px;background:rgba(255,255,255,.02);color:inherit;font:inherit}
  .ac-opt .mk{width:11px;height:11px;border-radius:0;border:1px solid var(--rc,var(--sub))}
  .ac-opt.on{border-color:var(--rc);background:color-mix(in srgb,var(--rc) 12%,transparent)}
  .ac-opt.on .mk{background:var(--rc)}
  .ac-opt b{font-size:14px;color:#f0ebe4}
  .ac-opt .jb{margin-left:auto;font-size:11.5px;color:var(--sub)}
  .ac-tally{margin-top:14px;padding-top:11px;border-top:1px solid var(--line)}
  .ac-tally .w{font-size:11px;letter-spacing:.2em;color:var(--sub);font-weight:700;margin-bottom:7px}
  .ac-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:#e2dbd2}
  .crisis{border:1px solid var(--ember);border-radius:2px;padding:15px 16px;margin-bottom:12px;
    background:linear-gradient(165deg,rgba(40,12,10,.92),rgba(13,12,11,.96));
    box-shadow:0 0 0 1px rgba(200,68,47,.34),3px 3px 0 rgba(0,0,0,.5)}
  .crisis .cr-kick{font-size:11px;letter-spacing:.26em;color:var(--ember-b);font-weight:700;margin-bottom:5px}
  .crisis h3{margin:0 0 8px;font-size:17px;color:#fff}
  .crisis .cr-intro{font-size:13.5px;line-height:1.8;color:#e8d8d4;white-space:pre-line;word-break:keep-all}
  .crisis .cr-prompt{margin-top:11px;font-size:13px;color:var(--ink);font-weight:700;word-break:keep-all}
  /* 퍼즐 판 — 문제에 필요한 것은 전부 이 그림 안에 있다.
     이 아래 파랑은 남겨 둔다. 시스템 블루(--cold)를 웜그레이로 내릴 때 같이 훑었지만,
     여기 파랑은 「판이 하는 말」이 아니라 «물» 그 자체다 — 새는 자리·수위·잠긴 칸이
     파랗지 않으면 문제가 안 읽힌다. 이 블록은 침수 시나리오 전용이라 이번 사건에는
     아예 뜨지 않는다. */
  .cr-board{margin-top:13px;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:#100f0d}
  .cr-board svg{width:100%;height:auto;display:block}
  .cr-board #m-floodwater,.cr-board #m-pod,.cr-board #m-doors,.cr-board .trim{display:none}
  .cr-board .zone-fill{fill:#101c26;stroke:#456b83}
  .cr-board .z-leak .zone-fill{fill:#12303f;stroke:#5aa6cd;stroke-width:2.4}
  .cr-key{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;
    font-size:11.5px;color:var(--muted)}
  .cr-key span{width:11px;height:11px;border-radius:2px;display:inline-block;margin-left:9px}
  .cr-key span:first-child{margin-left:0}
  .cr-key .k-leak{background:#12303f;border:1.5px solid #5aa6cd}
  /* 물건 그림 — 선지를 눈으로 비교하게 만드는 게 이 문제의 전부다.
     그래서 글자 옆 아이콘이 아니라, 그림이 주인공인 타일 셋으로 늘어놓는다. */
  .cr-opts.shaped{flex-direction:row;gap:8px}
  .cr-opts.shaped .cr-opt{flex:1 1 0;min-width:0;flex-direction:column;align-items:stretch;
    gap:8px;padding:11px 8px 10px;position:relative;text-align:center}
  .cr-opts.shaped .cr-opt .mk{position:absolute;top:8px;left:8px;width:14px;height:14px}
  .cr-opts.shaped .cr-opt .lb{font-size:12px;line-height:1.45;color:var(--sub);word-break:keep-all}
  .cr-opts.shaped .cr-opt.on .lb{color:#fff}
  .cr-opt .shp{display:block;width:100%;height:auto;max-height:62px;margin-top:2px}
  /* 셋 다 같은 손으로 그린 물건처럼 보여야 비교가 된다 — 어두운 몸체에 밝은 윤곽 */
  .shp .body{fill:#1b2b36;stroke:#9fb4c4;stroke-width:2.4;stroke-linejoin:round}
  .shp .seam{fill:none;stroke:#415c6d;stroke-width:1.8;stroke-linecap:round}
  .shp .spoke{fill:none;stroke:#9fb4c4;stroke-width:6;stroke-linecap:butt}
  .shp .hole{fill:#0d161d}
  .cr-opt.on .shp .body,.cr-opt.on .shp .spoke{stroke:var(--ember-b)}
  .cr-opt.on .shp .body{fill:#2e1613}
  .cr-opt.on .shp .seam{stroke:#7d3226}
  .shp .body,.shp .spoke,.shp .seam{transition:stroke .13s,fill .13s}

  .cr-q{margin-top:13px}
  .cr-q .qt{font-size:14px;font-weight:700;color:#f3ece2;margin-bottom:7px;word-break:keep-all}
  .cr-opts{display:flex;flex-direction:column;gap:6px}
  .cr-opt{display:flex;align-items:center;gap:9px;text-align:left;width:100%;
    background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:10px 12px;
    color:var(--ink);font-size:13.5px;font-family:inherit;cursor:pointer;transition:.13s;word-break:keep-all}
  .cr-opt:hover{border-color:var(--ember-b)}
  .cr-opt .mk{flex:0 0 auto;width:17px;height:17px;border-radius:0;border:1.5px solid var(--muted)}
  .cr-opt.on{border-color:var(--ember-b);background:rgba(200,68,47,.14);color:#fff}
  .cr-opt.on .mk{border-color:var(--ember-b);background:var(--ember-b);box-shadow:inset 0 0 0 3px rgba(13,12,11,.9)}
  .cr-foot{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  .cr-foot .tally{font-size:12.5px;color:var(--muted);flex:1;font-variant-numeric:tabular-nums}
  .crisis.done{border-color:var(--line)}
  .crisis.done.ok{border-color:#3a8a80;background:linear-gradient(165deg,rgba(14,32,24,.92),rgba(13,12,11,.96))}
  .cr-out{font-size:13.5px;line-height:1.85;color:#e4e3e2;word-break:keep-all;text-wrap:pretty}
  /* ★ 초록 ④ — 열렸다. 성공 계열이라 --good 을 쓴다. */
  .cr-after{margin-top:10px;padding:9px 12px;border:1px dashed var(--good);border-radius:2px;
    background:color-mix(in srgb,var(--good) 10%,transparent);color:var(--good);font-size:12.5px;line-height:1.6;word-break:keep-all}
  /* 지도 위 수위 — 잡으면 그 자리에서 멈춘다 */
  .floodbar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin:0 0 7px}
  .floodbar .fb{flex:1;height:5px;border-radius:2px;background:#16202a;overflow:hidden}
  .floodbar .fb i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#2f6f96,#5aa6cd);
    transition:width .8s ease}
  .floodbar.held .fb i{background:linear-gradient(90deg,#2f6f5a,#3a8a80)}
  .floodbar b{color:var(--cold);font-variant-numeric:tabular-nums}
  .floodbar.held b{color:#3fdfc4}

  /* 이 기기 설정 — GM 진행석도 배역처럼 여기서 켜고 끈다.
     예전엔 'GM으로 진행' 버튼이 따로 있어서 진행과 참가가 배타적으로 보였다. */
  .setbar{display:flex;align-items:center;gap:9px;margin-top:14px;flex-wrap:wrap}
  .setbar .spacer{flex:1}
  .setnote{margin-top:7px;font-size:12px;line-height:1.65;color:var(--muted);word-break:keep-all}
  .setnote b{color:var(--sub)}
  .swt{display:inline-flex;align-items:center;gap:9px;background:var(--panel2);
    border:1px solid var(--line);border-radius:2px;padding:6px 14px 6px 7px;
    color:var(--sub);cursor:pointer;font-size:13.5px;transition:.15s}
  .swt:hover{border-color:var(--case-line)}
  .swt .swk{width:34px;height:19px;border-radius:2px;background:#2a2928;
    border:1px solid var(--line);position:relative;flex:0 0 auto;transition:.18s}
  .swt .swk::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;
    border-radius:0;background:var(--muted);transition:.18s}
  .swt[aria-checked="true"]{border-color:var(--case-line);color:#fff;background:var(--case-off)}
  .swt[aria-checked="true"] .swk{background:var(--case-ink);border-color:var(--case-e)}
  .swt[aria-checked="true"] .swk::after{left:17px;background:#14120f}

  /* 구역 안 — 카드를 마주하는 자리.
     머리에 약식 지도를 붙여 "지금 배 어디에 서 있는지"를 글자 없이 색으로만 말한다. */
  /* 약식 지도는 팝업 머리 안에 든다 — 제목과 같은 줄에서 위아래 가운데를 맞춘다 */
  .mhead .minimap{align-self:center}
  .minimap{flex:0 0 auto;width:208px;border:1px solid var(--line);border-radius:2px;
    overflow:hidden;background:#100f0d}
  .minimap svg{width:100%;height:auto;display:block}
  /* 동선 토글 — 지도 위 오른쪽 아래 구석에 작게 앉는다 */
  .mapways{position:absolute;right:8px;bottom:8px;z-index:3;
    font:600 11px/1 inherit;letter-spacing:.02em;
    background:rgba(12,11,9,.82);color:var(--sub);
    border:1px solid var(--line);border-radius:2px;padding:6px 9px;cursor:pointer}
  .mapways.on{color:var(--ember-b,#e0663c);border-color:currentColor}
  .mapways:focus-visible{outline:2px solid var(--cold);outline-offset:2px}
  .minimap text{display:none}
  .minimap .trim,.minimap #m-floodwater,.minimap #m-pod,.minimap #m-doors,.minimap #m-leak{display:none}
  .minimap.podon #m-pod{display:block}
  .minimap .hull{stroke:#6b655c;stroke-width:2}
  .minimap .zone-fill{fill:#1c1a17;stroke:#403b34;stroke-width:1.2}
  .minimap .z-here .zone-fill{fill:var(--gold);fill-opacity:.88;stroke:var(--gold-b);stroke-width:2.6}
  /* 좁은 화면에서는 폭을 줄여 제목 옆에 세운다 — 칸 여섯 개는 이 크기에서도 읽힌다 */
  @media(max-width:560px){ .minimap{width:112px} }

  .zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:9px}
  .zcard{display:flex;flex-direction:column;gap:7px;background:var(--panel2);
    border:1px solid var(--line);border-radius:2px;padding:13px}
  .zcard .zc-spot{font-size:13px;font-weight:700;color:var(--ink);word-break:keep-all}
  .zcard .zc-body{font-size:12.5px;color:var(--sub);flex:1}
  .zcard .zc-q{color:var(--muted)}
  .zcard .zc-off{font-size:12px;color:var(--muted);text-align:center;padding:6px}
  .zcard.hand{border-color:var(--gold)}
  .zcard.pub{border-color:var(--cold)}
  .zcard.taken{border-color:var(--tc);opacity:.72}
  .zcard.lock{opacity:.55}

  /* 배치도 — 인라인 SVG. plain은 글자를 지운 레이아웃, nopod은 포드를 감춘다. */
  /* 초상이 아직 없는 자리 — 8비트 플레이스홀더(위 .imgslot 규칙) 위에 이름 첫 글자를
     픽셀 간판처럼 세운다. 배역색이 있으면 그 색으로 물든다. */
  .por.noimg::after{content:attr(data-emo);position:absolute;inset:0;display:grid;place-items:center;
    font-family:var(--mono);font-size:46px;font-weight:700;letter-spacing:.06em;
    color:var(--rc,var(--cold));opacity:.5;text-shadow:2px 2px 0 rgba(0,0,0,.7)}
  .rc .por img.pt{width:100%;height:100%;object-fit:cover;display:block}
  .por img.pt.flip,.bc-av img.pt.flip,img.pt.flip{transform:scaleX(-1)}
  /* 초상 크롭 — 원본(765×1024) 오른쪽 아래에 생성기 워터마크(별)가 박혀 있다.
     네 장 모두 같은 자리다: 가로 83.9~89.2%, 세로 88.0~91.9%. 액자와 원본의 비율이
     거의 같아서(3:4 대 0.747) object-position 만으로는 그 모서리가 안 잘린다 —
     확대해서 밖으로 밀어낸다. --pz 는 배율, --pf 는 «잘라낸 창의 위 가장자리가 원본의
     어느 높이(%)인가». 보이는 세로 구간은 [f(1−1/z), f+(1−f)/z] 이고 값은 cropVars()가
     배역마다 실어 준다(아래 PORTRAIT_CROP). 좌우 뒤집기는 --pfx 로 같이 태운다 —
     위 .flip 규칙이 transform 을 통째로 덮어써서 확대가 날아가던 자리다.
     이 규칙은 .flip 줄보다 뒤에 와야 한다(같은 특정도라 순서로 이긴다). */
  .rc .por img.pt,.ava.cover img.pt,.ava.lg img.pt{
    transform:scaleX(var(--pfx,1)) scale(var(--pz,1.55));
    transform-origin:50% calc(var(--pf,12) * 1%)}
  .rc .por img.pt.flip,.ava.cover img.pt.flip,.ava.lg img.pt.flip{--pfx:-1}
  /* ★ 초록 ④ — 해금 */
  .unlocknote{margin-top:10px;padding:9px 12px;border:1px dashed var(--good);border-radius:2px;
    background:color-mix(in srgb,var(--good) 10%,transparent);color:var(--good);font-size:12.5px;line-height:1.55}
  .unlocknote b{color:#fff}
  /* 지도 위 포드 포인터 — 누르면 인증코드를 넣는다 */
  .podmark .pm-halo{fill:color-mix(in srgb,var(--good) 16%,transparent);stroke:var(--good);stroke-width:1.2}
  .podmark .pm-dot{fill:var(--good);opacity:.9}
  .podmark .pm-tick{display:none}
  .podmark .pm-halo{animation:podPing 2.4s ease-in-out infinite}
  @keyframes podPing{0%,100%{opacity:.5;r:13}50%{opacity:1;r:17}}
  .podmark.ok .pm-halo{fill:rgba(63,200,185,.18);stroke:#3fbfae;animation:none;opacity:1}
  .podmark.ok .pm-dot{fill:#0d1a19;stroke:#3fbfae;stroke-width:1.4}
  .podmark.ok .pm-tick{display:block;fill:none;stroke:#3fbfae;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  /* 마지막 10초 — 다른 건 아무것도 못 하게 화면을 덮는다 */
  .podrush{position:fixed;inset:0;z-index:95;display:grid;place-items:center;
    background:rgba(20,4,3,.86);backdrop-filter:blur(4px);animation:prIn .18s ease}
  @keyframes prIn{from{opacity:0}to{opacity:1}}
  .podrush .pr-box{width:min(88vw,340px);text-align:center;padding:26px 22px;
    border:1px solid var(--ember-b);border-radius:2px;background:linear-gradient(170deg,#2a100d,#160a09);
    box-shadow:4px 4px 0 rgba(0,0,0,.6)}
  .podrush .pr-k{font-size:11px;letter-spacing:.24em;color:var(--ember-b);font-weight:800}
  .podrush .pr-t{font-family:var(--pix);font-size:21px;font-weight:800;
    color:#fff;margin-top:9px}
  .podrush .pr-c{margin:16px 0 6px;display:flex;align-items:baseline;justify-content:center;gap:5px}
  .podrush .pr-c b{font-size:46px;line-height:1;color:var(--ember-b);font-variant-numeric:tabular-nums}
  .podrush .pr-c span{font-size:13px;color:var(--sub)}
  .podrush .pr-n{font-size:12.5px;color:#e0b8b2;line-height:1.7;margin-bottom:16px}
  .podrush .btn{width:100%;justify-content:center;padding:13px}
  /* 그날 밤 표 — 시각 · 자리 · 한 일. 기억이 없는 칸은 끊어 보인다. */
  .ntl{margin-top:14px}
  .nt-r{display:grid;grid-template-columns:auto 1fr;gap:2px 11px;padding:10px 0;
    border-bottom:1px solid var(--line);position:relative}
  .nt-r.last{border-bottom:0}
  .nt-t{grid-row:1/3;min-width:52px;max-width:96px;
    font-family:var(--pix);font-size:12px;font-weight:700;
    color:var(--rc,var(--gold-b));line-height:1.5;padding-top:2px;white-space:nowrap}
  .nt-r.gap .nt-t{font-size:11px;white-space:normal;line-height:1.45}
  .nt-l{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.02em}
  .nt-w{font-size:14px;line-height:1.75;color:#dcdad7;word-break:keep-all}
  .nt-r.gap{border-left:2px dashed var(--ember-b);padding-left:11px;margin-left:-2px;
    background:linear-gradient(90deg,rgba(200,68,47,.08),transparent 60%)}
  .nt-r.gap .nt-t{color:var(--ember-b)}
  .nt-r.gap .nt-l{color:var(--ember-b)}
  .nt-r.gap .nt-w{color:#e8c4be}
  .podwarn{margin-top:10px;padding:9px 12px;border:1px solid rgba(200,68,47,.45);
    border-radius:2px;background:rgba(200,68,47,.1);color:#f2d7d1;font-size:12.5px;line-height:1.55}
  .podwarn b{color:var(--ember-b)}
  .mapwrap{position:relative;width:100%;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:#100f0d}
  /* 지도 그림이 없는 사건 — 빈 상자를 남겨두면 «뭔가 안 뜬 화면»으로 읽힌다. 접는다. */
  .mapwrap.nomap{display:none}
  .mapwrap svg{width:100%;height:auto;display:block}
  .mapwrap.plain text{display:none}
  .mapwrap.nopod #pod{display:none}

  /* 페이즈 전환 시네마틱 오버레이 */
  #phaseFx{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,rgba(10,9,8,.86),rgba(5,4,3,.97));opacity:0}
  #phaseFx.on{display:flex}
  #phaseFx .fx-in{max-width:82vw;text-align:center;transform:translateY(0)}
  #phaseFx .fx-kick{font-size:12px;letter-spacing:.5em;color:var(--ember-b);margin-bottom:18px;text-transform:uppercase}
  #phaseFx .fx-name{font-family:var(--pix);font-weight:700;color:#efe7db;
    font-size:clamp(34px,8vw,72px);letter-spacing:.14em;line-height:1.1;text-shadow:0 8px 44px rgba(0,0,0,.85)}
  #phaseFx .fx-line{margin-top:22px;color:#c9c8c7;font-size:clamp(14px,2.3vw,18px);font-style:italic;line-height:1.8;min-height:1.2em}
  @keyframes fxFade{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
  @keyframes fxRise{0%{opacity:0;transform:translateY(26px);filter:blur(7px);letter-spacing:.34em}100%{opacity:1;transform:none;filter:blur(0)}}
  #phaseFx.play{animation:fxFade var(--fxdur,2.8s) ease forwards}
  #phaseFx.play .fx-in{animation:fxRise .9s cubic-bezier(.16,.8,.24,1) both}
  /* 페이즈별 결 */
  #phaseFx.k-open{--fxdur:3.2s}
  #phaseFx.k-invest .fx-kick{color:var(--cold)}
  #phaseFx.k-invest .fx-name{color:#e6dfd6}
  #phaseFx.k-talk .fx-kick{color:var(--gold-b)}
  /* 교내방송(인터루드가 있는 페이즈) — 방송 라벨 + 스캔라인 깜빡임 */
  #phaseFx.pa .fx-kick::after{content:"  ·  " attr(data-pa);opacity:.85}
  #phaseFx.pa .fx-line{color:#bff5dd;font-style:normal;letter-spacing:.04em}
  @keyframes paFlicker{0%,100%{opacity:1}42%{opacity:.62}44%{opacity:1}70%{opacity:.5}72%{opacity:1}}
  #phaseFx.pa.play .fx-line{animation:paFlicker 2.4s steps(1) both}
