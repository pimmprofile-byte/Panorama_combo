  #phaseFx.pa::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.03) 3px 4px)}
  /* 종막 — 붉은 긴장 */
  #phaseFx.k-final{background:radial-gradient(120% 90% at 50% 45%,rgba(40,8,8,.9),rgba(4,3,2,.98))}
  #phaseFx.k-final .fx-kick,#phaseFx.k-final .fx-name{color:#f0c9c2}
  #phaseFx.k-final .fx-name{text-shadow:0 0 40px rgba(200,68,47,.5)}
  /* 진상 공개 — 여명 */
  #phaseFx.k-reveal{background:linear-gradient(0deg,rgba(0,60,38,.5),rgba(7,6,5,.96) 60%)}
  #phaseFx.k-reveal .fx-kick{color:var(--cold)}
  #phaseFx.k-reveal .fx-name{color:#f0ebe4;text-shadow:0 0 50px rgba(235,230,220,.4)}

  /* ══ 게임기 케이스의 «구조» ═══════════════════════════════════════
     버튼과 제목에서 색을 걷어내면 화면이 허전해진다. 그 자리를 색이 아니라
     구조로 채운다 — 아케이드 캐비닛이나 휴대용 게임기의 «케이스» 를 떠올리면 맞다.
     전부 CSS 한 겹이고 그림 파일이 늘지 않는다(오프라인 배포).
     이 블록은 스타일시트 맨 끝에 둔다 — 앞의 규칙 위에 한 겹 얹는 성격이라
     순서로 이기게 두는 편이 나중에 읽기도 쉽다. */

  /* ① 판마다 안쪽 실선 한 줄 — 케이스 뚜껑의 «단» 이다. 바깥은 어두운 테,
        안쪽은 아주 옅은 밝은 선. 두 줄이 겹치면 판이 두께를 가진 것처럼 선다. */
  .card,.turnbar,.gm-guide,.zcard,.gcell,.dc,.nq,.ask-q,.nt-opt,.cr-opt,.po{
    box-shadow:inset 0 1px 0 rgba(255,255,255,.045),inset 0 0 0 1px rgba(0,0,0,.28)}
  /* 창이 바탕에서 떠 있게 하는 오프셋 그림자는 이제 창틀(.win)이 진다 —
     .box 는 그 안의 어두운 화면이라 파인 안쪽 그림자만 남는다. */
  .modal .box{box-shadow:inset 2px 2px 0 rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.3)}
  /* ② 네 귀의 픽셀 코너 — 케이스에 박힌 나사머리 자리. 가상요소를 안 쓴다
        (.bigcard.role::before 처럼 이미 임자가 있는 자리가 많다). 배경 레이어 넷이면 된다. */
  .card,.turnbar,.gm-guide{
    background-image:
      linear-gradient(var(--case-line),var(--case-line)),
      linear-gradient(var(--case-line),var(--case-line)),
      linear-gradient(var(--case-line),var(--case-line)),
      linear-gradient(var(--case-line),var(--case-line));
    background-size:2px 2px;background-repeat:no-repeat;
    background-position:4px 4px,calc(100% - 4px) 4px,4px calc(100% - 4px),calc(100% - 4px) calc(100% - 4px)}
  /* 전체화면 탭으로 열리는 창은 «판» 이 아니라 화면 그 자체다 — 코너도 단도 없다 */
  .modal.overdock .box{background-image:none;box-shadow:none}
  /* ③ 위아래 띠 = 케이스의 위판·아래판. 안쪽으로 밝은 실선 한 줄을 물려
        본문이 띠 «사이» 에 끼워진 것처럼 보이게 한다. */
  /* 베이지 케이스가 되면서 «밝은 실선»의 값이 뒤집혔다 — 어두운 띠에서는 흰 선이 단이었지만
     베이지 판에서는 그게 안 보인다. 위는 밝은 판(--case-h), 아래는 파인 선으로 잡는다. */
  .chead{box-shadow:inset 0 1px 0 var(--case-h),inset 0 -1px 0 rgba(0,0,0,.12)}
  .dock{box-shadow:inset 0 1px 0 var(--case-h)}
  /* ④ 눈금 — 띠 아래에 8px 자국을 아주 옅게 새긴다. 계기판의 스케일 자국이다.
     베이지 위라 흰색이 아니라 «파낸 자국»(검정 옅게)이다. */
  .chead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;pointer-events:none;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 1px,transparent 1px 8px)}
  .chead{position:relative}
  /* ⑤ 눈썹라벨 앞의 픽셀 블록 — 색을 안 쓰고도 «여기서 한 덩이가 시작된다» 를 말한다 */
  .bc-eyebrow::before,.mh-eb::before,.nt-kick::before,.cr-kick::before{
    content:"";display:inline-block;width:6px;height:6px;margin-right:7px;vertical-align:1px;
    background:currentColor;opacity:.55}
  /* ⑥ 알약·칩은 케이스에 새긴 홈이다 — 채우지 않고 한 줄 파낸 것처럼 */
  .pill{box-shadow:inset 0 1px 0 rgba(0,0,0,.35)}

  @media (prefers-reduced-motion: reduce){
    .modal .box.reveal,.frag,#phaseFx.play,#phaseFx.play .fx-in{animation-duration:.01ms!important}
  }

  /* ── 나이 적기 ─────────────────────────────────────────────────────
     이 칸은 「그 배역을 맡은 사람」의 화면에만 뜬다. 남의 화면에는 자리도 없다.
     8bit 톤 — 파낸 홈처럼 안쪽 그림자만 주고 둥글리지 않는다.
     색은 그 배역의 키컬러(--rc)를 받는다. 배역을 여기에 박지 않는다 — 다른 사건에서는
     다른 배역이 적는다. 안 넘어오면 예전처럼 금색으로 선다. */
  .agebox{--rc:var(--gold);display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;
    padding:8px 10px;border:1px solid var(--rc);
    background:color-mix(in srgb,var(--rc) 10%,transparent)}
  .agebox .k{font-size:11px;color:var(--rc);letter-spacing:.04em;flex:0 0 auto;font-weight:700}
  .agebox .d{flex:1 0 100%;font-size:11px;color:var(--sub);line-height:1.5}
  .agebox .d b{color:var(--rc)}
  /* 이미 적은 뒤 — 입력칸도 단추도 없다. 숫자만 박혀 있다. */
  .agebox.done{background:color-mix(in srgb,var(--rc) 7%,transparent)}
  .agebox .agefix{font-family:var(--pix);font-size:18px;font-weight:800;letter-spacing:.06em;
    color:var(--rc);padding:2px 10px;border:1px solid color-mix(in srgb,var(--rc) 45%,var(--line));
    background:#0e0d0c;box-shadow:inset 0 2px 0 rgba(0,0,0,.45)}
  /* 나이칸은 좁다 — 16px 로 올리면서 폭을 4px 늘리고 안쪽 여백을 한 칸 줄여 균형을 맞춘다 */
  .agein{width:78px;padding:4px 6px;font-family:inherit;font-size:16px;text-align:center;
    color:var(--ink);background:#0e0d0c;border:1px solid var(--line);border-radius:0;
    box-shadow:inset 0 2px 0 rgba(0,0,0,.45)}
  .agein:focus{outline:none;border-color:var(--rc,var(--gold))}
  .agebtn{padding:5px 11px;font-family:inherit;font-size:12px;cursor:pointer;
    color:#12100e;background:var(--rc,var(--gold));
    border:1px solid color-mix(in srgb,var(--rc,var(--gold)) 60%,#fff);border-radius:0;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.28)}
  .agebtn:active{box-shadow:inset 0 2px 0 rgba(0,0,0,.28)}

  /* ── 읽는 글은 프리텐다드로 ────────────────────────────────────
     조사카드에서 «이어 읽는 글»만 갈아끼운다. 제목·이름표·숫자·라벨은 비트맵 그대로다 —
     그건 이 화면의 얼굴이다. 내 정보(--body 가 붙은 세 자리)는 손대지 않는다.
     한 자리에 모아 둬야 나중에 되돌릴 때도 이 덩어리만 보면 된다. */
  .sec .b,                    /* 카드창 본문 */
  .bigcard.clue .bc-body,     /* 손패에서 넘겨 읽는 카드 본문 (롤카드 .bc-body 는 제외) */
  .mynote .tx,                /* 내 눈에만 걸리는 것 · 내가 찾던 것 */
  .cnote,                     /* 카드 아래 해석 */
  .unlocknote,                /* 이 카드를 공개하면… */
  .puz-q,.puz-hint,.puz-dead, /* 수수께끼 물음 · 힌트 · 잠김 안내 */
  .zcard .zc-body,.zc-q,      /* 구역 목록·자리 안내창의 줄글 */
  .panel-note                 /* 카드 안팎의 안내문 */
  {font-family:var(--read)}
  /* 내 정보는 그대로 둔다 — 안내문 한 줄까지 프리텐다드가 되면 그 화면만 결이 달라진다 */
  #sheetModal .panel-note{font-family:var(--pix)}

  /* ── QA 검수 모드 ─────────────────────────────────────────────────
     실제 판에서 이게 보이면 사고다. 그래서 게임의 어느 색과도 안 겹치는 자홍색 경고띠로
     세우고, 「지금 누구로 보고 있는가」를 늘 켜 둔다 — 검수하다 헷갈리는 게 제일 위험하다. */
  /* QA 띠 — 예전엔 마젠타였는데 데이먼의 키컬러가 마젠타가 됐다. 배역색과 겹치면
     「이 화면은 데이먼의 것」으로 잘못 읽힌다. 어느 배역의 것도 아닌 «개발자 테이프»로
     바꾼다 — 검정 바탕에 베이지 빗금. 90년대 결이면서 배역색과 절대 안 겹친다. */
  .qabar{--qa:#e9e2cd;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:6px 10px;color:var(--qa);
    background:repeating-linear-gradient(45deg,#141310 0 9px,#211f18 9px 18px);
    border-bottom:2px solid var(--qa);
    font-size:11px;letter-spacing:.02em}
  .qabar[hidden]{display:none}
  .qabar .qa-tag{flex:0 0 auto;padding:2px 7px;border:1px solid var(--ink2,#12130f);
    color:#12130f;background:var(--qa);font-weight:700;letter-spacing:.08em}
  .qabar .qa-lbl{flex:0 0 auto;color:var(--qa);opacity:.7}
  .qabar .qa-r{flex:0 0 auto;padding:3px 9px;border:1px solid #4d4a40;background:#100f0c;
    color:#b8b2a2;font-family:inherit;font-size:11px;cursor:pointer;line-height:1.2}
  /* 지금 보고 있는 배역만 그 사람 색으로 켠다 — 띠에서 색이 나는 자리는 여기뿐이다 */
  .qabar .qa-r.on{border-color:var(--rc,var(--qa));color:#0b0b09;background:var(--rc,var(--qa));
    font-weight:700}
  .qabar .qa-r:disabled{opacity:.4;cursor:default}
  .qabar .qa-sp{flex:1 1 auto}
  .qabar .qa-x{flex:0 0 auto;padding:3px 8px;border:1px solid #4d4a40;background:transparent;
    color:var(--qa);font-family:inherit;font-size:11px;cursor:pointer}
  /* 시점 칩과 자동조사 단추는 «한 배역의 것» 이라, 줄이 접혀도 갈라지면 안 된다 */
  .qabar .qa-g{flex:0 0 auto;display:inline-flex;align-items:stretch}
  /* 자동조사 — 칩에 바로 붙여 그 배역의 것임을 못 박고, 테두리는 그 사람 색으로 얇게 */
  .qabar .qa-a{flex:0 0 auto;padding:3px 7px;margin-left:-1px;
    border:1px solid var(--rc,#4d4a40);background:#100f0c;
    color:var(--rc,#b8b2a2);font-family:inherit;font-size:10.5px;cursor:pointer;line-height:1.2}
  .qabar .qa-a:hover{background:var(--rc,#4d4a40);color:#0b0b09}
  .qabar .qa-a:disabled{opacity:.35;cursor:default}
  /* 전원 자동조사는 제일 자주 누른다 — 나머지 잡버튼과 섞이지 않게 채워둔다 */
  .qabar .qa-x.hot{border-color:var(--qa);background:rgba(233,226,205,.14);font-weight:700}
  /* 조사 페이즈가 아니면 흐리게 — 감추지는 않는다. 눌리면 서버가 준 말이 뜬다. */
  .qabar .qa-a.dim,.qabar .qa-x.dim{opacity:.42}
  /* 자동조사 결과 — 무엇을 열었는지 순서대로 */
  .qa-log{margin:0;padding-left:1.5em;font-size:12.5px;line-height:1.85;color:var(--sub)}
  .qa-log li{word-break:keep-all}
  /* 로비 쪽 안내판 — 세 자리를 한 기기가 쥐는 문이 여기 하나뿐이다 */
  .qapanel{margin:10px 0;padding:11px 12px;border:2px solid #c9c2ab;background:#16150f}
  .qapanel .qp-t{color:#efe9d6;font-weight:700;font-size:13px;margin-bottom:4px}
  .qapanel .qp-d{color:#b8b2a2;font-size:12px;line-height:1.6}
  .qapanel .qp-b{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
  /* 현황판 칸에 붙는 엿보기 딱지 */
  .dc{position:relative}
  /* 이름표가 오른쪽 위에 서게 되면서 엿보기 딱지는 오른쪽 «아래» 로 내려간다 */
  .dc .dc-qa{position:absolute;right:6px;bottom:6px;padding:1px 5px;font-size:10px;
    border:1px solid #c9c2ab;color:#efe9d6;background:#141310;z-index:2}
  /* 아이템 수수께끼 — 조사턴을 안 쓰는 자리라, 조사 카드와 결이 달라야 한다.
     파낸 홈(눌린 판) 위에 물음이 새겨져 있고 그 아래에 입력 한 칸. */
  .puz-q{padding:14px 15px;border:1px solid var(--line);background:var(--bg2);
    box-shadow:inset 2px 2px 0 rgba(0,0,0,.5);font-size:15px;line-height:1.8;
    color:var(--ink);word-break:keep-all;white-space:pre-line}
  .puz-in{display:flex;gap:8px;margin-top:12px}
  .puz-in input{flex:1 1 auto;min-width:0;background:var(--bg2);border:1px solid var(--line);
    color:var(--gold-b);font-family:var(--pix);font-size:16px;padding:10px 12px;letter-spacing:.06em;
    box-shadow:inset 2px 2px 0 rgba(0,0,0,.5)}
  .puz-in input:focus{outline:none;border-color:var(--case-line)}
  /* 세 번 틀려 잠긴 자리 — 답 칸이 있던 자리를 그대로 메운다. 「입력이 사라졌다」가
     아니라 「여기는 내 자리가 아니다」로 읽혀야 넘길 생각을 한다. */
  .puz-dead{margin-top:12px;padding:12px 13px;border:1px solid var(--ember);
    background:rgba(200,68,47,.10);color:var(--ember-b);
    font-size:13.5px;line-height:1.6;word-break:keep-all;box-shadow:var(--shadow-sm)}
  .puz-msg{min-height:1.3em;margin-top:9px;font-size:13px;color:var(--ember-b)}
  .puz-note{margin-top:4px;font-size:12px;color:var(--muted)}
  .puz-hint{margin-top:10px;padding:10px 12px;border-left:2px solid var(--cold);
    background:rgba(195,186,176,.06);font-size:13.5px;line-height:1.7;color:var(--sub);word-break:keep-all}
  /* 현황판의 수수께끼 칸은 «따로 없다». 눌러보기 전에는 다른 카드와 구분이 안 되는
     것이 이 판의 규칙이다 — 점선도, 열쇠도, 다른 색도 안 붙인다(.dc.puz 삭제).
     자물쇠 여부는 데이터(catalog.locked)에 그대로 남아 있어 누르면 수수께끼가 뜬다. */

  /* ── 열쇠 표시 ─────────────────────────────────────────────────
     퍼즐카드는 조사턴으로 여는 자리가 아니다. 열쇠를 붙여 «수수께끼로 여는 자리»
     라는 걸 못 박는다. SVG 에셋은 새로 만들지 않는다 — 비트맵을 box-shadow 로 찍는다.

     ★ 예전 판은 5×9 (10×18px) 세로 열쇠였다. 글자가 12~13px 인 줄에 세로로 18px 짜리가
       서니 그 자리만 키가 커 보였다. 대각선으로 눕히되, transform:rotate 로 돌리지
       않는다 — box-shadow 로 찍은 점을 45도로 돌리면 래스터가 안티에일리어싱을 먹여
       도트가 뭉갠다. 8비트 화면에서 흐린 점 하나는 규칙이 깨진 것으로 읽힌다.
       그래서 «비스듬한 열쇠를 다시 찍는다» — 계단으로 사선을 그리는, 도트아트가
       원래 쓰는 방법이다. 한 칸 2px, 7×7 = 14×14px 로 주변 글자보다 살짝 크다.
         █ █ █ . . . .      고리 — 3×3 속 빈 사각. 마름모로 깎아봤더니 14px 에서는
         █ . █ . . . .      «고리»로 안 읽히고 흩어진 점으로 보였다.
         █ █ █ . . . .
         . . . █ . . .      대 — 모서리로 맞물린 점열이 곧 1px 45도 선이다
         . . . . █ . .
         . . . █ . █ .      이빨 — 대의 왼쪽 아래로 한 칸 비껴 붙은 짧은 사선
         . . . . █ . █                                                    */
  .kmk{display:inline-block;position:relative;width:14px;height:14px;flex:0 0 auto;
    vertical-align:-2px}
  .kmk::before{content:"";position:absolute;left:0;top:0;width:2px;height:2px;
    background:currentColor;
    box-shadow:2px 0,4px 0,
               0 2px,4px 2px,
               0 4px,2px 4px,4px 4px,
               6px 6px,
               8px 8px,
               6px 10px,10px 10px,
               8px 12px,12px 12px}
  /* 카드 어디에 붙어도 같은 딱지다 — 현황판 칸·큰 화면·손패가 같은 것을 본다.
     8비트라 모서리는 각지고, 그림자는 blur 없이 2px 밀린다. */
  .keytag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 6px;
    border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));
    background:rgba(0,230,147,.10);color:var(--gold-b);
    font-size:11px;font-weight:700;letter-spacing:.04em;
    box-shadow:var(--shadow-sm)}
  .keytag.cold{border-color:color-mix(in srgb,var(--cold) 45%,var(--line));
    background:rgba(195,186,176,.10);color:var(--cold)}
  /* 현황판 칸 모서리의 열쇠는 뺐다 — 조사 현황에서는 수수께끼 카드인지 알 수 없어야
     한다(눌렀을 때 자리 안내창에서 알게 된다). 딱지(.keytag)는 그 창에 그대로 남는다. */

  /* ── 조사 현황의 라운드 탭 ──────────────────────────────────────
     밤이 없고 조사가 여러 번인 판에서는, 라운드가 섞여 한 줄로 늘어서면
     «지금 뒤질 수 있는 자리» 와 «지난 라운드의 흔적» 이 구분이 안 된다.
     라운드 수는 시나리오가 정한다 — 여기에 숫자를 박아두지 않는다. */
  .dtabs{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
  .dtab{flex:1 1 0;min-width:104px;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:0;
    color:var(--sub);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
    box-shadow:var(--shadow-sm);transition:.13s}
  .dtab:hover{color:var(--ink)}

     ★ 예전에는 이 규칙이 스타일시트 한가운데 있었다. 그러면 뒤에 오는 규칙

<div id="s-lobby" class="screen on">

      진행석은 페이즈를 넘기고 <b>누가 어떤 카드를 조사했는지 마킹</b>만 합니다. 카드 내용은 보이지 않아 스포일러가 없습니다.</div>

const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
/* 롤카드의 ★ 줄 — 원고가 「★」 「★★」 「★★★」 로 세기를 적어 둔다.
   그 자리를 그 배역의 키컬러로 세운다. ★ 자체는 픽셀 네모로 다시 그린다:
   Neo둥근모에 ★ 글리프가 없어서 그대로 두면 그 글자만 다른 글꼴로 튀어나온다.
   ★가 없는 줄은 예전과 똑같이 그냥 esc() 로 나간다 — 안 건드린다. */
/* 원고는 **굵게** 를 쓴다. 여태 그대로 화면에 별 네 개가 찍혀 나왔다 —
   esc() 뒤에 한 번만 돌린다(먼저 돌리면 태그가 이스케이프된다). */
const mdB=t=>String(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
function starMark(line, lit){
  const raw=String(line==null?"":line);
  const m=/^\s*(★+)\s*/.exec(raw);
  if(!m) return mdB(esc(raw));
  const n=Math.min(3,m[1].length);
  const pips=Array.from({length:n},()=>'<i class="sxp"></i>').join("");
  return `<span class="sx s${lit?n:0}"><span class="sxm" aria-label="중요도 ${n}단계">${pips}</span>`
       + mdB(esc(raw.slice(m[0].length))) + `</span>`;
}
/* 줄 하나짜리 항목(목표·연표·팁·감출 것) — 여기서는 ★를 «세는 표시»로만 둔다.
   판까지 세우면 목록 전체가 형광펜으로 덮여서 어느 것이 더 급한지가 오히려 안 보인다. */
const starTx=t=>starMark(t,false);
/* 줄글(나의 이야기 · 오늘 일어난 일) — 여기가 진짜 강조가 필요한 자리다.
   문단 안에 ★ 줄이 섞여 있어서, 줄 단위로 잘라 그 줄만 세운다.
   문단은 예전처럼 \n 을 공백으로 이어 붙인다 — 줄바꿈이 아니라 한 문단이다. */
const storyTx=t=>String(t==null?"":t).split("\n").map(ln=>starMark(ln,true)).join(" ");
// 배역이 아닌 사람도 대화창에 앉는다 — 마부도 왕진의도 말은 한다.
const roleById=id=>(SCEN.characters||[]).find(c=>c.id===id)
                 ||(SCEN.npcs||[]).find(c=>c.id===id)
                 ||(id==="victim"?victimAsPerson():null);
/* 피해자도 이름이 있는 사람이다. 지목표에는 그도 오른다 — 스스로 그랬을 수도 있으니까. */
function victimAsPerson(){
  const v=(SCEN&&SCEN.victimCard)||{};
  return {id:"victim", name:v.name||"피해자", job:v.job||"", color:"#b9a98f", avatar:""};
}
function allPersons(){
  return [...(SCEN.characters||[]), ...(SCEN.npcs||[]), victimAsPerson()];
}
const cardCat=id=>SCEN.cardCatalog.find(c=>c.id===id);
const myRoleValid=()=>myRoleId&&STATE&&STATE.roles[myRoleId]&&STATE.roles[myRoleId].mode==="human";

async function loadScenario(){
  SCEN=await (await fetch("/api/scenario")).json();
  applyLanding();
}
function applyLanding(){
  if(!SCEN)return;
  // 로비 문안을 선택된 시나리오에서 채운다(시나리오 선택 자체는 허브 / 에서 한다)
  $("pTitle").textContent=SCEN.title; document.title=SCEN.title+" — PIMMmurderboard";
  $("lobbyScenName").textContent=SCEN.title;
  // 창 아래 상태줄 — 지금 무슨 판을 보고 있는지 한 줄로 말해준다(로비의 .statusbar 와 같다)
  const f=$("lobbyScenFoot"); if(f) f.textContent=SCEN.title;
}
/* ── 남아 있던 QA 를 스스로 정리한다 ────────────────────────────────
   qaOn 은 localStorage["pmb.qa"] 하나로만 서고, 한 번 켜면 아무도 안 껐다. 그래서
   예전 검수 때 켠 것이 그대로 남아 평범한 판에서도 화면 위에 자홍색 QA 띠가 떴다.
   부팅 때 열쇠를 한 번 확인한다 — 잠긴 창구(/api/gm)가 403 이면 조용히 내린다.
   ★ AGENT_KEY 를 안 건 서버(로컬 검수)에서는 빈 키도 통과한다. 그 판에서는 200 이
     떨어지므로 QA 가 그대로 살아 있다 — 로컬에서 검수하는 길을 막지 않는다.
   ★ 화면에는 아무 말도 안 한다. 사람이 켠 적 없는 것을 껐다고 알릴 이유가 없다.
     띠의 「QA 끄기」는 그대로 둔다 — 손으로 끄는 길도 남는다. */
/* ★ 안 통할 때 «조용히» 끄면 안 되는 경우가 있다. 두 갈래다 —
     (가) 열쇠를 넣어 본 적이 없다  → 남의 기기에 남은 찌꺼기다. 말없이 내린다.
     (나) 열쇠를 넣어 둔 적이 있다  → 사람이 일부러 켠 것이다. 말없이 내리면
          「관리자 모드 켜고 들어갔는데 아무 일도 안 일어난다」가 된다. 그 자리에서
          열쇠를 다시 받고, 그래도 안 되면 왜 안 되는지 말하고 내린다. */
async function qaVerify(){
  if(!qaOn) return;
  const ok=await qaKeyOk();
  if(ok===null) return;                 // 서버가 안 잡힌다 — 네트워크 사정으로 끄지 않는다
  if(ok) return;
  let tried=false;
  try{ tried=localStorage.getItem("pmb.gmkeyset")==="1"; }catch(e){}
  if(tried){
    banner("QA — GM 키가 이 서버에서 안 통합니다. 다시 넣어주세요.");
    if(await askGMKey()){
      if(await qaKeyOk()){ banner("QA — 열쇠 확인. 세 자리를 쥡니다."); return; }
    }
    banner("QA를 끕니다 — 열쇠가 맞아야 세 자리를 쥘 수 있습니다.");
  }
  qaOn=false; qaRole=null;
  try{ localStorage.removeItem("pmb.qa"); localStorage.removeItem("pmb.qarole"); }catch(e){}
}
/* true 통함 · false 안 통함 · null 판단 불가(서버가 안 잡힘) */
async function qaKeyOk(){
  try{ return (await fetch("/api/gm?key="+encodeURIComponent(gmKey))).status!==403; }
  catch(e){ return null; }
}
async function boot(){
  loadAssetV();          // 그림 주소에 붙일 판 표시. 늦게 와도 다음 다시 그리기에 붙는다
  try{ await loadScenario(); }
  catch(e){ banner("서버 연결 실패"); return; }
  await qaVerify();
  await poll();
  // QA 모드로 막 들어왔으면 좌석을 저절로 쥔다. 예전엔 「세 자리 모두 쥐기」를 손으로
  // 눌러야 해서, 들어와도 평소와 똑같은 배역 선택 화면이 떠 있었다 —
  // 「관리자 모드 켜고 들어갔는데 달라진 게 없다」로 읽히던 자리다.
  if(qaOn && !(STATE&&STATE.started)){
    const held=qaSeats().filter(id=>(((STATE&&STATE.roles)||{})[id]||{}).mode==="human").length;
    if(held<qaSeats().length) await qaClaimAll();
  }
  setInterval(poll,1500);
  // 마지막 10초 동안에는 1.5초가 너무 길다 — 그때만 촘촘히 본다.
  setInterval(()=>{ const pl=STATE&&STATE.podLaunch; if(pl&&!pl.closed) poll(); },700);
}
/* 방이 갈렸는지 본다. 서버가 방을 새로 열면 roomId가 바뀌는데, 이 기기에는 지난 판의
   배역과 「어디까지 읽었다」가 그대로 남아 있다. 그 상태로 붙으면 없는 배역을 붙들고
   화면이 반쯤 비어 보인다 — 중복해서 방을 연 뒤 «이게 아까 그 방인가?»가 되던 자리다. */
function checkRoomSwitch(){
  const rid=(STATE&&STATE.roomId)||"";
  if(!rid) return false;
  let known=null;
  try{ known=localStorage.getItem("pmb.room"); }catch(e){}
  if(known===rid) return false;
  try{ localStorage.setItem("pmb.room",rid); }catch(e){}
  if(!known) return false;                 // 이 기기에서 처음 보는 방 — 갈린 게 아니다
  wipeLocal(true);
  try{ localStorage.setItem("pmb.room",rid); }catch(e){}   // wipeLocal이 지운 것을 되돌린다
  banner("새 방이 열렸습니다 — 지난 판 기록을 지우고 배역 선택으로 돌아갑니다.");
  go("lobby");
  return true;
}

async function poll(){
  // clientId를 넘겨야 서버가 isHost를 판별한다(호스트 전용 UI가 여기에 달려 있다)
  // QA 검수 모드에서만 「어느 배역의 시점인가」를 얹는다. 세 좌석을 한 clientId가 쥐고 있으면
  // 서버는 첫 자리밖에 못 고르기 때문이다. 열쇠가 없으면 서버가 이 두 값을 그냥 무시한다.
  // 열쇠는 QA 모드면 늘 싣는다. 예전엔 「어느 배역으로 보는가」가 정해진 뒤에만 실어서,
  // 좌석을 쥐기 전 로비에서는 서버가 이 요청을 열쇠 없는 참가자로 보고 isHost를 안 줬다 —
  // 호스트 UI(시작·다음 막)가 그때만 사라졌다. roleId 는 정해졌을 때만 얹는다.
  const qaQ=qaOn?((qaRole?("&roleId="+encodeURIComponent(qaRole)):"")+"&key="+encodeURIComponent(hostKey())):"";
  try{ STATE=await (await fetch("/api/state?clientId="+encodeURIComponent(clientId)+(gmOn?"&gm=1":"")+qaQ)).json(); }catch(e){ return; }
  if(checkRoomSwitch()) return;
  // 다른 사람이 시나리오를 바꿨으면(허브에서) 이 기기도 새 시나리오로 갱신
  if(STATE&&SCEN&&STATE.scenarioId&&STATE.scenarioId!==SCEN.scenarioId){ try{ await loadScenario(); }catch(e){} }
  /* 구역이 늘었으면 대본을 다시 받는다. 서버는 «아직 열리지 않은 구역»을 대본에서 통째로
     빼서 보낸다 — 회색으로 걸어두면 그 칸이 「저기 뭔가 더 있다」를 공지하기 때문이다.
     자물쇠가 열리는 순간 그 목록이 늘어나고, 그 사실은 state 의 zoneSig 로만 알 수 있다.
     이 한 박자가 없으면 새 구역의 카드가 손에 들어왔는데 카탈로그에는 없는 순간이 생긴다. */
  if(STATE&&SCEN&&STATE.zoneSig!=null&&SCEN.zoneSig!=null&&STATE.zoneSig!==SCEN.zoneSig){
    try{ await loadScenario(); }catch(e){}
  }
  // 밤이 지나면 «덱 자체»가 바뀐다 — 그날 밤 다녀간 자리의 카드가 잠에서 깬다.
  // 카탈로그를 첫 화면에서 한 번만 받아두면 그 세 장이 지도에도 조사 현황에도 안 나온다.
  if(STATE&&SCEN&&STATE.night&&STATE.night.done&&!deckAfterNight){
    deckAfterNight=true; try{ await loadScenario(); }catch(e){}
  }
  if(myRoleValid()){ try{ myHand=(await (await fetch("/api/hand/"+myRoleId+"?clientId="+encodeURIComponent(clientId))).json()).hand||[]; }catch(e){} }
  else myHand=[];
  applyState();
}
function go(name){ if(name==="gm"&&!gmOn)name="lobby"; scr=name; ["lobby","play","gm"].forEach(s=>{ const e=$("s-"+s); e.classList.remove("on"); e.style.display=""; }); $("s-"+name).classList.add("on"); if(name==="play"||name==="gm")$("s-"+name).style.display="flex"; lastRev=-1; fxSeq=null; renderPanel._sig=null; if(name==="gm")gmSeenMarks=null; if(name==="play")handSeen=null; applyGM(); applyState(); }

/* ── GM 진행석 — 배역과 배타적이지 않은 토글이다 ─────────────────────
   호스트가 곧 GM인 자리가 많고, GM이 배역까지 맡는 자리도 있다. 그래서 진행석은
   '들어가는 화면'이 아니라 이 기기에 켜두는 스위치고, 켜져 있으면 두 화면을 오간다. */
let seated=false;   // 시작 직후 자기 화면으로 한 번만 밀어주기 위한 빗장
let gmKey=localStorage.getItem("pmb.gmkey")||"";
/* 호스트 권한이 필요한 창구에 실어 보내는 열쇠.
   QA 검수는 «혼자 세 좌석을 쥐고 판을 굴려보는» 모드라 진행 권한이 늘 있어야 하는데,
   서버는 열쇠가 «비어 있지 않을 때만» 그 요청을 호스트로 본다(_key_host). GM 키를 따로
   안 넣고 들어온 로컬 검수판에서 여기가 빈 문자열이라 시작·다음 막 단추가 통째로 안 떴다.
   AGENT_KEY를 건 배포본에서는 이 대체값이 그냥 틀린 열쇠라 아무것도 안 열린다 —
   지금과 똑같다. 열쇠 없는 평범한 판(qaOn=false)은 이 함수를 지나가지도 않는다. */
function hostKey(){ return gmKey || (qaOn?"qa":""); }
let gmOn=localStorage.getItem("pmb.gm")==="1";
async function askGMKey(){
  const k=await askText({title:"GM 키", body:"로컬에서 인터넷 없이 진행하면 비워둔 채로 확인을 누르세요.\n클라우드 배포본이면 배포 때 넣은 AGENT_KEY를 적습니다.",
                         value:gmKey||"", ok:"확인"});
  if(k===null) return false;        // 취소
  gmKey=k.trim(); localStorage.setItem("pmb.gmkey",gmKey); localStorage.setItem("pmb.gmkeyset","1");
  return true;
}
async function toggleGM(){
  if(gmOn){
    gmOn=false; localStorage.removeItem("pmb.gm");
    if(scr==="gm") go(myRoleValid()?"play":"lobby"); else applyGM();
    return;
  }
  // 키는 처음 켤 때만 묻는다. 틀렸으면 '키 바꾸기'로 다시 넣는다.
  if(localStorage.getItem("pmb.gmkeyset")!=="1" && !await askGMKey()) return;
  gmOn=true; localStorage.setItem("pmb.gm","1"); applyGM();
}
/* ── 진행석을 로비에서 «권하지 않는» 사건 ──────────────────────────
   이 저장소는 사건 여럿을 돌리는 틀이다. 어떤 사건은 진행석(GM 마킹 보드)이 필요하고
   어떤 사건은 아니다. 「데이의 규칙」은 셋이 각자 기기로 도는 판이라 진행석을 안 쓴다.
   ★ 기능을 죽이지 않는다 — gmOn 도, #s-gm 도, 진행 확인창의 gmOn 분기도 그대로다.
     로비에서 «문만» 안 낸다. 이미 켜 둔 기기(pmb.gm=1)는 그대로 쓸 수 있다.
   ★ 서버가 이 값을 안 내려준다. /api/scenario 에 그런 칸이 없어(2026-08-05 확인:
     alibiHead…zoneSig 어디에도 없다) 클라이언트 상수로 둔다. 서버가 나중에
     useGM 같은 칸을 실어주면 이 상수를 지우고 그 값을 읽으면 된다.
   ★ 되살리는 법 — 아래 목록에서 그 사건 id 를 빼면 문이 다시 선다. */
const GM_SEAT_OFF=["rule_the_day"];
function gmSeatOffered(){ return GM_SEAT_OFF.indexOf((SCEN&&SCEN.scenarioId)||"")<0; }
/* 진행석 상태를 화면 곳곳에 반영한다 — 스위치, 화면 전환 버튼, 로비 안내 */
function applyGM(){
  // 이 사건에서 안 쓰기로 한 문은 통째로 접는다. 이미 켜 둔 기기에서는 스위치를 남겨
  // 끌 수 있게 한다 — 문을 감추면서 나가는 길까지 막으면 갇힌다.
  const off=!gmSeatOffered()&&!gmOn;
  const sb=$("gmSetbar"); if(sb) sb.style.display=off?"none":"";
  const sn=$("gmSetnote"); if(sn) sn.style.display=off?"none":"";
  const t=$("gmToggle");
  if(t){ t.setAttribute("aria-checked",gmOn?"true":"false");
    t.querySelector(".swl").innerHTML=ICO.film+(gmOn?" 진행석 켜짐 (GM)":" 이 기기로 진행하기 (GM)"); }
  const kb=$("gmKeyBtn"); if(kb) kb.style.display=gmOn?"":"none";

  const tp=$("gmToPlay"); if(tp) tp.style.display=myRoleValid()?"":"none";
}

/* ── QA 검수 모드 ──────────────────────────────────────────────────
   좌석이 전부 사람이라 원고를 쓰는 사람은 혼자서 판을 못 본다 — 셋이 다 앉아야 시작되고,
   앉은 뒤에도 자기 배역 하나만 열린다. 그래서 관리자 열쇠(AGENT_KEY, 진행석과 같은 것)로
   들어오면 한 기기가 세 좌석을 동시에 쥐고, 시점을 갈아끼우며 「내 정보」·「내 단서」까지
   그 배역 것으로 통째로 갈아본다.

   실제 판에 이게 켜져 있으면 사고다. 그래서 문은 하나뿐이다 — 주소에 ?qa=1 로 들어올 때만
   켜지고(허브의 관리자 패널이 그 링크를 만든다), 켜져 있는 동안은 화면에 자홍색 띠가
   늘 박혀 있어 눈에 걸린다. */
let qaOn=false, qaRole=null, qaCards=null, qaBusy=false;
try{
  const _qp=new URLSearchParams(location.search);
  if(_qp.get("qa")==="1") localStorage.setItem("pmb.qa","1");
  if(_qp.get("qa")==="0") localStorage.removeItem("pmb.qa");
  qaOn=localStorage.getItem("pmb.qa")==="1";
  qaRole=localStorage.getItem("pmb.qarole")||null;
}catch(e){}
/* 이 판의 배역 id 세 개. 사건마다 수가 달라서 시나리오에서 그대로 읽는다. */
function qaSeats(){ return ((SCEN&&SCEN.characters)||[]).map(c=>c.id); }
/* 세 자리를 한 기기가 쥔다. 서버는 qa 신고 + 열쇠가 맞을 때만 「앞자리 놓기」를 건너뛴다. */
async function qaClaimAll(){
  if(qaBusy) return; qaBusy=true;
  try{
    for(const id of qaSeats()){
      const r=await post("/api/claim",{roleId:id,clientId,qa:true,key:gmKey});
      if(r&&r.error){ banner("QA 좌석 확보 실패 — "+r.error); return; }
    }
    // 열쇠가 안 맞으면 서버는 「앞자리 놓기」를 그대로 해서, 셋을 잡아도 마지막 하나만 남는다.
    // 조용히 실패하면 원인을 찾는 데 한참 걸리므로 여기서 세어보고 말해준다.
    await poll();
    const held=qaSeats().filter(id=>((STATE.roles||{})[id]||{}).mode==="human").length;
    if(held<qaSeats().length){
      banner("QA 좌석 확보 실패 — GM 키가 맞지 않습니다. 「키」로 다시 넣어보세요.");
      return;
    }
    await qaSee(qaSeats()[0]);
    banner("QA — 세 자리를 모두 쥐었습니다. 이대로 시작할 수 있습니다.");
  } finally { qaBusy=false; }
}
/* 시점 갈아끼우기 — 이 기기가 들고 있던 「앞 배역의 것」을 전부 버리고 처음부터 다시 그린다.
   손패도, 어디까지 읽었나도, 퍼즐에 찍어둔 답도 앞 배역 것이 남으면 그 자리에서 검수가 틀어진다. */
async function qaSee(id){
  if(!id) return;
  qaRole=id;
  try{ localStorage.setItem("pmb.qarole",id); localStorage.setItem("pmb.role",id); }catch(e){}
  myRoleId=id;
  myHand=[]; handSeen=null; sheetSeenSeq=null; lobbyBuilt="";
  crAns=[]; askSel=""; acSel=""; belongKeep=[]; trimPick=null; sharePick=null;
  chatDrawn={}; renderPanel._sig=null; lastRev=-1; fxSeq=STATE?STATE.seq:null;
  closeTabs(); document.querySelectorAll(".modal.on").forEach(m=>m.classList.remove("on"));
  await poll();
  if(scr==="lobby") renderLobby(true);
}
/* 끄기 — 흔적을 지우고 새로 연다. 남겨두면 다음 판에 켜진 채로 들어간다. */
function qaOff(){
  try{ localStorage.removeItem("pmb.qa"); localStorage.removeItem("pmb.qarole"); }catch(e){}
  location.href="/play";
}
/* 상단 띠 — 「QA 모드다」와 「지금 누구로 보고 있다」를 한 줄에 같이 박는다. */
function paintQA(){
  const b=$("qabar"); if(!b) return;
  if(!qaOn||!SCEN){ b.hidden=true; b.innerHTML=""; return; }
  b.hidden=false;
  const seats=(SCEN.characters||[]);
  /* 자동조사는 조사 페이즈에서만 통한다(서버가 그 밖에서는 409). 그래도 단추를 감추지는
     않는다 — 안 보이면 「없어졌나」 싶어 찾게 된다. 흐리게 두고, 눌리면 서버가 준 말을 띄운다. */
  const inv=!!(STATE&&STATE.phase&&STATE.phase.key==="invest");
  const chips=seats.map(c=>{
    const held=((STATE&&STATE.roles)||{})[c.id];
    const mine=(myRoleId===c.id);
    const has=!!(held&&held.mode==="human");
    return `<span class="qa-g"><button class="qa-r${mine?" on":""}" style="--rc:${c.color}"${has?"":" disabled"}
      title="${has?esc(c.name)+" 시점으로 보기":"아직 이 자리를 안 쥐었습니다"}"
      onclick="qaSee('${c.id}')">${esc(c.name)}</button>`
      +`<button class="qa-a${inv?"":" dim"}" style="--rc:${c.color}"${has?"":" disabled"}
      title="${esc(c.name)}가 지금 열 수 있는 자리를 전부 조사합니다"
      onclick="qaAuto('${c.id}')">자동조사</button></span>`;
  }).join("");
  const holds=seats.filter(c=>(((STATE&&STATE.roles)||{})[c.id]||{}).mode==="human").length;
  b.innerHTML=`<span class="qa-tag">QA</span><span class="qa-lbl">시점</span>${chips}
    <span class="qa-sp"></span>
    <button class="qa-x hot${inv?"":" dim"}" onclick="qaAuto('')"
      title="좌석에 앉은 배역 전부를 한 번에 돌립니다">전원 자동조사</button>
    <button class="qa-x" onclick="qaAllCards()">카드 전부</button>
    ${holds<seats.length?`<button class="qa-x" onclick="qaClaimAll()">자리 마저 쥐기</button>`:""}
    <button class="qa-x" onclick="qaAskKey()">키</button>
    <button class="qa-x" onclick="qaOff()">QA 끄기</button>`;
}
/* ── QA 자동조사 ───────────────────────────────────────────────────
   3인 판을 혼자 검수하면 조사 페이즈 한 번에 스물한 번을 손으로 눌러야 다음 막이 온다.
   서버에 이미 그걸 대신 해주는 창구(/api/qa/auto)가 있으니 여기서는 부르고, 무엇이
   열렸는지 보여주고, 판을 다시 읽는 것까지만 한다.

   ★ 열쇠는 hostKey() 다. gmKey 를 그대로 쓰면 GM 키를 안 넣고 들어온 로컬 검수판에서
     빈 문자열이 되어 서버가 호스트로 안 봐준다. */
let qaAutoBusy=false;
async function qaAuto(roleId){
  if(qaAutoBusy) return; qaAutoBusy=true;
  try{
    const r=await post("/api/qa/auto",{roleId:roleId||"",key:hostKey(),puzzles:true});
    if(!r||r.error){ banner("자동조사 — "+((r&&r.error)||"실패했습니다")); return; }
    await poll();                       // 판을 다시 읽어야 현황판·손패가 따라온다
    qaAutoLog(r.log||{},roleId);
  } finally { qaAutoBusy=false; }
}
/* 무엇이 열렸는지 그대로 펼친다 — 배너 한 줄로는 스무 줄이 안 들어간다. */
function qaAutoLog(log,roleId){
  const seats=(SCEN&&SCEN.characters)||[];
  const nameOf=id=>{ const c=seats.find(x=>x.id===id); return c?c.name:id; };
  const colOf =id=>{ const c=seats.find(x=>x.id===id); return (c&&c.color)||"var(--gold-b)"; };
  const ids=Object.keys(log);
  let n=0; ids.forEach(id=>{ n+=(log[id]||[]).length; });
  const body=ids.length?ids.map(id=>`<div class="qz"><h4 style="color:${colOf(id)}">${esc(nameOf(id))} · ${(log[id]||[]).length}줄</h4>
      <ol class="qa-log">${(log[id]||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>`).join("")
    :`<div class="qz"><h4>열린 것이 없습니다</h4></div>`;
  const m=document.createElement("div");
  m.className="modal on"; m.onclick=e=>{ if(e.target===m) m.remove(); };
  m.innerHTML=`<div class="box" onclick="event.stopPropagation()">
    <div class="mhead"><div class="mh-t"><span class="mh-eb">QA · 자동조사</span>
      <h2>${roleId?esc(nameOf(roleId)):"전원"} 자동조사</h2><span class="mh-sub">${n}줄 · 조사턴은 실제 판과 똑같이 씁니다</span></div>
      <button class="mh-x" onclick="this.closest('.modal').remove()">${ICO.close}</button></div>
    <div class="mbody qa-list">${body}</div>

      <button class="btn" onclick="this.closest('.modal').remove()">닫기</button></div></div>`;
  document.body.appendChild(m);
}
/* 열쇠 다시 넣기 — QA는 이 열쇠 하나로 서는 모드라, 안 맞으면 아무것도 안 된다. */
async function qaAskKey(){ if(await askGMKey()){ qaCards=null; await poll(); } }
/* 로비 안내판 — 세 자리를 쥐는 문은 여기 하나뿐이다. */
function qaLobbyHTML(){
  if(!qaOn) return "";

  const started=!!(STATE&&STATE.started);

    <div class="qp-d">한 기기가 좌석 <b>${held}/${seats.length}</b>을 쥐고 있습니다.
      ${started?"판이 시작됐습니다 — 상단 띠에서 시점을 갈아끼우세요."
               :"세 자리를 다 쥐면 「이대로 진행하기」가 열립니다."}</div>
    <div class="qp-b">
      ${started?"":`<button class="btn ember sm" onclick="qaClaimAll()">세 자리 모두 쥐기</button>`}
      <button class="btn quiet sm" onclick="qaAllCards()">카드 전부 훑어보기</button>
      <button class="btn quiet sm" onclick="qaAskKey()">GM 키</button>
      <button class="btn quiet sm" onclick="qaOff()">QA 끄기</button></div></div>`;

/* 카드 전문 — /api/admin/cards 를 그대로 쓴다. 검수용으로 이미 있는 창구라 새로 만들지 않는다.
   한 판에 조사할 수 있는 건 절반뿐이라, 원고를 보려면 결국 여기로 와야 한다. */
async function qaLoadCards(){
  if(qaCards) return qaCards;
  const sid=(STATE&&STATE.scenarioId)||(SCEN&&SCEN.scenarioId)||"";
  let d; try{ d=await (await fetch(`/api/admin/cards?scenarioId=${encodeURIComponent(sid)}&key=${encodeURIComponent(gmKey)}`)).json(); }
  catch(e){ d={error:"network"}; }
  if(!d||d.error){ banner("카드 전문을 못 읽었습니다 — GM 키를 확인하세요"+(d&&d.error?` (${d.error})`:"")); return null; }
  qaCards={by:{}, map:d.map||[], cards:d.cards||[]};
  (d.cards||[]).forEach(c=>{ qaCards.by[c.id]=c; });
  return qaCards;
}
async function qaAllCards(){
  const d=await qaLoadCards(); if(!d) return;
  const byLoc={}; d.cards.forEach(c=>{ (byLoc[c.loc]=byLoc[c.loc]||[]).push(c); });
  const zones=d.map.map(z=>{
    const cs=(byLoc[z.loc]||[]).slice().sort((a,b)=>(a.round-b.round)||a.id.localeCompare(b.id));
    if(!cs.length) return "";
    return `<div class="qz"><h4>${esc(z.name||z.loc)} · ${cs.length}장</h4>${cs.map(qaCardHTML).join("")}</div>`;
  }).join("");
  const loose=d.cards.filter(c=>!d.map.some(z=>z.loc===c.loc));
  const m=document.createElement("div");
  m.className="modal on"; m.onclick=e=>{ if(e.target===m) m.remove(); };
  m.innerHTML=`<div class="box" onclick="event.stopPropagation()">
    <div class="mhead"><div class="mh-t"><span class="mh-eb">QA · 조사턴을 쓰지 않습니다</span>
      <h2>조사카드 전부</h2><span class="mh-sub">${d.cards.length}장 · 본문·힌트까지</span></div>
      <button class="mh-x" onclick="this.closest('.modal').remove()">${ICO.close}</button></div>
    <div class="mbody qa-list">${zones}${loose.length?`<div class="qz"><h4>구역 밖</h4>${loose.map(qaCardHTML).join("")}</div>`:""}</div>
    <div class="mfoot"><span class="mf-note">이 창은 손패에도, 조사 기록에도 아무것도 남기지 않습니다.</span>
      <button class="btn" onclick="this.closest('.modal').remove()">닫기</button></div></div>`;
  document.body.appendChild(m);
}
function qaCardHTML(c){
  return `<div class="qc"><b>${esc(c.title||"")}</b><span class="qi">${esc(c.id)} · R${c.round}${c.spot?" · "+esc(c.spot):""}${c.auto?" · 자동공개":""}${c.bait?" · 미끼":""}</span>
    <div class="qt">${esc(c.text||"")}</div>${c.hint?`<div class="qt" style="opacity:.72">힌트 — ${esc(c.hint)}</div>`:""}</div>`;
}
/* 한 장 엿보기 — 현황판에서 아직 아무도 안 연 자리를 눌렀을 때 그 자리에 펴 준다. */
async function qaPeek(id){
  const d=await qaLoadCards(); if(!d) return;
  const c=d.by[id]; if(!c){ banner("그런 카드가 없습니다"); return; }
  const m=document.createElement("div");
  m.className="modal on"; m.onclick=e=>{ if(e.target===m) m.remove(); };
  m.innerHTML=`<div class="box" onclick="event.stopPropagation()">
    <div class="mhead"><div class="mh-t"><span class="mh-eb">QA 엿보기 · ${esc(c.locName||"")}</span>
      <h2>${esc(c.title||"")}</h2><span class="mh-sub">${esc(c.id)} · R${c.round}${c.spot?" · "+esc(c.spot):""}</span></div>
      <button class="mh-x" onclick="this.closest('.modal').remove()">${ICO.close}</button></div>
    <div class="mbody"><div class="qa-peek"><div class="qk">본문</div>${esc(c.text||"")}
      ${c.hint?`<div class="qh">힌트 — ${esc(c.hint)}</div>`:""}
      ${(c.knownBy||[]).length?`<div class="qh">미리 아는 사람 — ${c.knownBy.map(esc).join(", ")}</div>`:""}</div></div>
    <div class="mfoot"><span class="mf-note">조사턴을 쓰지 않았고, 손패에도 안 들어갔습니다.</span>
      <button class="btn" onclick="this.closest('.modal').remove()">닫기</button></div></div>`;
  document.body.appendChild(m);
}

function applyState(){
  if(!STATE)return;
  // 내 배역은 서버 말을 따른다. 로컬 기억과 어긋나면 서버가 맞다 —
  // 잡은 직후 폴링이 먼저 오면 내 카드가 '참여 중'으로 보이던 원인이었다.
  const wasRole=myRoleId;
  if(STATE.myRole!==undefined){
    if(STATE.myRole){ if(myRoleId!==STATE.myRole){ myRoleId=STATE.myRole; localStorage.setItem("pmb.role",myRoleId); } }
    else if(myRoleId){ myRoleId=null; localStorage.removeItem("pmb.role"); }
  } else if(myRoleId&&(!STATE.roles[myRoleId]||STATE.roles[myRoleId].mode!=="human")){
    myRoleId=null; localStorage.removeItem("pmb.role");
  }
  if(myRoleId!==wasRole||sheetSeenSeq===null) loadSheetSeen();   // 배역이 바뀌면 '어디까지 읽었나'도 그 배역 것으로
  // QA 모드에서 아직 시점을 안 고른 채로 자리를 쥐고 있으면, 서버가 잡아준 첫 자리를 시점으로 삼는다.
  if(qaOn&&!qaRole&&myRoleId){ qaRole=myRoleId; try{ localStorage.setItem("pmb.qarole",qaRole); }catch(e){} }
  applyGM();   // 배역이 바뀌면 진행석 쪽 '내 자리' 버튼도 따라 바뀐다
  paintQA();   // 「지금 누구로 보고 있는가」는 폴링마다 다시 박는다
  scanNewZones();   // 새로 열린 구역이 있으면 현황판이 그걸 깜빡인다
  // 오프닝은 화면에도 배역에도 매이지 않는다.
  // 예전엔 플레이 화면의 오프닝 패널이 그릴 때만 열렸는데, 거기로 넘어가는 조건에
  // myRoleValid()가 붙어 있어서 '배역 없는 GM'은 로비에 남고 영영 못 봤다 —
  // 정작 이 연출을 틀어야 할 사람이 GM인데.
  // ★ isBoard() 도 뗐다. 그건 「공용 화면 하나에 틀어준다」는 전제였는데, 이 판은
  //   각자 자기 폰으로 들어오는 3인 온라인이다. 호스트만 오프닝을 보고 나머지 둘은
  //   사건의 발단을 못 본 채 조사에 들어가고 있었다 — 출발선이 어긋난다.
  if(STATE.started&&(STATE.phase||{}).key==="open") openVN(false);
  maybePlayCut();
  extraWatch();
  // 확정되면 각자 제 자리로 — 배역이 있으면 플레이 화면, 배역 없이 진행석만 켠 기기는 진행석으로.
  // 딱 한 번만 밀어준다. 매번 밀면 시작 뒤엔 로비로 못 돌아가서 헤더의 '배역' 버튼이
  // 눌러도 되돌아오는 죽은 버튼이 되고, 진행석 토글도 손댈 수 없다.
  /* ★ 빗장은 «실제로 옮겨간 다음» 에 건다.
     예전엔 조건에 들어오자마자 seated=true 를 박았다. 그런데 시작 직후 폴링 한 번이
     started=true 이면서 아직 내 배역이 안 실려 왔거나(myRoleValid() 거짓) 진행석도
     아닌 상태로 들어올 수 있다 — 그 한 번에 빗장만 걸리고 아무 데도 안 밀린다.
     다음 폴링에서 배역이 실려 와도 !seated 가 거짓이라 지나가고, 판이 시작됐는데
     로비에 갇힌다. 오프닝(#vn)은 화면과 무관한 층이라 그걸 닫으면 로비가 그대로
     드러나서 「다시 배역 선택창이 나온다」로 보였다. */
  if(!STATE.started) seated=false;
  else if(scr==="lobby"&&!seated){
    if(myRoleValid()){ seated=true; go("play"); return; }
    if(gmOn){ seated=true; go("gm"); return; }
  }
  if(scr==="lobby"){ renderLobby(); }
  else if(scr==="gm"){ renderGM(); maybePhaseFx(STATE.phase||{}); }
  else if(scr==="play"){
    const ph=STATE.phase||{};
    // .win 을 같이 적는다 — 여기서 className 을 통째로 갈면 창틀이 벗겨진다
    $("s-play").className="screen win on "+(ph.key||"");
    $("pRoom").textContent=(STATE.roomId||"").slice(1,5).toUpperCase();
    paintSeat();
    // 페이즈 패널
    renderPanel(ph);
    // 채팅
    if($("chatModal").classList.contains("on")) renderChat("chatFull");
    // 소지품 탭은 남이 공개한 카드로도 늘어난다 — 열어둔 채로도 따라 움직여야 한다.
    if((belongLocs().length||hasToolDeck())&&$("handModal").classList.contains("on")
       &&!document.querySelector("#handBox .swipe.drag"))
      showMyHand(handTab);
    // 손패 수는 상단바가 아니라 여기서 센다 — 카드를 여는 자리와 세는 자리가 같아야 한다.
    // 도구는 상한 밖이라 이 숫자에 안 섞는다 — 섞으면 「4/1」처럼 늘 넘친 것으로 보인다.
    $("dkHandN").textContent=`${clueCount()}/${handLimit()}`
      +(belongLocs().length&&belongCards().length?` · ${(SCEN.belongLabel||"소지품").slice(0,3)} ${belongCards().length}`:"")
      +(toolCards().length?` · 도구 ${toolCards().length}`:"");
    const hb=$("dkHand"); hb.classList.toggle("on", overLimit()>0);
    hb.textContent=overLimit()>0?"!":"";
    $("dkSheet").classList.toggle("on",(sheetSeenSeq!=null&&STATE.seq>sheetSeenSeq)||hasUnseenTab());
    paintTimeline();
    centerTurnRail();
    popMyLine();
    paintPodLaunch();
    paintCoach();
    paintChatBadge();
    chatChime();
    // 다음 페이즈·조사 화면·진행석은 ☰ 서랍이 페이즈를 보고 스스로 넣고 뺀다.
    if(ph.key==="invest"&&$("lookModal").classList.contains("on")) closeLook();
    
    maybePhaseFx(ph);
  }
}

/* ☰ 서랍 — 머리띠에 늘 떠 있을 필요가 없는 것들.
   무엇이 지금 가능한지는 여기서 한 번에 보인다(잠긴 것은 아예 안 그린다). */
function openHMenu(){
  const ph=(STATE&&STATE.phase)||{};
  const it=[];
  if(ph.key==="talk"||ph.key==="final"||ph.key==="decision"||ph.key==="reveal")
    it.push([ICO.map,"조사 화면","지금까지 열린 카드와 배치도","openLook()"]);
  const notLast=(SCEN.phases||[]).some(x=>x.seq===((STATE&&STATE.seq)||0)+1);
  if(notLast&&(!STATE||STATE.isHost||STATE.hasHost===false))
    it.push([ICO.next,"다음 막으로",(ph.name||"")+" 끝내고 넘기기","advance()"]);
  else if(notLast)
    it.push([ICO.next,"다음 막으로","호스트가 넘깁니다","0"]);
  it.push([ICO.mask,"배역 화면","맡은 배역을 바꾸거나 확인","go('lobby')"]);
  if(STATE&&STATE.hasHost&&!STATE.isHost)
    it.push([ICO.film,"진행 권한 가져오기",
             STATE.hostStale?"호스트 기기가 응답이 없습니다":"이 기기가 판을 진행합니다","takeHost()"]);
  if(gmOn||localStorage.getItem("pmb.gmkeyset")==="1")
    it.push([ICO.film,"진행석","페이즈 진행·조사 마킹","go('gm')"]);
  it.push([ICO.play,"오프닝 다시 보기","사건이 어떻게 시작됐는지","replayVN()"]);
  // 나가는 길. 호스트가 나가면 방이 닫히므로 말이 달라야 한다 — 여태 이 문이 없어서
  // 브라우저를 닫는 것 말고는 방을 뜨는 방법이 없었다.
  if(STATE&&STATE.isHost) it.push([ICO.warn,"방 삭제하기","모두의 판이 끝나고 기록이 지워집니다","leaveRoom(true)","danger"]);
  else                    it.push([ICO.back,"방 나가기","내 배역을 놓고 사건 목록으로","leaveRoom(false)"]);
  $("hmenuBox").innerHTML=`<div class="hm-t">진행 <b>${esc(ph.name||"")}</b></div>`
    + it.map(([k,t,s2,fn,tone])=>`<button class="hm-i${tone?" "+tone:""}" onclick="closeHMenu();${fn}">
        <span class="k">${k}</span><span>${esc(t)}</span><span class="s">${esc(s2)}</span></button>`).join("")
    + `<button class="hm-i" onclick="closeHMenu()"><span class="k">${ICO.close}</span><span>닫기</span></button>`;
  $("hmenu").classList.add("on");
}
function closeHMenu(){ $("hmenu").classList.remove("on"); }
/* 진행 권한 넘겨받기 — 호스트를 쥔 기기가 창을 닫았거나 저장소를 지웠으면
   아무도 막을 넘길 수 없어 판이 그 자리에 선다. 그 자리를 이어받는 문이다. */
async function takeHost(){
  const stale=!!(STATE&&STATE.hostStale);
  if(!await ask({title:"진행 권한을 가져옵니다",
                 body:stale?"지금 호스트로 지정된 기기가 한참째 응답이 없습니다.\n이 기기가 대신 판을 진행합니다."
                          :"다른 기기가 진행을 맡고 있습니다.\n가져오면 그 기기는 진행 권한을 잃습니다.",
                 warn:stale?"":"같이 하는 사람과 먼저 이야기하세요.",
                 ok:"가져오기", cancel:"그만두기", tone:stale?"cold":"danger"})) return;
  const r=await post("/api/host/claim",{clientId,force:true});
  banner(r&&r.isHost?"이 기기가 진행을 맡습니다.":"가져오지 못했습니다.");
  await poll();
}
/* 나가기. 참가자는 자기 자리만 비우고 떠나고, 호스트는 방을 닫는다. */
async function leaveRoom(isHost){
  if(isHost){
    if(!await ask({title:"방을 삭제합니다",
                   body:"진행 중인 판이 끝나고, 배역·조사 기록·종막 답안이 모두 지워집니다.\n다른 사람들도 함께 나가집니다.",
                   warn:"되돌릴 수 없습니다.", ok:"삭제하고 나가기", cancel:"그만두기", tone:"danger"})) return;
    await post("/api/reset",{clientId,key:hostKey()||localStorage.getItem("pmb.gmkey")||""});
  }else{
    if(!await ask({title:"방에서 나갑니다",
                   body:"내 배역을 놓고 사건 목록으로 돌아갑니다.\n판은 남은 사람들끼리 계속됩니다.",
                   warn:(STATE&&STATE.started)?"시작된 판이라 자리는 그대로 비어 있게 됩니다 — 다시 들어와 이어서 할 수 있습니다.":"",
                   ok:"나가기", cancel:"머물기", tone:"cold"})) return;
    if(myRoleId) await post("/api/release",{roleId:myRoleId,clientId});
  }
  wipeLocal(true);
  location.href="/";
}

/* ===== 페이즈 전환 시네마틱 ===== */
let fxSeq=null;
const FX_KICK={open:"막이 오른다",invest:"조사",talk:"토론",final:"종막",reveal:"진상"};
const TALK_SEQ={3:1,5:1,7:1};
function maybePhaseFx(ph){
  if((scr!=="play"&&scr!=="gm")||!STATE) return;
  if(fxSeq===STATE.seq) return;
  fxSeq=STATE.seq;
  playPhaseFx(ph);
  // 이 막에서 꺼낼 말은 이제 대화창에 그대로 올라가고 팝업이 알려준다(popMyLine).
}
function playPhaseFx(ph){
  if(!ph||!ph.key) return;
  if(ph.key==="invest") return;   // 조사턴엔 전면 플래시 없이 조사 카드에 집중
  const fx=$("phaseFx"); if(!fx) return;
  const inter=(SCEN&&SCEN.interludes)?SCEN.interludes[String(ph.seq)]:"";
  $("fxKick").textContent=FX_KICK[ph.key]||"";
  // 방송 이름은 시나리오가 정한다 — 배에서 '교내방송'이 울리면 안 된다
  $("fxKick").dataset.pa=(SCEN&&SCEN.paLabel)||"교내방송";
  $("fxName").textContent=ph.name||"";
  $("fxLine").textContent=inter||"";
  fx.className="on k-"+ph.key+(inter?" pa":"");
  void fx.offsetWidth;
  fx.classList.add("play");
  const dur=ph.key==="open"?3200:2800;
  clearTimeout(fx._t);
  fx._t=setTimeout(()=>{ fx.className=""; },dur+90);
}

/* AI 배역 진행 (서버 Claude API가 연기) — GM이 눌러 AI 턴 진행 */
/* 종막 답안이 어디까지 왔나. 내 기기에 남긴 것과 서버가 들고 있는 것을 같이 본다 —
   한 기기에서 여럿이 돌려 쓰는 판도 있어서, 로컬만 보면 남의 제출을 못 읽는다. */
function serverAnswersOf(id){ const m=(STATE&&STATE.finalAnswers)||null; return (m&&m[id])||null; }

const ASSET_EXT=["webp","png"];
const ASSET_HIT={};                    // 찾아본 결과는 기억한다 — 컷마다 다시 뒤지지 않게
function findAsset(base, cb){
  if(base in ASSET_HIT){ cb(ASSET_HIT[base]); return; }

/* 효과음은 전부 WebAudio로 즉석 합성한다 — 음원 파일을 얹지 않아 저장소가 가볍고
   오프라인에서도 동일하게 울린다. */
let vnAC=null, vnMuted=false;
try{ vnMuted=localStorage.getItem("pmb.vn.mute")==="1"; }catch(e){}
function vnAudio(){
  if(vnMuted) return null;
  try{
    if(!vnAC) vnAC=new (window.AudioContext||window.webkitAudioContext)();
    if(vnAC.state==="suspended") vnAC.resume();
    return vnAC.state==="running" ? vnAC : null;
  }catch(e){ return null; }
}
function vnTone(freq,dur,type,gain,slideTo){
  const ac=vnAudio(); if(!ac) return;
  const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(gain==null?.14:gain,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.05);
}
function vnNoise(dur,cutFrom,cutTo,gain){
  const ac=vnAudio(); if(!ac) return;
  const n=Math.max(1,Math.floor(ac.sampleRate*dur));
  const buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
  let last=0;                                   // 브라운 노이즈 — 화이트보다 물·굉음에 가깝다
  for(let i=0;i<n;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.2; }
  const t=ac.currentTime, s=ac.createBufferSource(); s.buffer=buf;
  const f=ac.createBiquadFilter(); f.type="lowpass";
  f.frequency.setValueAtTime(cutFrom,t);
  f.frequency.exponentialRampToValueAtTime(Math.max(40,cutTo),t+dur);
  const g=ac.createGain();
  g.gain.setValueAtTime(gain==null?.3:gain,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); s.stop(t+dur);
}
const VN_SFX={
  sonar (){ vnTone(1250,1.6,"sine",.10); setTimeout(()=>vnTone(1250,1.9,"sine",.055),340); },
  hush  (){ vnTone(320,.9,"sine",.05); },
  alarm (){ let i=0; (function beat(){ if(i++>=3||vnMuted) return;
              vnTone(880,.19,"square",.09); setTimeout(()=>vnTone(660,.24,"square",.09),200);
              setTimeout(beat,580); })(); },
  thud  (){ vnTone(140,.75,"sine",.30,38); vnNoise(.5,900,90,.22); },
  static(){ vnNoise(.75,5200,1400,.16); setTimeout(()=>vnNoise(.4,4000,900,.11),380); },
  water (){ vnNoise(2.0,260,1500,.24); },
  rumble(){ vnTone(58,2.6,"sine",.24,34); vnNoise(2.4,320,70,.18); },
  // 등이 하나씩 꺼진다 — 낮은 음 하나가 길게 내려앉고, 그 위로 셋이 짧게 끊긴다
  nightfall(){ vnTone(196,3.2,"sine",.16,74);
    [0,620,1240].forEach((t,i)=>setTimeout(()=>vnTone(330-i*40,.26,"triangle",.07),t+240)); }

/* ── UI 효과음 ────────────────────────────────────────────────
   같은 합성기를 쓴다. 파일을 얹지 않으니 배포가 가볍고 라이선스가 얽히지 않는다.
   나중에 실제 음원을 쓰고 싶으면 /assets/sfx/{키}.ogg 를 올리면 그쪽이 먼저 울린다. */
/* 키 이름은 교체할 음원 파일명과 같게 잡았다 — /assets/sfx/{키}.ogg 를 올리면
   코드를 고치지 않고 그 파일이 대신 울린다. 지금은 전부 합성음이다. */
const UI_SFX={
  equip   (){ vnTone(1180,.045,"triangle",.05,880); },                        // 일반 누름
  decision(){ vnTone(660,.06,"triangle",.07); setTimeout(()=>vnTone(990,.07,"triangle",.06),48); },  // 확정
  cancel  (){ vnTone(520,.07,"sine",.05,330); },                              // 닫기·취소
  book    (){ vnNoise(.10,3400,900,.10); vnTone(430,.09,"sine",.05); },       // 카드가 뒤집힌다
  cursor  (){ vnTone(300,.10,"sine",.06,520); vnNoise(.07,2200,700,.05); },   // 창이 열린다
  buzzer  (){ vnTone(220,.16,"square",.07,150); },                            // 막힌 동작
  bell    (){ vnTone(740,.07,"triangle",.06); setTimeout(()=>vnTone(1110,.13,"triangle",.05),60); },
  chat    (){ vnTone(988,.09,"sine",.055); setTimeout(()=>vnTone(1319,.14,"sine",.045),85); },  // 말이 왔다
  ping    (){ vnTone(1319,.08,"triangle",.05); setTimeout(()=>vnTone(1760,.16,"sine",.04),95); },// 알림이 내려온다
  // ── 사건용 ──────────────────────────────────────────────
  siren   (){ let i=0; (function w(){ if(i++>=3||vnMuted) return;            // 비상·파공
                vnTone(520,.55,"sawtooth",.08,880); setTimeout(()=>vnTone(880,.55,"sawtooth",.08,520),540);
                setTimeout(w,1120); })(); },
  reveal  (){ vnTone(196,.5,"sine",.10); setTimeout(()=>vnTone(294,.7,"sine",.08),150); },  // 진상이 드러난다
  turn    (){ vnTone(880,.07,"sine",.05); setTimeout(()=>vnTone(1320,.09,"sine",.04),70); },// 내 차례
  pod     (){ vnTone(120,.9,"sine",.14,300); vnNoise(.5,1800,400,.10); },     // 잠금이 풀린다
  flood   (){ vnNoise(1.4,300,1400,.16); },                                   // 물이 든다
};
const SFX_ALIAS={tap:"equip", go:"decision", back:"cancel", card:"book", open:"cursor", bad:"buzzer", good:"bell"};
const _sfxFile={};                     // 같은 소리를 매번 새로 만들지 않는다
/* 음원이 실제로 있는지 확인한다. findAsset은 new Image()로 존재를 보는 물건이라
   오디오에는 안 통한다 — HEAD 한 번으로 확인하고, 없으면 합성음 쪽에 맡긴다. */
const AUDIO_EXT=["ogg","m4a","mp3","wav"];
function findAudio(base, cb){
  let i=0;
  (function next(){
    if(i>=AUDIO_EXT.length){ cb(null); return; }
    const url=`${base}.${AUDIO_EXT[i++]}`;
    fetch(url,{method:"HEAD"}).then(r=>r.ok?cb(url):next()).catch(next);
  })();
}
function sfx(key){
  if(vnMuted) return;
  key=SFX_ALIAS[key]||key;
  if(_sfxFile[key]===undefined){
    _sfxFile[key]=null;                        // 찾는 동안에는 합성음으로 때운다
    findAudio(`/assets/sfx/${key}`, url=>{ if(url){ const a=new Audio(url); a.volume=.55; _sfxFile[key]=a; } });
  }
  const a=_sfxFile[key];
  if(a){ try{ a.currentTime=0; a.play().catch(()=>{}); return; }catch(e){} }
  const f=UI_SFX[key]||UI_SFX.equip; try{ f(); }catch(e){}
}
/* ── 탭인가 스와이프인가 ────────────────────────────────────────────
   배역 카드는 카드 «전체» 가 단추이면서 동시에 좌우로 넘기는 트랙이다. 그래서
   「손을 댔다」만으로는 무엇을 하려는지 알 수 없다. 손을 뗄 때까지 보고 가린다:
     · 움직인 거리 10px 미만  — 손가락은 가만히 눌러도 두어 픽셀 떨린다. 5px 는 그
       떨림에 걸려 탭을 놓치고, 20px 는 짧은 스와이프를 탭으로 먹었다. 실제로
       430px 폭에서 40px 스와이프와 제자리 탭을 번갈아 해 보고 10px 로 잡았다.
     · 500ms 이내            — 그보다 길게 누르고 있으면 길게 누르기(선택·확대)다.
   pointercancel(스크롤이 제스처를 가져간 때)에서는 아무것도 아니다.
   ★ 이 판정을 «소리와 선택 둘 다» 가 쓴다. 소리만 가리면 손은 여전히 스와이프 끝의
     click 으로 엉뚱한 배역을 잡는다. */
const TAP_MOVE=10, TAP_MS=500, TAP_STALE=1200;
let _tapPt=null, _tapOk=false;
document.addEventListener("pointerdown",e=>{
  _tapPt={x:e.clientX,y:e.clientY,t:performance.now()}; _tapOk=true;
},{passive:true,capture:true});
document.addEventListener("pointermove",e=>{
  if(!_tapPt||!_tapOk) return;
  if(Math.hypot(e.clientX-_tapPt.x,e.clientY-_tapPt.y)>=TAP_MOVE) _tapOk=false;
},{passive:true,capture:true});
document.addEventListener("pointercancel",()=>{ _tapPt=null; _tapOk=false; },{passive:true,capture:true});
/* "tap" · "swipe" · "keyboard" 셋 중 하나. 손가락 흔적이 없거나 오래됐으면 키보드로 본다 —
   그래야 Enter 로 카드를 고르는 길이 안 막힌다. */
function tapVerdict(e){
  if(!_tapPt) return "keyboard";
  const age=performance.now()-_tapPt.t;
  if(age>TAP_STALE) return "keyboard";
  if(!_tapOk||age>TAP_MS) return "swipe";
  if(e&&e.clientX!=null&&(e.clientX||e.clientY)
     &&Math.hypot(e.clientX-_tapPt.x,e.clientY-_tapPt.y)>=TAP_MOVE) return "swipe";
  return "tap";
}
/* 버튼은 수십 개고 앞으로도 는다. 하나하나 onclick에 심는 대신 문서 전체에서 한 번 듣고
   눌린 것이 무엇인지 보고 소리를 고른다 — 새로 생긴 버튼도 저절로 소리가 난다.
   ★ 소리는 «손을 뗄 때» 난다. pointerdown 에 걸어 두었더니 배역 카드를 스와이프하려고
     손을 대는 순간마다 삑삑거렸다 — 카드 전체가 단추라서 생긴 일이다. */
document.addEventListener("pointerup",e=>{
  if(tapVerdict(e)==="swipe") return;
  const el=e.target.closest&&e.target.closest("button,.dk,.cchip,.swapcard,.rc-go,.rc.tap,.shtab,.tb-chip");
  if(!el||el.disabled) return;
  if(el.closest("#vn")) return;                       // 오프닝은 자기 소리가 따로 있다
  if(el.classList.contains("dk"))            sfx("open");
  else if(el.classList.contains("cchip"))    sfx(el.classList.contains("lock")?"bad":"card");
  else if(el.classList.contains("swapcard")) sfx("card");
  else if(el.classList.contains("mh-x")||/닫기|취소/.test(el.textContent||"")) sfx("back");
  else if(el.classList.contains("gold")||el.classList.contains("ember")) sfx("go");
  else sfx("tap");
},{passive:true});
/* 스와이프 끝에도 브라우저가 click 을 쏘는 기기가 있다 — 그 click 이 카드의 onclick 을
   깨워 엉뚱한 배역을 잡는다. 트랙 위의 카드에서만, 스와이프로 판정된 click 을 막는다. */
document.addEventListener("click",e=>{
  const rc=e.target.closest&&e.target.closest(".role-grid .rc");
  if(!rc) return;
  if(tapVerdict(e)!=="swipe") return;
  e.preventDefault(); e.stopPropagation();
},{capture:true});

/* 배역마다 기본 음높이를 달리 줘서, 말풍선 소리만으로도 누가 말하는지 감이 오게 한다 */
const VN_VOICE={munjaei:520,kangyunseo:645,oserin:470,jinharam:300,yutaeo:585,handokyung:262};
function vnBlip(who){
  const base=VN_VOICE[who]||395;
  vnTone(base*(.94+Math.random()*.12),.045,who?"triangle":"sine",who?.055:.032);
}

/* 브라우저는 사용자 조작 없이 소리를 못 낸다. VN이 열리면 첫 탭에서 한 번만 깨운다. */
function vnArmAudio(){
  let armed=true;
  const go=()=>{
    if(!armed) return;
    const at=vnAt;
    if(!vnAudio()) return;
    armed=false; document.removeEventListener("pointerdown",go,true);
    // 같은 탭이 컷을 넘겼다면 그 컷의 효과음이 알아서 울리므로 겹쳐 울리지 않는다
    setTimeout(()=>{ const c=vnCuts[at];
      if(vnAt===at && c && c.fx && VN_SFX[c.fx]) VN_SFX[c.fx](); },0);
  };
  document.addEventListener("pointerdown",go,true);
}

let vnCuts=[], vnAt=0, vnTimer=null, vnTyping=false, vnIsEvent=false;
function vnBuildCuts(){
  const common=(SCEN&&SCEN.openingCuts)||[];
  // 오프닝도 배역마다 갈릴 수 있다. 서버가 내 몫을 주면 그걸 쓰되, 컷 수는 공통에 맞춘다.
  const mineOpen=(STATE&&STATE.myOpeningCuts)||null;
  const cuts=(mineOpen&&mineOpen.length)?vnEvenOut(mineOpen,common.length,"opening"):common;
  if(cuts.length) return cuts.map(c=>({img:c.img||"",who:c.who||"",fx:c.fx||"",lines:c.lines||[],focus:c.focus||""}));
  const ls=String((SCEN&&SCEN.intro)||"").split("\n").map(s=>s.trim()).filter(Boolean);
  const out=[]; for(let i=0;i<ls.length;i+=2) out.push({img:"",who:"",fx:"",lines:ls.slice(i,i+2)});
  return out;
}
/* "이미 봤다"는 판(roomId) 단위로만 기억한다.
   예전엔 시나리오 이름으로 기억해서, 한 번 본 브라우저는 다음 판에도 안 나왔다.
   서버가 roomId를 안 주는(옛 배포) 경우엔 저장하지 않고 이 세션 안에서만 기억한다 —
   기억할 근거가 없는데 옛 표시에 걸려 영영 안 나오는 것보다 낫다. */
let vnPlayed=null;
function vnSeenKey(){ const rid=(STATE&&STATE.roomId)||""; return rid?("pmb.vn."+rid):""; }
function vnWasSeen(){
  const rid=(STATE&&STATE.roomId)||"-";
  if(vnPlayed===rid) return true;
  const k=vnSeenKey();
  return !!(k&&localStorage.getItem(k));
}
function vnMarkSeen(){
  vnPlayed=(STATE&&STATE.roomId)||"-";
  const k=vnSeenKey(); if(k){ try{ localStorage.setItem(k,"1"); }catch(e){} }
}
/* 조사 중에 끼어드는 짧은 컷. 오프닝과 같은 재생기를 쓰되 «봤다» 기억을 따로 둔다.
   판(roomId)+컷id로 기억해서, 새로고침해도 같은 컷이 다시 뜨지 않는다. */
let cutSeen=new Set();
function cutKey(id){ const r=(STATE&&STATE.roomId)||"-"; return `pmb.cut.${r}.${id}`; }
function cutWasSeen(id){
  if(cutSeen.has(id)) return true;
  try{ return !!localStorage.getItem(cutKey(id)); }catch(e){ return false; }
}
function cutMarkSeen(id){ cutSeen.add(id); try{ localStorage.setItem(cutKey(id),"1"); }catch(e){} }
/* 이 묶음에서 쓸 배경과 얼굴을 미리 받아둔다.
   findAsset 은 받아온 주소를 기억하므로, 컷이 넘어갈 때는 이미 캐시에 있다.
   안 그러면 첫 컷에서 그림이 뒤늦게 얹히면서 흔들림 연출과 겹쳐 화면이 툭툭 끊긴다. */
function vnPrefetch(){
  const sid=(STATE&&STATE.scenarioId)||""; if(!sid) return;
  const imgs=new Set(), who=new Set();
  for(const c of vnCuts){ if(c.img) imgs.add(c.img); if(c.who) who.add(c.who); }
  imgs.forEach(x=>findAsset(`/assets/${sid}_opening_${x}`,()=>{}));
  who.forEach(x=>findAsset(`/assets/${sid}_portrait_${x}`,()=>{}));
}
function playCuts(cuts){
  if($("vn").classList.contains("on")) return false;   // 오프닝이 도는 중엔 끼어들지 않는다
  if(!cuts||!cuts.length) return false;
  vnCuts=cuts.map(c=>({img:c.img||"",who:c.who||"",fx:c.fx||"",lines:c.lines||[],focus:c.focus||""}));
  vnPrefetch();                                        // 그림을 미리 받아둔다 — 첫 컷이 덜컹이지 않게
  vnAt=0; vnIsEvent=true;
  $("vnMute").innerHTML=(vnMuted?ICO.mute:ICO.sound)+' <span class="vn-ml">소리</span>';
  $("vn").classList.add("on"); vnArmAudio(); vnRender();
  return true;
}
/* ── 배역마다 다른 컷 ─────────────────────────────────────────────
   개발자 개입 같은 막에서는 당사자와 나머지가 «다른 것»을 봐야 한다. 서버가 그 사람
   몫을 STATE.myCuts 로 따로 내려주면 같은 id 의 공통 컷을 그것으로 갈아 끼운다.
   안 내려오면 예전처럼 공통 컷(STATE.cuts)이 전원에게 그대로 돈다.

   ★ 갈래마다 «컷 수와 재생 시간이 같아야» 한다. 한쪽이 짧으면 화면만 보고도 어느
     갈래인지가 새고, 「개발자가 없는 판」에서 컷을 건너뛰면 그 사실이 전원에게
     공지된다. 그래서 여기서 컷 수를 공통 컷에 맞춰 두는 안전판을 둔다 — 이게 걸리면
     시나리오가 잘못 쓰인 것이므로 콘솔에 남긴다. */
function vnEvenOut(cuts, n, id){
  const out=(cuts||[]).slice();
  if(!n||out.length===n) return out;
  console.warn(`[vn] 「${id}」 갈래마다 컷 수가 다릅니다 — 내 몫 ${out.length}컷 / 공통 ${n}컷.`
    +" 화면만 보고는 어느 갈래인지 알 수 없어야 합니다. 시나리오에서 컷 수를 맞춰주세요.");
  out.length=Math.min(out.length,n);
  while(out.length<n){ const last=out[out.length-1]||{}; out.push({img:last.img||"",who:"",fx:"",lines:[]}); }
  return out;
}
/* 지금 이 화면이 틀 컷 목록. 공통 컷 위에 내 몫을 덮어쓴 것이다. */
function cutQueue(){
  const common=(STATE&&STATE.cuts)||[];
  const mine=(STATE&&STATE.myCuts)||[];
  if(!mine.length) return common;
  const left={}; mine.forEach(c=>{ if(c&&c.id) left[c.id]=c; });
  const out=common.map(c=>{
    const m=left[c.id]; if(!m) return c;
    delete left[c.id];
    return {id:c.id, cuts:vnEvenOut(m.cuts,(c.cuts||[]).length,c.id)};
  });
  // 공통에 짝이 없는 내 몫(나만 보는 밤의 결과 같은 것)은 뒤에 그대로 붙인다
  mine.forEach(c=>{ if(c&&c.id&&left[c.id]) out.push(c); });
  return out;
}
/* 폴링마다 불린다. 아직 안 본 컷 중 가장 오래된 것 하나만 튼다 —
   여러 개가 한꺼번에 밀려도 한 번에 하나씩, 조사 중이 아니면 아예 안 튼다. */
function maybePlayCut(){
  if(!STATE||!STATE.started) return;
  if((STATE.phase||{}).key==="open") return;          // 오프닝 자리는 오프닝 것이다
  if($("vn").classList.contains("on")) return;
  if(document.querySelector(".modal.on")) return;     // 카드 읽는 중에 화면을 뺏지 않는다
  const q=cutQueue().filter(c=>!cutWasSeen(c.id));
  if(!q.length) return;
  const c=q[0];
  cutMarkSeen(c.id);                                   // 열 때 표시한다 — 중간에 껐다 켜도 반복되지 않게
  if(c.id==="pod") sfx("pod");
  else if(c.id.indexOf("crisis")===0) sfx("siren");
  playCuts(c.cuts);
}

function openVN(force){
  // 이미 재생 중이면 손대지 않는다. 폴링(1.5초)마다 여기로 들어오는데 그때마다
  // vnAt=0으로 되감겨서 오프닝이 처음부터 다시 시작되고 있었다.
  if($("vn").classList.contains("on")) return;
  vnCuts=vnBuildCuts();
  if(!vnCuts.length){ console.warn("[vn] 재생할 컷이 없습니다 — 시나리오에 openingCuts가 있는지 확인"); return; }
  if(!force&&vnWasSeen()) return;
  vnMarkSeen();          // 닫을 때가 아니라 열 때 표시한다 — 중간에 새로고침해도 다시 안 튼다
  vnAt=0; vnIsEvent=false;
  $("vnMute").innerHTML=(vnMuted?ICO.mute:ICO.sound)+' <span class="vn-ml">소리</span>';
  $("vn").classList.add("on"); vnArmAudio(); vnRender();
}
/* 피해자는 배역도 NPC도 아니라 따로 세운다. 이름도 색도 피해자 카드에서 가져온다 —
   여기에 색을 박아두면 다른 사건에서 그 사람만 엉뚱한 색으로 선다. */
function vnVictimSpeaker(){
  const v=(SCEN&&SCEN.victimCard)||{};
  return {id:"victim", name:v.name||"피해자", job:"", color:v.color||"#b9a98f", avatar:""};
}
/* ── 대사 안의 인물 이름에 그 사람의 키컬러 ──────────────────────────
   이름표(#vnName)는 이미 화자의 색으로 서 있는데, 대사 «본문»에 나오는 이름은 흰
   글자였다. 오프닝에서 죽은 데이스트의 이름이 나올 때 그게 사람 이름인지 물건인지
   구분이 안 됐다.

   ★ 이름 목록은 시나리오에서 만든다 — 배역·NPC·피해자. 색도 거기서 읽는다.
   ★ 긴 이름부터 치환한다. 「데이」가 먼저 걸리면 「데이스트」가 앞 두 글자만 물든다.
   ★ 치환은 «HTML 이스케이프 뒤에» 한다. 순서를 바꾸면 이름이 든 대사 한 줄로
     마크업을 넣을 수 있다 — 대사는 원고에서 오지만 규칙은 규칙이다.
   ★ 색값도 그대로 안 쓴다. 속성 안에 들어가는 값이라 흰 목록으로 거른다. */
let vnNameSid=null, vnNameRe=null, vnNameCol=null;
function vnNameSafeColor(c){ return /^#[0-9a-fA-F]{3,8}$/.test(String(c||"")) ? String(c) : ""; }
function vnNamesBuild(){
  const sid=(SCEN&&SCEN.scenarioId)||"";
  if(vnNameSid===sid&&vnNameRe!==null) return;
  vnNameSid=sid; vnNameCol={};
  const add=c=>{ const col=vnNameSafeColor(c&&c.color); if(c&&c.name&&col) vnNameCol[c.name]=col; };
  ((SCEN&&SCEN.characters)||[]).forEach(add);
  ((SCEN&&SCEN.npcs)||[]).forEach(add);
  add((SCEN&&SCEN.victimCard)||null);
  const ns=Object.keys(vnNameCol)
    .sort((a,b)=>b.length-a.length)                      // 긴 이름부터
    .map(n=>esc(n).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  vnNameRe=ns.length?new RegExp(ns.join("|"),"g"):false;
}
/* ★ 이미 이스케이프된 글자에만 쓴다. */
function vnHi(html){
  vnNamesBuild();
  if(!vnNameRe) return html;
  return String(html).replace(vnNameRe,m=>{
    // 이스케이프된 글자를 되돌려 색을 찾는다 — 목록의 키는 원문 이름이다.
    const key=Object.keys(vnNameCol).find(n=>esc(n)===m);
    const col=key?vnNameCol[key]:"";
    return col?`<span class="vn-nm" style="--nc:${col}">${m}</span>`:m;
  });
}
/* 이 줄에 물들일 이름이 있는가 — 없으면 타자 연출은 예전처럼 textContent 만 만진다.
   한 글자마다 innerHTML 을 다시 넣는 건 이름이 실제로 든 줄에서만 치른다. */
function vnHasName(txt){ vnNamesBuild(); if(!vnNameRe) return false;
  vnNameRe.lastIndex=0; return vnNameRe.test(esc(txt)); }
function vnRender(){
  const cut=vnCuts[vnAt]; if(!cut) return;
  const sid=(STATE&&STATE.scenarioId)||"";
  const stage=$("vnStage"), bg=$("vnBg"), sp=$("vnSprite"), emo=$("vnEmo");

  bg.className="vn-bg "+(cut.img||"");
  bg.style.backgroundImage="";
  // 16:9 원본을 세로 화면에 깔면 좌우가 잘린다. 컷이 focus 를 주면 그쪽을 남긴다.
  bg.style.backgroundPosition=({left:"20% center",right:"80% center",
                                top:"center 20%",bottom:"center 80%"}[cut.focus])||"center";
  bg.classList.remove("show"); void bg.offsetWidth; bg.classList.add("show");
  if(sid&&cut.img){
    // 이미지가 실제로 있을 때만 덧입힌다(없으면 위의 그라데이션이 그대로 남는다)
    findAsset(`/assets/${sid}_opening_${cut.img}`, url=>{
      if(url && vnCuts[vnAt]===cut) bg.style.backgroundImage=`url("${url}")`;
    });
  }

  // 화자 — 스프라이트·이름표·강조색
  const ch=cut.who ? (((SCEN.characters||[]).find(c=>c.id===cut.who))
                     || ((SCEN.npcs||[]).find(c=>c.id===cut.who))
                     || (cut.who==="victim" ? vnVictimSpeaker() : null)) : null;
  const root=$("vn");
  root.classList.toggle("speak",!!ch);
  sp.classList.remove("show"); emo.classList.remove("show");
  if(ch){
    $("vnName").textContent=ch.name+(ch.job?" · "+ch.job:"");
    root.style.setProperty("--spk",ch.color||"#c9c2b4");
    emo.textContent=ch.avatar||"";
    if(sid){
      findAsset(`/assets/${sid}_portrait_${ch.id}`, url=>{
        if(vnCuts[vnAt]!==cut) return;
        if(url){ sp.src=url; sp.classList.add("show"); }
        else { emo.classList.add("show"); }
      });
    } else { emo.classList.add("show"); }
  } else {
    root.style.removeProperty("--spk");
  }

  // 연출 큐 — 클래스를 지웠다 다시 붙여야 애니메이션이 처음부터 다시 돈다
  stage.className="vn-stage"; void stage.offsetWidth;
  if(cut.fx){
    stage.classList.add("fx-"+cut.fx);
    const play=VN_SFX[cut.fx]; if(play) play();
  }

  $("vnDots").innerHTML=vnCuts.map((_,i)=>`<span class="vn-dot${i===vnAt?" on":""}"></span>`).join("");
  vnType(cut.lines||[], cut.who||"");
}
/* 한 글자씩 찍는다. 문장부호에서 한 박자 쉬어야 대사로 읽힌다.
   글자를 덧붙이는 게 아니라 전체를 깔아두고 안 읽은 쪽을 감추는 방식이라,
   타자가 진행돼도 줄갈이가 처음 잡힌 그대로 유지된다. */
function vnLineHTML(txt,shown){
  return `<span class="vn-on">${vnHi(esc(txt.slice(0,shown)))}</span>`+
         `<span class="vn-off">${esc(txt.slice(shown))}</span>`;
}
function vnType(lines,who){
  const host=$("vnLines");
  host.innerHTML=lines.map(t=>`<div class="vn-line">${vnLineHTML(t,0)}</div>`).join("");
  const els=Array.prototype.slice.call(host.children);
  // 두 조각(읽은 쪽·안 읽은 쪽)은 처음 한 번만 만들고, 이후엔 그 안의 글자만 바꾼다.
  // 예전엔 한 글자마다 innerHTML을 다시 넣어 줄 전체를 파싱하고 배치를 다시 계산했다.
  const pair=els.map(el=>[el.querySelector(".vn-on"),el.querySelector(".vn-off")]);
  const hasNm=lines.map(vnHasName);
  let li=0, ci=0;
  vnTyping=true; vnHintText();
  const step=()=>{
    if(li>=lines.length){ vnTyping=false; vnHintText(); return; }
    const txt=lines[li], el=els[li], [on,off]=pair[li];
    if(ci===0) el.classList.add("typing");
    if(ci>=txt.length){ el.classList.remove("typing"); li++; ci=0; vnTimer=setTimeout(step,360); return; }
    const ch=txt.charAt(ci); ci++;
    // 이름이 든 줄만 색을 입힌다. 아직 반만 찍힌 이름은 안 걸리므로, 이름이
    // 다 찍히는 순간 그 자리에 색이 들어온다 — 타자와 같은 박자다.
    if(hasNm[li]) on.innerHTML=vnHi(esc(txt.slice(0,ci)));
    else on.textContent=txt.slice(0,ci);
    off.textContent=txt.slice(ci);
    if(ci%3===0) vnBlip(who);
    vnTimer=setTimeout(step, ".…—?!,".indexOf(ch)>=0 ? 165 : 34);
  };
  clearTimeout(vnTimer); step();
}
function vnHintText(){
  $("vnHint").textContent = vnTyping ? "탭하면 전체 표시"
    : (vnAt>=vnCuts.length-1 ? "탭하면 시작합니다" : "화면을 탭하면 다음");
}
/* 탭 한 번은 "지금 찍는 글자 전부 표시", 그다음 탭이 다음 컷 */
function vnAdvance(){
  if(vnTyping){
    clearTimeout(vnTimer); vnTyping=false;
    const cut=vnCuts[vnAt]||{};
    $("vnLines").innerHTML=(cut.lines||[]).map(l=>
      `<div class="vn-line">${vnLineHTML(l,l.length)}</div>`).join("");
    vnHintText(); return;
  }
  if(vnAt>=vnCuts.length-1){ vnClose(); return; }
  vnAt++; vnRender();
}
function vnClose(){
  clearTimeout(vnTimer); vnTyping=false;
  $("vn").classList.remove("on");
  if(!vnIsEvent) vnMarkSeen();
  vnIsEvent=false;
}
/* 오프닝을 트는 화면인가 — 호스트 화면이거나, 호스트를 아무도 안 잡은 방이면 그 화면이 곧 보드다.
   isHost만 보면 호스트를 claim하지 않은 방에서는 아무에게도 오프닝이 안 뜬다. */
function isBoard(){ return !!(STATE && (STATE.isHost || !STATE.hasHost)); }
function replayVN(){ openVN(true); }

/* 배치도 SVG는 한 번만 받아 캐시한다. <img>가 아니라 인라인이어야
   텍스트를 숨기거나(레이아웃만) 포드를 감출 수 있다. */
let MAPSVG;
async function loadMapSVG(){
  if(MAPSVG!==undefined) return MAPSVG;
  const sid=(STATE&&STATE.scenarioId)||"";
  try{ const r=await fetch(`/assets/${sid}_map.svg`); MAPSVG = r.ok ? await r.text() : ""; }
  catch(e){ MAPSVG=""; }
  return MAPSVG;
}
function mapHTML(svg,cls){ return svg?`<div class="mapwrap ${cls||""}">${svg}</div>`:""; }
/* 같은 배치도를 두 군데(바깥 지도 + 구역 안 약식 지도)에 동시에 얹으면 id가 겹친다.
   약식 쪽 id에 m- 을 붙여 갈라놓는다 — clip-path 참조까지 같이 옮겨야 한다. */
function miniSVG(txt){
  return txt.replace(/\bid="([^"]+)"/g,'id="m-$1"').replace(/url\(#([^)]+)\)/g,'url(#m-$1)');
}

/* 구역 안으로 들어간다 — 그 자리에서 볼 수 있는 곳들이 나온다 */
/* ── 구역 안의 장면 ────────────────────────────────────────────────
   지도에서 구역을 누르면 그 방을 본다. 카드는 그림 위의 핀이고, 핀을 눌러야
   「무엇을 뒤지는가」가 나오고 거기서 조사가 시작된다. 내용은 여전히 조사한 사람만 본다.
   방 그림이 없으면 예전 목록으로 그대로 되돌아간다 — 에셋이 없어도 게임은 돈다. */
let roomAt=null;                     // 지금 서 있는 방의 key
function roomsAll(){ return (SCEN.rooms||[]); }
function roomByKey(k){ return roomsAll().find(r=>r.key===k)||null; }
function roomHome(loc){ return roomsAll().find(r=>r.loc===loc&&!r.from)||null; }
function roomSubs(key){ return roomsAll().filter(r=>r.from===key); }
/* 이 방에 서는 카드. 하위 방에 적힌 카드는 상위 방에서 빠진다. */
function roomCards(room){
  const claimed=new Set(); roomsAll().forEach(r=>(r.cards||[]).forEach(id=>claimed.add(id)));
  const all=zoneCards(room.loc);
  return (room.cards&&room.cards.length)
    ? all.filter(c=>room.cards.indexOf(c.id)>=0)
    : all.filter(c=>!claimed.has(c.id));
}
/* 핀 자리. 시나리오가 좌표를 주면 그걸 쓰고, 없으면 카드 id로 흩어놓는다 —
   아무 데나 겹쳐 놓이지 않게 결정적으로 계산한다(같은 카드는 늘 같은 자리). */
function pinAt(id, i, n){
  const fixed=(SCEN.pins||{})[id];       // 시나리오가 실제 물건 위에 찍어둔 자리
  if(fixed&&fixed.length===2) return fixed;
  const h=[...id].reduce((a,c)=>((a*31+c.charCodeAt(0))>>>0),7);
  const col=n<=4?2:3, row=Math.floor(i/col), colN=i%col;
  const x=12+(colN+.5)*(76/col)+((h%9)-4);
  const y=24+row*17+((h>>4)%5);
  // 아래 띠는 문 핀 자리다. 카드가 거기까지 내려오면 서로 겹친다.
  return [Math.max(8,Math.min(92,x)), Math.max(18,Math.min(70,y))];
}
function openRoom(key){
  const room=roomByKey(key); if(!room) return;
  roomAt=key;
  findAsset(`/assets/${STATE.scenarioId}_room_${room.art}`, url=>{
    if(!url){ openZoneList(room.loc); return; }     // 그림이 없으면 목록으로
    paintRoom(room, url);
  });
}
function paintRoom(room, url){
  const cards=roomCards(room);
  const done=cards.filter(c=>{ const k=cardState(c).k; return k!=="open"&&k!=="lock"; }).length;
  const pins=cards.map((c,i)=>{
    const st=cardState(c), p=pinAt(c.id,i,cards.length);
    const seen=(st.k!=="open"&&st.k!=="lock");
    return `<button class="pin ${st.k} ${seen?"seen":""} ${p[0]>55?"rt":""}" style="left:${p[0]}%;top:${p[1]}%"
      onclick="event.stopPropagation();showSpot('${c.id}')" title="${esc(c.spot||"")}">
      <i></i><span>${esc(c.spot||room.name)}</span></button>`; }).join("");
  const doors=roomSubs(room.key).filter(r=>!r.needPod||podMarked()).map(r=>{
    const at=(r.at&&r.at.length)?r.at:[88,64];
    return `<button class="pin door" style="left:${at[0]}%;top:${at[1]}%"
      onclick="event.stopPropagation();openRoom('${r.key}')"><i></i><span>${esc(r.name)} ›</span></button>`;
  }).join("");
  const back=room.from?`<button class="btn sm" onclick="openRoom('${room.from}')">‹ ${esc((roomByKey(room.from)||{}).name||"")}</button>`:"";
  $("mapBox").innerHTML=`<div class="mhead">
      <div class="mh-t"><span class="mh-eb">구역 안</span>
        <h2>${esc(room.name)}</h2>
        <span class="mh-sub">볼 곳 ${cards.length} · 확인 ${done}${room.note?" · "+esc(room.note):""}</span></div>
      <button class="mh-x" onclick="closeModal('mapModal')" aria-label="닫기">${ICO.close}</button></div>
    <div class="mbody rb"><div class="room"><img src="${url}" alt="" decoding="async">${pins}${doors}</div>
      <div class="panel-note" style="margin-top:9px">그림 위의 표시를 누르면 그 자리를 살펴봅니다.</div></div>
    <div class="mfoot">${back}<button class="btn" onclick="roomWide('${room.key}')">${ICO.expand} 가로로</button>
      <button class="btn" onclick="openZoneList('${room.loc}')">목록으로</button></div>`;
  $("mapBox").style.setProperty("--mt","var(--cold)");
  openModal("mapModal");
}
/* 가로로 보기 — 16:9 방을 세로 폰에 그대로 얹으면 손바닥만 해진다. 화면 회전은 강제할 수
   없으니 우리가 돌린다. 폰을 옆으로 눕히면 그대로 꽉 찬 방이 된다. */
function roomWide(key){
  const room=roomByKey(key); if(!room) return;
  findAsset(`/assets/${STATE.scenarioId}_room_${room.art}`, url=>{
    if(!url) return;
    const cards=roomCards(room);
    const pins=cards.map((c,i)=>{ const st=cardState(c), p=pinAt(c.id,i,cards.length);
      const seen=(st.k!=="open"&&st.k!=="lock");
      return `<button class="pin ${st.k} ${seen?"seen":""} ${p[0]>55?"rt":""}" style="left:${p[0]}%;top:${p[1]}%"
        onclick="showSpot('${c.id}')"><i></i><span>${esc(c.spot||room.name)}</span></button>`; }).join("");
    const doors=roomSubs(room.key).filter(r=>!r.needPod||podMarked()).map(r=>{
      const at=(r.at&&r.at.length)?r.at:[88,84];
      return `<button class="pin door" style="left:${at[0]}%;top:${at[1]}%"
        onclick="closeWide();openRoom('${r.key}');roomWide('${r.key}')"><i></i><span>${esc(r.name)} ›</span></button>`;
    }).join("");
    const w=document.createElement("div");
    w.className="roomfs"; w.id="roomFS";
    w.innerHTML=`<div class="rfs-rot"><div class="room">${`<img src="${url}" alt="">`}${pins}${doors}
        <div class="rfs-bar"><b>${esc(room.name)}</b>
          ${room.from?`<button class="btn sm" onclick="closeWide();openRoom('${room.from}');roomWide('${room.from}')">‹ 나가기</button>`:""}
          <button class="btn sm" onclick="closeWide()">${ICO.close} 세로로</button></div></div></div>`;
    document.body.appendChild(w);
    sizeWide();
  });
}
function closeWide(){ const w=$("roomFS"); if(w) w.remove(); }
function sizeWide(){
  const w=$("roomFS"); if(!w) return;
  const r=w.querySelector(".rfs-rot"); if(!r) return;
  // 세로로 들고 있으면 돌려서 채우고, 이미 가로면 그대로 둔다.
  const portrait=innerHeight>innerWidth;
  r.style.width=(portrait?innerHeight:innerWidth)+"px";
  r.style.height=(portrait?innerWidth:innerHeight)+"px";

}

function showSpot(id){

/* 토론·종막 중에도 조사 화면을 열어본다 — 조사 페이즈에서 보던 배치도·구역·조사 현황

   감싸는 창 하나만 있으면 된다. 조사 자체는 자기 차례가 아니면 서버가 막으니 여기서는

function openLook(){

/* 지도만 크게 — 글자까지 있는 전체 배치도, 끌어서 이동·확대 */
let mz={s:1,x:0,y:0};
async function openMapDetail(){
  const svg=await loadMapSVG();
  if(!svg){ banner("배치도를 불러오지 못했습니다"); return; }
  mz={s:1,x:0,y:0};
  $("mapBox").innerHTML=`<div class="mhead">
      <div class="mh-t"><span class="mh-eb">배치도</span><h2>${ICO.map} 배치도</h2>
        <span class="mh-sub">끌어서 옮기고 확대합니다</span></div>
      <button class="mh-x" onclick="closeModal('mapModal')" aria-label="닫기">${ICO.close}</button></div>
    <div class="mbody"><div class="mzoom" id="mzoom"><div class="mvp" id="mvp">${mapHTML(svg,podMarked()?"":"nopod")}</div></div></div>
    <div class="mfoot"><span class="mf-note" id="mzPct">100%</span>
      <button class="btn sm" onclick="mzZoom(-1)">－</button>
      <button class="btn sm" onclick="mzZoom(1)">＋</button>
      <button class="btn sm" onclick="mzReset()">처음으로</button>
      <button class="btn" onclick="closeModal('mapModal')">닫기</button></div>`;
  $("mapBox").style.setProperty("--mt","var(--cold)");
  openModal("mapModal"); wireZoom();
}
function mzApply(){ const v=$("mvp"); if(!v) return;
  v.style.transform=`translate(${mz.x}px,${mz.y}px) scale(${mz.s})`;
  const pct=$("mzPct"); if(pct) pct.textContent=Math.round(mz.s*100)+"%"; }
function mzZoom(dir,cx,cy){
  const box=$("mzoom"); if(!box) return;
  const r=box.getBoundingClientRect();
  const px=(cx==null?r.width/2:cx-r.left), py=(cy==null?r.height/2:cy-r.top);
  const ns=Math.max(1,Math.min(5,mz.s*(dir>0?1.25:1/1.25)));
  mz.x=px-(px-mz.x)*(ns/mz.s); mz.y=py-(py-mz.y)*(ns/mz.s); mz.s=ns;
  if(mz.s===1){ mz.x=0; mz.y=0; } mzApply(); }
function mzReset(){ mz={s:1,x:0,y:0}; mzApply(); }
function wireZoom(){
  const box=$("mzoom"); if(!box) return;
  const pts=new Map(); let last=0, from=null;
  box.addEventListener("pointerdown",e=>{ box.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); box.classList.add("drag");
    if(pts.size===2){ const [a,b]=[...pts.values()]; last=Math.hypot(a.x-b.x,a.y-b.y); from=mz.s; } });
  box.addEventListener("pointermove",e=>{
    const prev=pts.get(e.pointerId); if(!prev) return;
    const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(last>0){ const r=box.getBoundingClientRect();
        const ns=Math.max(1,Math.min(5,from*(d/last)));
        const cx=(a.x+b.x)/2-r.left, cy=(a.y+b.y)/2-r.top;
        mz.x=cx-(cx-mz.x)*(ns/mz.s); mz.y=cy-(cy-mz.y)*(ns/mz.s); mz.s=ns;
        if(mz.s===1){ mz.x=0; mz.y=0; } mzApply(); } }
    else if(mz.s>1){ mz.x+=dx; mz.y+=dy; mzApply(); } });
  const end=e=>{ pts.delete(e.pointerId); if(pts.size<2) last=0;
    if(!pts.size) box.classList.remove("drag"); };
  box.addEventListener("pointerup",end); box.addEventListener("pointercancel",end);
  box.addEventListener("wheel",e=>{ e.preventDefault(); mzZoom(e.deltaY<0?1:-1,e.clientX,e.clientY); },{passive:false});
}


const FLIP_PORTRAIT={submarine:["yutaeo"]};
/* ── 초상 크롭 표 ────────────────────────────────────────────────
   생성기가 오른쪽 아래 모서리에 별 워터마크를 박아 넣는다. 《데이의 규칙》 네 장은
   전부 같은 자리다 — 원본 765×1024 기준 x 642~682(83.9~89.2%), y 901~941(88.0~91.9%).
   [배율, 창의 위 가장자리]로 적는다. 보이는 세로 구간은 [f(1−1/z), f+(1−f)/z] 이고,
   여기 값은 아래끝이 전부 0.75 언저리라 그 모서리가 화면 밖으로 나간다.
   배율을 하나로 통일하지 않은 이유: 데이비드는 머리가 화면 맨 위에 붙어 있어 크게
   당기면 정수리가 잘린다.
   ※ 데이지는 그림을 다시 받았다(2026-08-05). 예전 것은 «전신이 작게» 그려져 있어
     1.82 배까지 당겨야 얼굴이 잡혔는데, 새 그림은 나머지 셋과 같은 허리 위 구도라
     1.30 이면 된다. 별도 이 그림에서는 세로 85.9% 부터 시작하므로, 보이는 아래끝
     79.2% 로 넉넉히 밖에 남는다. */
const PORTRAIT_CROP={
  rule_the_day:{ david:[1.43,6.6], damon:[1.43,16.6], daisy:[1.30,10.0], victim:[1.49,9.1] }
};
/* 표에 없는 사건도 별은 잘려 나가야 한다 — 보이는 구간이 세로 4~69%인 안전값 */

/* 초상을 얼굴 쪽으로 잘라 동그랗게 쓴다.

/* ── 에셋 판 표시 ────────────────────────────────────────────────
   그림을 갈아 끼워도 파일 이름이 같으면 브라우저는 옛것을 계속 보여준다.
   데이지 초상을 새로 넣고도 폰에서는 옛 그림이 그대로 뜨던 자리다.
   배포마다 바뀌는 값(빌드 sha)을 뒤에 달아 그때만 새로 받게 한다 —
